<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業系データ解析・記録管理ツール</title>
    <!-- iPhoneホーム画面対応メタタグ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="作業解析ツール">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/3b82f6/ffffff?text=Work">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-1.5 rounded transition font-medium">
                    ← ポータルへ戻る
                </a>
                <h1 class="text-lg font-bold tracking-wider">作業系データ解析・記録管理ツール</h1>
            </div>
            <div class="text-xs text-indigo-200">
                Revision: v1.2.0
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左側：入力・取り込みセクション (1カラム) -->
        <section class="lg:col-span-1 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col space-y-4">
            <h2 class="text-base font-bold text-slate-700 border-b pb-2 flex items-center justify-between">
                <span>データ入力・取り込み</span>
                <span id="edit-mode-badge" class="hidden text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-normal">編集モード</span>
            </h2>
            <input type="hidden" id="edit-id" value="">

            <!-- 自由入力テキスト（パーサー対応） -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">一括テキスト取り込み（ゆらぎ対応パーサー）</label>
                <textarea id="raw-input-text" rows="4" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono" placeholder="ここにログやテキストを貼り付け..."></textarea>
                <button type="button" id="parse-btn" class="mt-1.5 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-lg transition border border-slate-300">
                    テキストを自動解析してフォームに反映
                </button>
            </div>

            <hr class="border-slate-100">

            <!-- 手動フォーム項目 -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">作業名 / 職人・レベル</label>
                    <input type="text" id="form-title" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 鍛冶職人LV 7 (+1.81%)">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">成果物名</label>
                        <input type="text" id="form-item-name" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 斧 / 氷">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">進捗パーセンテージ</label>
                        <input type="text" id="form-percentage" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 26.1%">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">数量（総量）</label>
                        <input type="number" id="form-quantity" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 436">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">単位</label>
                        <input type="text" id="form-unit" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 本 / kg">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">作業回数</label>
                    <input type="number" id="form-operations" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例: 50">
                </div>

                <!-- 任意：詳細効率・経験値計算オプション -->
                <div class="bg-indigo-50 p-3 rounded-lg border border-indigo-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-indigo-900">詳細効率オプション（任意・端数対応）</span>
                        <span class="text-[10px] text-indigo-600">0.01未満対応</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] text-indigo-800 mb-0.5">基礎作業時間 (秒)</label>
                            <input type="number" step="0.0001" id="form-base-time" class="w-full text-xs p-1.5 bg-white border border-indigo-200 rounded focus:ring-1 focus:ring-indigo-500" placeholder="例: 10.5">
                        </div>
                        <div>
                            <label class="block text-[11px] text-indigo-800 mb-0.5">作業速度 (%)</label>
                            <input type="number" step="0.0001" id="form-speed-rate" class="w-full text-xs p-1.5 bg-white border border-indigo-200 rounded focus:ring-1 focus:ring-indigo-500" placeholder="例: 125.5">
                        </div>
                    </div>
                    <div class="text-[11px] text-indigo-700 flex justify-between items-center pt-1">
                        <span>算出した実効増加効率:</span>
                        <span id="calculated-efficiency-preview" class="font-bold text-indigo-900">---</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">元の情報（逆引き用テキスト記録）</label>
                    <textarea id="form-raw-source" rows="2" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none font-mono text-slate-500" placeholder="取り込み元のテキストがここに保持されます"></textarea>
                </div>
            </div>

            <!-- アクションボタン -->
            <div class="flex space-x-2 pt-2">
                <button type="button" id="save-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-lg transition shadow">
                    保存 / 更新
                </button>
                <button type="button" id="clear-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-2.5 rounded-lg transition">
                    クリア
                </button>
            </div>
        </section>

        <!-- 右側：保存記録・一覧管理セクション (2カラム) -->
        <section class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-base font-bold text-slate-700">保存記録一覧・管理</h2>
                <div class="flex space-x-2">
                    <button id="export-btn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded border border-slate-300 transition">JSONエクスポート</button>
                    <button id="reset-default-btn" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 px-2.5 py-1 rounded border border-rose-200 transition">サンプル復元</button>
                </div>
            </div>

            <!-- 検索・フィルター -->
            <div>
                <input type="text" id="search-box" class="w-full text-xs p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="記録内をキーワード検索（作業名、成果物など）...">
            </div>

            <!-- 記録リストコンテナ -->
            <div id="records-container" class="space-y-3 overflow-y-auto max-h-[600px] pr-1">
                <!-- 動的にJavaScriptでリストが生成されます -->
            </div>
        </section>

    </main>

    <!-- フッター -->
    <footer class="bg-slate-100 border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500">
        &copy; 2026 作業系データ解析・記録管理ツール. All rights reserved.
    </footer>

    <!-- アプリケーション制御ロジック -->
    <script>
        // サンプル初期データ
        const INITIAL_RECORDS = [
            {
                id: 1,
                title: "鍛冶職人LV 7 (+1.81%)",
                itemName: "斧",
                percentage: "26.1%",
                quantity: 436,
                unit: "本",
                operations: 50,
                average: 8.72,
                baseTime: 12.0,
                speedRate: 115.5,
                efficiency: "13.86",
                rawSource: "鍛冶職人LV 7 (+1.81%)\n26.1%\n獲得したもの\n斧\n436本\n作業回数：50回",
                createdAt: "2026-06-01 12:00:00"
            },
            {
                id: 2,
                title: "錬金術師LV 7 (+1.04%)",
                itemName: "氷",
                percentage: "9.94%",
                quantity: 794,
                unit: "kg",
                operations: 50,
                average: 15.88,
                baseTime: 8.5,
                speedRate: 102.2,
                efficiency: "8.69",
                rawSource: "錬金術師LV 7 (+1.04%)\n9.94%\n獲得したもの\n氷\n794kg\n作業回数：50回",
                createdAt: "2026-06-02 14:30:00"
            }
        ];

        const STORAGE_KEY = "work_tool_records_v1.2";

        // DOM要素の取得
        const rawInputText = document.getElementById('raw-input-text');
        const parseBtn = document.getElementById('parse-btn');
        const formTitle = document.getElementById('form-title');
        const formItemName = document.getElementById('form-item-name');
        const formPercentage = document.getElementById('form-percentage');
        const formQuantity = document.getElementById('form-quantity');
        const formUnit = document.getElementById('form-unit');
        const formOperations = document.getElementById('form-operations');
        const formBaseTime = document.getElementById('form-base-time');
        const formSpeedRate = document.getElementById('form-speed-rate');
        const calculatedEfficiencyPreview = document.getElementById('calculated-efficiency-preview');
        const formRawSource = document.getElementById('form-raw-source');
        const editId = document.getElementById('edit-id');
        const editModeBadge = document.getElementById('edit-mode-badge');
        const saveBtn = document.getElementById('save-btn');
        const clearBtn = document.getElementById('clear-btn');
        const recordsContainer = document.getElementById('records-container');
        const searchBox = document.getElementById('search-box');
        const exportBtn = document.getElementById('export-btn');
        const resetDefaultBtn = document.getElementById('reset-default-btn');

        // アプリケーション状態
        let records = [];

        // 初期化処理
        function init() {
            loadRecords();
            setupEventListeners();
            renderRecords();
        }

        // ローカルストレージからの読み込み
        function loadRecords() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    records = JSON.parse(data);
                } catch (e) {
                    records = INITIAL_RECORDS;
                }
            } else {
                records = INITIAL_RECORDS;
                saveToStorage();
            }
        }

        // ローカルストレージへの保存
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        // イベントリスナーの設定
        function setupEventListeners() {
            parseBtn.addEventListener('click', parseRawText);
            saveBtn.addEventListener('click', saveRecord);
            clearBtn.addEventListener('click', clearForm);
            searchBox.addEventListener('input', renderRecords);
            exportBtn.addEventListener('click', exportJSON);
            resetDefaultBtn.addEventListener('click', resetToDefault);

            // 効率プレビュー用リスナー
            formBaseTime.addEventListener('input', updateEfficiencyPreview);
            formSpeedRate.addEventListener('input', updateEfficiencyPreview);
        }

        // 効率・経験値プレビュー計算 (微小な端数 0.01未満対応)
        function updateEfficiencyPreview() {
            const base = parseFloat(formBaseTime.value);
            const speed = parseFloat(formSpeedRate.value);
            if (!isNaN(base) && !isNaN(speed)) {
                // 基礎作業時間 * (作業速度 / 100) などの計算モデル（端数保持）
                const calculated = base * (speed / 100);
                calculatedEfficiencyPreview.textContent = calculated.toFixed(4);
            } else {
                calculatedEfficiencyPreview.textContent = "---";
            }
        }

        // パーサーロジック（柔軟な単位・フォーマットゆらぎ対応）
        function parseRawText() {
            const text = rawInputText.value.trim();
            if (!text) {
                alert("解析するテキストを入力してください。");
                return;
            }

            formRawSource.value = text;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            let titleVal = "";
            let percentageVal = "";
            let itemNameVal = "";
            let quantityVal = "";
            let unitVal = "";
            let operationsVal = "";

            // 行ごとのパターンマッチングと解析
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // 1. タイトル・レベル行の判定 (例: 鍛冶職人LV 7 (+1.81%))
                if ((line.includes("LV") || line.includes("Lv") || line.includes("レベル")) && !titleVal) {
                    titleVal = line;
                    continue;
                }

                // 2. パーセンテージ単独行の判定 (例: 26.1%)
                if (line.match(/^\d+(\.\d+)?%$/) && !percentageVal) {
                    percentageVal = line;
                    continue;
                }

                // 3. 数量と単位の抽出 (例: 436本, 794kg, 50回 など)
                const qtyUnitMatch = line.match(/^([\d,]+)([^\d\s]+)?$/);
                if (qtyUnitMatch) {
                    const num = parseInt(qtyUnitMatch[1].replace(/,/g, ''), 10);
                    const unitStr = qtyUnitMatch[2] || "";

                    if (unitStr.includes("回")) {
                        operationsVal = num;
                    } else if (!quantityVal && unitStr && !unitStr.includes("%")) {
                        quantityVal = num;
                        unitVal = unitStr.replace("回", "");
                    } else if (!quantityVal && !unitStr) {
                        quantityVal = num;
                    }
                }

                // 「作業回数：50回」形式の対応
                if (line.includes("作業回数") || line.includes("回数")) {
                    const opMatch = line.match(/(\d+)/g);
                    if (opMatch) {
                        operationsVal = opMatch[opMatch.length - 1];
                    }
                }

                // 獲得したものの次の行、またはキーワード判定
                if (line === "獲得したもの" && i + 1 < lines.length) {
                    itemNameVal = lines[i + 1];
                }
            }

            // フォールバック（もしアイテム名が空で、一般的な単語があれば推定）
            if (!itemNameVal) {
                // 数字を含まない短い行をアイテム名と仮定
                for (const line of lines) {
                    if (!line.includes("LV") && !line.includes("%") && !line.includes("回数") && !line.match(/^[\d,]+/) && line.length < 10) {
                        itemNameVal = line;
                        break;
                    }
                }
            }

            // フォームへの反映
            if (titleVal) formTitle.value = titleVal;
            if (percentageVal) formPercentage.value = percentageVal;
            if (itemNameVal) formItemName.value = itemNameVal;
            if (quantityVal) formQuantity.value = quantityVal;
            if (unitVal) formUnit.value = unitVal;
            if (operationsVal) formOperations.value = operationsVal;

            // タイトルが空なら最初の行をタイトルにする
            if (!formTitle.value && lines.length > 0) {
                formTitle.value = lines[0];
            }

            alert("テキストの解析が完了しました！内容を確認してください。");
        }

        // 保存・更新処理
        function saveRecord() {
            const title = formTitle.value.trim();
            const itemName = formItemName.value.trim();
            const percentage = formPercentage.value.trim();
            const quantity = parseInt(formQuantity.value, 10);
            const unit = formUnit.value.trim();
            const operations = parseInt(formOperations.value, 10);
            const baseTime = parseFloat(formBaseTime.value) || 0;
            const speedRate = parseFloat(formSpeedRate.value) || 0;
            const rawSource = formRawSource.value.trim();
            const currentEditId = editId.value;

            // バリデーションチェック
            if (!itemName || isNaN(quantity) || isNaN(operations) || operations <= 0) {
                alert("「成果物名」「数量」「作業回数（1以上）」は必須です。正しく入力してください。");
                return;
            }

            // アベレージ自動計算 (数量 ÷ 作業回数)
            const average = parseFloat((quantity / operations).toFixed(4));
            
            // 効率計算 (微小端数対応)
            const efficiency = baseTime > 0 && speedRate > 0 ? (baseTime * (speedRate / 100)).toFixed(4) : "---";

            const now = new Date();
            const timestamp = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');

            if (currentEditId) {
                // 既存の編集・上書き更新
                const idNum = parseInt(currentEditId, 10);
                records = records.map(rec => {
                    if (rec.id === idNum) {
                        return {
                            ...rec,
                            title: title || rec.title,
                            itemName,
                            percentage,
                            quantity,
                            unit,
                            operations,
                            average,
                            baseTime,
                            speedRate,
                            efficiency,
                            rawSource: rawSource || rec.rawSource
                        };
                    }
                    return rec;
                });
                alert("記録を更新しました！");
            } else {
                // 新規保存（自動ナンバリングID）
                const newId = records.length > 0 ? Math.max(...records.map(r => r.id)) + 1 : 1;
                const newRecord = {
                    id: newId,
                    title: title || "作業記録 #" + newId,
                    itemName,
                    percentage,
                    quantity,
                    unit,
                    operations,
                    average,
                    baseTime,
                    speedRate,
                    efficiency,
                    rawSource: rawSource || `${title}\n${itemName} ${quantity}${unit}\n作業回数：${operations}回`,
                    createdAt: timestamp
                };
                records.unshift(newRecord);
                alert("新規記録を保存しました！");
            }

            saveToStorage();
            clearForm();
            renderRecords();
        }

        // フォームクリア
        function clearForm() {
            editId.value = "";
            editModeBadge.classList.add('hidden');
            rawInputText.value = "";
            formTitle.value = "";
            formItemName.value = "";
            formPercentage.value = "";
            formQuantity.value = "";
            formUnit.value = "";
            formOperations.value = "";
            formBaseTime.value = "";
            formSpeedRate.value = "";
            calculatedEfficiencyPreview.textContent = "---";
            formRawSource.value = "";
            saveBtn.textContent = "保存 / 更新";
        }

        // 記録一覧のレンダリング
        function renderRecords() {
            const keyword = searchBox.value.toLowerCase();
            recordsContainer.innerHTML = "";

            const filtered = records.filter(rec => {
                return (rec.title && rec.title.toLowerCase().includes(keyword)) ||
                       (rec.itemName && rec.itemName.toLowerCase().includes(keyword)) ||
                       (rec.unit && rec.unit.toLowerCase().includes(keyword));
            });

            if (filtered.length === 0) {
                recordsContainer.innerHTML = `<div class="text-xs text-slate-400 text-center py-8">保存された記録はありません。</div>`;
                return;
            }

            filtered.forEach(rec => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-lg p-3 hover:border-indigo-300 transition shadow-sm flex flex-col space-y-2";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded">ID: ${rec.id}</span>
                            <h3 class="text-xs font-bold text-slate-800">${escapeHtml(rec.title || '無題の作業')}</h3>
                            ${rec.percentage ? `<span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-1.5 py-0.2 rounded">${escapeHtml(rec.percentage)}</span>` : ''}
                        </div>
                        <span class="text-[10px] text-slate-400">${rec.createdAt}</span>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-50 p-2 rounded text-xs">
                        <div>
                            <span class="text-slate-400 block text-[10px]">成果物</span>
                            <strong class="text-slate-700">${escapeHtml(rec.itemName)}</strong>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">数量 / 回数</span>
                            <span class="font-semibold text-slate-700">${rec.quantity.toLocaleString()} ${escapeHtml(rec.unit || '')} / ${rec.operations}回</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">1回あたり平均 (アベレージ)</span>
                            <span class="font-bold text-indigo-600">${rec.average} ${escapeHtml(rec.unit || '')}/回</span>
                        </div>
                        <div>
                            <span class="text-slate-400 block text-[10px]">効率・端数効果</span>
                            <span class="font-semibold text-slate-600">${rec.efficiency !== 'undefined' ? rec.efficiency : '---'}</span>
                        </div>
                    </div>

                    <!-- アクションボタン群 -->
                    <div class="flex flex-wrap gap-1.5 pt-1 justify-end border-t border-slate-100">
                        <button onclick="handleSameWork(${rec.id})" class="text-[11px] bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded font-medium transition">
                            同じ作業をする
                        </button>
                        <button onclick="handleReverse(${rec.id})" class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-medium transition">
                            逆引き表示
                        </button>
                        <button onclick="handleCopy(${rec.id})" class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded font-medium transition">
                            コピー
                        </button>
                        <button onclick="handleEdit(${rec.id})" class="text-[11px] bg-amber-50 hover:bg-amber-100 text-amber-700 px-2 py-1 rounded font-medium transition">
                            編集
                        </button>
                        <button onclick="handleDelete(${rec.id})" class="text-[11px] bg-rose-50 hover:bg-rose-100 text-rose-700 px-2 py-1 rounded font-medium transition">
                            削除
                        </button>
                    </div>
                `;
                recordsContainer.appendChild(card);
            });
        }

        // 個別アクション：同じ作業をする（数値をベースにして新規または継続入力を容易にする）
        window.handleSameWork = function(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            formTitle.value = rec.title;
            formItemName.value = rec.itemName;
            formPercentage.value = rec.percentage;
            formQuantity.value = ""; // 数量は新しく入力させるためクリア
            formUnit.value = rec.unit;
            formOperations.value = rec.operations;
            formBaseTime.value = rec.baseTime || "";
            formSpeedRate.value = rec.speedRate || "";
            updateEfficiencyPreview();
            formRawSource.value = rec.rawSource;
            
            editId.value = ""; // 新規として保存できるようにIDはクリア
            editModeBadge.classList.add('hidden');
            saveBtn.textContent = "保存 / 更新";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert(`「${rec.title} (${rec.itemName})」の条件をフォームに読み込みました。数量を調整して新しい作業記録として保存できます。`);
        };

        // 個別アクション：逆引き表示
        window.handleReverse = function(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            const modalContent = `--- 逆引き元データ (ID: ${rec.id}) ---\n日時: ${rec.createdAt}\n\n${rec.rawSource}`;
            alert(modalContent);
        };

        // 個別アクション：コピー
        window.handleCopy = function(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            const textToCopy = `作業名: ${rec.title}\n成果物: ${rec.itemName} ${rec.quantity}${rec.unit} (${rec.operations}回)\nアベレージ: ${rec.average} ${rec.unit}/回\n進捗: ${rec.percentage}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("クリップボードにコピーしました！");
            }).catch(err => {
                alert("コピーに失敗しました。");
            });
        };

        // 個別アクション：編集
        window.handleEdit = function(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            editId.value = rec.id;
            editModeBadge.classList.remove('hidden');
            formTitle.value = rec.title;
            formItemName.value = rec.itemName;
            formPercentage.value = rec.percentage;
            formQuantity.value = rec.quantity;
            formUnit.value = rec.unit;
            formOperations.value = rec.operations;
            formBaseTime.value = rec.baseTime || "";
            formSpeedRate.value = rec.speedRate || "";
            updateEfficiencyPreview();
            formRawSource.value = rec.rawSource;
            saveBtn.textContent = "変更を上書き保存";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 個別アクション：削除
        window.handleDelete = function(id) {
            if (confirm(`ID: ${id} の記録を本当に削除しますか？`)) {
                records = records.filter(r => r.id !== id);
                saveToStorage();
                renderRecords();
            }
        };

        // JSONエクスポート
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "work_records_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // サンプル初期状態に戻す
        function resetToDefault() {
            if (confirm("すべての記録を初期サンプル状態にリセットしますか？")) {
                records = INITIAL_RECORDS;
                saveToStorage();
                clearForm();
                renderRecords();
                alert("サンプルデータにリセットしました。");
            }
        }

        // HTMLエスケープヘルパー
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // アプリ起動
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
