<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マルチタブ＆履歴管理テストツール</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0056b3; }
        .notice { background: #e7f3fe; border-left: 4px solid #2196F3; padding: 10px; margin-bottom: 20px; font-size: 13px; }
        
        /* タブのスタイル */
        .tab-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 8px 14px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: #fff; }
        
        /* タブの中身 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* ツールバー */
        .toolbar { margin-top: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #ddd; }
        textarea { width: 100%; height: 280px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        select, button { padding: 8px 12px; font-size: 14px; cursor: pointer; border-radius: 4px; }
        button.save { background: #28a745; color: white; border: none; font-weight: bold; }
        button.save:hover { background: #218838; }
        button.restore { background: #ffc107; border: none; font-weight: bold; }
        button.restore:hover { background: #e0a800; }
        .history-label { font-size: 13px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>マルチタブ ＆ 履歴・復元管理テストツール</h2>
    <div class="notice">
        ℹ️ <strong>テストモード稼働中:</strong> ブラウザのローカルストレージにデータを保存するため、GitHubへアップロードする前の動作確認が手元でいつでも行えます。
    </div>

    <!-- 10個のタブボタン出力エリア -->
    <div class="tab-buttons" id="tabButtons"></div>

    <!-- 10個のタブコンテンツ出力エリア -->
    <div id="tabContents"></div>
</div>

<script>
    const tabCount = 10;
    const tabButtonsContainer = document.getElementById('tabButtons');
    const tabContentsContainer = document.getElementById('tabContents');

    // 10個のタブと作業エリアを動的に生成
    for (let i = 1; i <= tabCount; i++) {
        const tabId = `tab${i}`;

        // 1. タブボタンの生成
        const btn = document.createElement('button');
        btn.className = `tab-btn ${i === 1 ? 'active' : ''}`;
        btn.innerText = `タブ ${i}`;
        btn.onclick = () => switchTab(i);
        tabButtonsContainer.appendChild(btn);

        // 2. タブの中身（テキストエリア＆ツールバー）の生成
        const content = document.createElement('div');
        content.className = `tab-content ${i === 1 ? 'active' : ''}`;
        content.id = tabId;
        content.innerHTML = `
            <h3>タブ ${i} 作業スペース</h3>
            <textarea id="text_${tabId}" placeholder="ここにHTMLコードやテキストを入力してください..."></textarea>
            <div class="toolbar">
                <button class="save" onclick="saveData('${tabId}')">💾 更新・一時保存</button>
                <button class="restore" onclick="restorePrevious('${tabId}')">↩️ 直前に戻す（復元）</button>
                <span class="history-label">過去の履歴:</span>
                <select id="history_${tabId}" onchange="loadHistory('${tabId}')">
                    <option value="">-- 過去の履歴を選ぶ --</option>
                </select>
            </div>
        `;
        tabContentsContainer.appendChild(content);

        // ページ読み込み時に、前回の最新データを復元してセットする
        loadLatestData(tabId);
        // プルダウンの履歴一覧を初期化
        updateHistorySelect(tabId);
    }

    // タブ切り替え処理
    function switchTab(index) {
        document.querySelectorAll('.tab-btn').forEach((b, idx) => {
            b.classList.toggle('active', idx + 1 === index);
        });
        document.querySelectorAll('.tab-content').forEach((c, idx) => {
            c.classList.toggle('active', idx + 1 === index);
        });
    }

    // 最新データを画面に読み込む
    function loadLatestData(tabId) {
        const histories = JSON.parse(localStorage.getItem(`history_${tabId}`) || '[]');
        if (histories.length > 0) {
            document.getElementById(`text_${tabId}`).value = histories[0].text;
            // 直前復元用にも保持
            if (histories.length > 1) {
                document.getElementById(`text_${tabId}`).setAttribute('data-previous', histories[1].text);
            }
        }
    }

    // 保存＆履歴・一時退避（テンポラリー）処理
    function saveData(tabId) {
        const textarea = document.getElementById(`text_${tabId}`);
        const currentText = textarea.value;
        const timestamp = new Date().toLocaleString();

        let histories = JSON.parse(localStorage.getItem(`history_${tabId}`) || '[]');
        
        // 現在テキストを「直前復元用」として保持
        if (histories.length > 0) {
            textarea.setAttribute('data-previous', histories[0].text);
        }

        // 履歴の先頭に追加（最大20件まで保持）
        histories.unshift({ time: timestamp, text: currentText });
        if (histories.length > 20) histories.pop();

        localStorage.setItem(`history_${tabId}`, JSON.stringify(histories));
        updateHistorySelect(tabId);
        
        alert(`タブ ${tabId} のデータをローカルに一時保存しました！`);
    }

    // プルダウンの選択肢を更新
    function updateHistorySelect(tabId) {
        const select = document.getElementById(`history_${tabId}`);
        const histories = JSON.parse(localStorage.getItem(`history_${tabId}`) || '[]');
        
        select.innerHTML = '<option value="">-- 過去の履歴を選ぶ --</option>';
        histories.forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.innerText = `[${item.time}] 保存データ #${index + 1}`;
            select.appendChild(opt);
        });
    }

    // 履歴プルダウンから選択して読み込む
    function loadHistory(tabId) {
        const select = document.getElementById(`history_${tabId}`);
        const index = select.value;
        if (index === "") return;

        const histories = JSON.parse(localStorage.getItem(`history_${tabId}`) || '[]');
        if (histories[index]) {
            document.getElementById(`text_${tabId}`).value = histories[index].text;
        }
    }

    // 失敗・変更時に直前の状態に戻す（復元）
    function restorePrevious(tabId) {
        const textarea = document.getElementById(`text_${tabId}`);
        const prevText = textarea.getAttribute('data-previous');
        if (prevText !== null && prevText !== undefined) {
            textarea.value = prevText;
            alert('直前の保存状態に戻しました。');
        } else {
            alert('戻せる直前の履歴（バックアップ）がありません。');
        }
    }
</script>

</body>
</html>
