<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLファイル作成・保存ツール</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 16px;
    background: #f4f6f8;
    color: #333;
}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h1 { font-size: 18px; margin-top: 0; margin-bottom: 12px; color: #1976d2; }
label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 12px;
}
textarea {
    width: 100%;
    height: 300px;
    padding: 10px;
    font-size: 12px;
    font-family: monospace;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 12px;
    resize: vertical;
}
button {
    width: 100%;
    padding: 12px;
    background: #1976d2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
button:active { background: #1565c0; }
</style>
</head>
<body>

<div class="container">
    <h1>📄 HTMLファイル生成ツール</h1>
    
    <label for="filename">ファイル名</label>
    <input type="text" id="filename" value="xpcalc_work.html" placeholder="例: sample.html">

    <label for="code">HTMLコード貼り付け欄</label>
    <textarea id="code" placeholder="ここにHTMLコードを貼り付けてください..."></textarea>

    <button onclick="downloadHTML()">HTMLファイルとして保存</button>
</div>

<script>
function downloadHTML() {
    const code = document.getElementById("code").value;
    let filename = document.getElementById("filename").value.trim();

    if (!code.trim()) {
        alert("コードを貼り付けてください。");
        return;
    }

    if (!filename) {
        filename = "index.html";
    }

    // .html 拡張子がない場合は自動補正
    if (!filename.endsWith(".html") && !filename.endsWith(".htm")) {
        filename += ".html";
    }

    // Blobオブジェクトを作成してダウンロード発火
    const blob = new Blob([code], { type: "text/html;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
