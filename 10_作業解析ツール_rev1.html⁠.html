<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10_作業解析ツール_rev1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- iPhone (iOS) ホーム画面追加時のアイコン・Webclip対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="作業解析ツール">
    <!-- SVGを用いた動的インラインWebclipアイコン（データURI） -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2255%22 font-size=%2250%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 fill=%22white%22>🛠️</text></svg>">

    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- ヘッダー -->
        <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 bg-blue-100 text-blue-700 font-mono text-xs font-bold rounded">10_作業解析ツール_rev1</span>
                    <span class="text-xs text-slate-400">iPhoneホーム画面対応・単位ゆらぎ対応</span>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 mt-1">作業系データ解析・記録管理システム</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="app.loadSampleData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition">サンプル読込</button>
                <button onclick="app.clearAllData()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium rounded-lg transition">全データ削除</button>
            </div>
        </header>

        <!-- メイングリッド -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側：入力・解析セクション (5cols) -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                        データ入力・取り込み
                    </h2>

                    <!-- 入力タブ切り替え -->
                    <div class="flex rounded-lg bg-slate-100 p-1 text-sm font-medium">
                        <button onclick="app.switchTab('import')" id="tab-import" class="flex-1 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition">一括取り込み</button>
                        <button onclick="app.switchTab('manual')" id="tab-manual" class="flex-1 py-1.5 rounded-md text-slate-600 transition">手入力</button>
                    </div>

                    <!-- 取り込みエリア -->
                    <div id="panel-import" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">生データ（単位のゆらぎ・自由記述対応）</label>
                            <textarea id="raw-input-text" rows="6" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例:
鍛冶職人LV 7 (+1.81%)
26.1%
獲得したもの
斧
436本
作業回数：50回"></textarea>
                        </div>
                        <button onclick="app.parseRawData()" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                            データを解析して取り込む
                        </button>
                    </div>

                    <!-- 手入力エリア -->
                    <div id="panel-manual" class="space-y-3 hidden">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">作業名 / 獲得物名</label>
                            <input type="text" id="manual-title" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例: 斧">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">数量</label>
                                <input type="number" id="manual-qty" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="1">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">単位</label>
                                <input type="text" id="manual-unit" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="本">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">作業回数</label>
                                <input type="number" id="manual-workcount" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="1">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">レベル情報</label>
                                <input type="text" id="manual-level" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" value="LV 1">
                            </div>
                        </div>
                        <button onclick="app.saveManualData()" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-medium text-sm rounded-lg transition shadow-sm">
                            手入力データを保存
                        </button>
                    </div>
                </div>

                <!-- 編集・プレビュー & 逆引き確認エリア -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                            編集・プレビュー / 逆引き
                        </h2>
                        <span id="edit-id-badge" class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full font-mono">新規作成モード</span>
                    </div>

                    <input type="hidden" id="edit-internal-id">

                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">作業・獲得物名</label>
                            <input type="text" id="edit-title" oninput="app.validateConsistency()" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">数量</label>
                                <input type="number" id="edit-qty" oninput="app.validateConsistency()" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">単位（ゆらぎ対応）</label>
                                <input type="text" id="edit-unit" oninput="app.validateConsistency()" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">作業回数</label>
                                <input type="number" id="edit-workcount" oninput="app.validateConsistency()" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">レベル情報</label>
                                <input type="text" id="edit-level" oninput="app.validateConsistency()" class="w-full rounded-lg border border-slate-300 p-2 text-sm">
                            </div>
                        </div>

                        <!-- 整合性チェック・同期メッセージ領域 -->
                        <div id="consistency-warning" class="hidden text-xs p-2.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-200">
                            ⚠️ 整合性チェック: 数量または作業回数が0以下になっています。確認してください。
                        </div>
                        
                        <!-- 逆引き元情報の表示 -->
                        <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                            <span class="block text-xs font-semibold text-slate-500 mb-1">元の取り込み情報 (逆引き参照):</span>
                            <div id="edit-raw-source" class="text-xs font-mono text-slate-600 break-all bg-white p-2 rounded border border-slate-200 max-h-24 overflow-y-auto whitespace-pre-wrap">なし</div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button onclick="app.saveCurrentEdit()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                                変更を保存 / 新規保存
                            </button>
                            <button onclick="app.repeatTask()" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium text-sm rounded-lg transition" title="このデータをベースにして同じ作業を行う">
                                同じ作業をする
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右側：保存記録・一覧セクション (7cols) -->
            <div class="lg:col-span-7">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                            保存記録一覧
                        </h2>
                        <span id="record-count" class="text-xs font-medium px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">0件</span>
                    </div>

                    <!-- 検索・フィルター -->
                    <div class="flex gap-2">
                        <input type="text" id="search-query" oninput="app.renderRecords()" placeholder="記録をキーワード検索..." class="w-full rounded-lg border border-slate-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- リスト表示コンテナ -->
                    <div id="records-container" class="space-y-2.5 max-h-[600px] overflow-y-auto pr-1">
                        <!-- 動的に生成されます -->
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
        通知メッセージ
    </div>

    <script>
        class WorkToolApp {
            constructor() {
                this.records = JSON.parse(localStorage.getItem('work_tool_records_rev1')) || [];
                this.nextId = parseInt(localStorage.getItem('work_tool_next_id_rev1')) || 1;
                this.initSamplesIfNeeded();
                this.renderRecords();
            }

            initSamplesIfNeeded() {
                if (this.records.length === 0) {
                    this.records = [
                        {
                            id: 1,
                            title: '斧',
                            qty: 436,
                            unit: '本',
                            workcount: 50,
                            level: '鍛冶職人LV 7 (+1.81%)',
                            rawSource: "鍛冶職人LV 7 (+1.81%)\n26.1%\n獲得したもの\n斧\n436本\n作業回数：50回",
                            createdAt: new Date().toLocaleString()
                        },
                        {
                            id: 2,
                            title: '氷',
                            qty: 794,
                            unit: 'kg',
                            workcount: 50,
                            level: '錬金術師LV 7 (+1.04%)',
                            rawSource: "錬金術師LV 7 (+1.04%)\n9.94%\n獲得したもの\n氷\n794kg\n作業回数：50回",
                            createdAt: new Date().toLocaleString()
                        }
                    ];
                    this.nextId = 3;
                    this.saveToStorage();
                }
            }

            saveToStorage() {
                localStorage.setItem('work_tool_records_rev1', JSON.stringify(this.records));
                localStorage.setItem('work_tool_next_id_rev1', this.nextId);
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            }

            switchTab(tab) {
                const importTab = document.getElementById('tab-import');
                const manualTab = document.getElementById('tab-manual');
                const importPanel = document.getElementById('panel-import');
                const manualPanel = document.getElementById('panel-manual');

                if (tab === 'import') {
                    importTab.className = "flex-1 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition";
                    manualTab.className = "flex-1 py-1.5 rounded-md text-slate-600 transition";
                    importPanel.classList.remove('hidden');
                    manualPanel.classList.add('hidden');
                } else {
                    manualTab.className = "flex-1 py-1.5 rounded-md bg-white text-blue-600 shadow-sm transition";
                    importTab.className = "flex-1 py-1.5 rounded-md text-slate-600 transition";
                    manualPanel.classList.remove('hidden');
                    importPanel.classList.add('hidden');
                }
            }

            // リアルタイム整合性チェック（バリデーション）
            validateConsistency() {
                const qty = parseFloat(document.getElementById('edit-qty').value);
                const workcount = parseFloat(document.getElementById('edit-workcount').value);
                const warningBox = document.getElementById('consistency-warning');

                if (qty <= 0 || workcount <= 0 || isNaN(qty) || isNaN(workcount)) {
                    warningBox.classList.remove('hidden');
                } else {
                    warningBox.classList.add('hidden');
                }
            }

            // 単位のゆらぎに対応した高度なパーサー
            parseRawData() {
                const rawText = document.getElementById('raw-input-text').value.trim();
                if (!rawText) {
                    alert('取り込むテキストを入力してください。');
                    return;
                }

                const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                let levelInfo = '';
                let title = '不明な作業';
                let qty = 1;
                let unit = '個';
                let workcount = 1;

                // 1. レベル情報の抽出
                const levelLine = lines.find(l => /LV|レベル/i.test(l));
                if (levelLine) levelInfo = levelLine;

                // 2. 作業回数の抽出
                for (let line of lines) {
                    const wcMatch = line.match(/(?:作業回数|回数)[:：]?\s*([0-9]+)\s*回?/i);
                    if (wcMatch) {
                        workcount = parseInt(wcMatch[1]);
                        break;
                    }
                }

                // 3. 数量と単位のゆらぎ解析 (例: "436本", "794kg" など)
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const numUnitMatch = line.match(/^([0-9]+)\s*([一-龥ぁ-んァ-ンa-zA-Z]+)$/);
                    if (numUnitMatch && !/LV|回数/i.test(line)) {
                        qty = parseInt(numUnitMatch[1]);
                        unit = numUnitMatch[2];
                        if (i > 0 && lines[i-1] !== '獲得したもの') {
                            title = lines[i-1];
                        }
                        break;
                    }
                }

                if (title === '不明な作業') {
                    const acquiredIdx = lines.findIndex(l => l.includes('獲得したもの'));
                    if (acquiredIdx !== -1 && lines.length > acquiredIdx + 1) {
                        const candidate = lines[acquiredIdx + 1];
                        if (!/^[0-9]+/.test(candidate)) title = candidate;
                    } else if (lines.length > 0) {
                        title = lines[0];
                    }
                }

                document.getElementById('edit-internal-id').value = '';
                document.getElementById('edit-id-badge').textContent = '新規取り込み (未保存)';
                document.getElementById('edit-title').value = title;
                document.getElementById('edit-qty').value = qty;
                document.getElementById('edit-unit').value = unit;
                document.getElementById('edit-workcount').value = workcount;
                document.getElementById('edit-level').value = levelInfo;
                document.getElementById('edit-raw-source').textContent = rawText;

                this.validateConsistency();
                document.getElementById('raw-input-text').value = '';
                this.showToast('データを解析しました。内容を確認して保存してください。');
            }

            saveManualData() {
                const title = document.getElementById('manual-title').value.trim();
                if (!title) {
                    alert('作業名を入力してください。');
                    return;
                }
                const qty = parseFloat(document.getElementById('manual-qty').value) || 0;
                const unit = document.getElementById('manual-unit').value.trim() || '個';
                const workcount = parseInt(document.getElementById('manual-workcount').value) || 1;
                const level = document.getElementById('manual-level').value.trim();

                const newRecord = {
                    id: this.nextId++,
                    title,
                    qty,
                    unit,
                    workcount,
                    level,
                    rawSource: `[手入力] ${level} | 獲得: ${title} ${qty}${unit} | 作業回数: ${workcount}回`,
                    createdAt: new Date().toLocaleString()
                };

                this.records.unshift(newRecord);
                this.saveToStorage();
                this.renderRecords();
                this.showToast('手入力データを保存しました。');
                document.getElementById('manual-title').value = '';
            }

            saveCurrentEdit() {
                const internalId = document.getElementById('edit-internal-id').value;
                const title = document.getElementById('edit-title').value.trim();
                if (!title) {
                    alert('作業名を入力してください。');
                    return;
                }

                const qty = parseFloat(document.getElementById('edit-qty').value) || 0;
                const unit = document.getElementById('edit-unit').value.trim() || '個';
                const workcount = parseInt(document.getElementById('edit-workcount').value) || 1;
                const level = document.getElementById('edit-level').value.trim();
                const rawSource = document.getElementById('edit-raw-source').textContent;

                if (internalId) {
                    const index = this.records.findIndex(r => r.id == internalId);
                    if (index !== -1) {
                        this.records[index] = {
                            ...this.records[index],
                            title, qty, unit, workcount, level
                        };
                        this.showToast('記録を更新しました。');
                    }
                } else {
                    const newRecord = {
                        id: this.nextId++,
                        title,
                        qty,
                        unit,
                        workcount,
                        level,
                        rawSource: rawSource !== 'なし' ? rawSource : `[編集作成] ${level} | ${title} ${qty}${unit}`,
                        createdAt: new Date().toLocaleString()
                    };
                    this.records.unshift(newRecord);
                    this.showToast('新しく記録を保存しました。');
                }

                this.saveToStorage();
                this.renderRecords();
                this.clearEditor();
            }

            reverseLookup(id) {
                const record = this.records.find(r => r.id === id);
                if (!record) return;

                document.getElementById('edit-internal-id').value = record.id;
                document.getElementById('edit-id-badge').textContent = `ID: #${record.id} 編集中`;
                document.getElementById('edit-title').value = record.title;
                document.getElementById('edit-qty').value = record.qty;
                document.getElementById('edit-unit').value = record.unit;
                document.getElementById('edit-workcount').value = record.workcount;
                document.getElementById('edit-level').value = record.level;
                document.getElementById('edit-raw-source').textContent = record.rawSource || 'なし';

                this.validateConsistency();
                this.showToast(`ID #${record.id} を逆引き読み込みしました。`);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            repeatTask() {
                const title = document.getElementById('edit-title').value;
                if (!title) {
                    alert('ベースとなるデータがありません。');
                    return;
                }
                document.getElementById('edit-internal-id').value = '';
                document.getElementById('edit-id-badge').textContent = '同じ作業を新規作成';
                this.showToast('「同じ作業をする」モードとして読み込みました。修正して保存してください。');
            }

            clearEditor() {
                document.getElementById('edit-internal-id').value = '';
                document.getElementById('edit-id-badge').textContent = '新規作成モード';
                document.getElementById('edit-title').value = '';
                document.getElementById('edit-qty').value = '';
                document.getElementById('edit-unit').value = '';
                document.getElementById('edit-workcount').value = '';
                document.getElementById('edit-level').value = '';
                document.getElementById('edit-raw-source').textContent = 'なし';
                document.getElementById('consistency-warning').classList.add('hidden');
            }

            copyRecord(id) {
                const record = this.records.find(r => r.id === id);
                if (!record) return;
                const text = `ID:${record.id} | ${record.level} | ${record.title}: ${record.qty}${record.unit} (作業回数:${record.workcount}回)`;
                navigator.clipboard.writeText(text).then(() => {
                    this.showToast(`ID #${id} の内容をコピーしました。`);
                });
            }

            deleteRecord(id) {
                if (confirm(`ID #${id} の記録を削除しますか？`)) {
                    this.records = this.records.filter(r => r.id !== id);
                    this.saveToStorage();
                    this.renderRecords();
                    this.showToast(`ID #${id} を削除しました。`);
                }
            }

            clearAllData() {
                if (confirm('すべての記録を削除しますか？')) {
                    this.records = [];
                    this.saveToStorage();
                    this.renderRecords();
                    this.clearEditor();
                    this.showToast('すべてのデータを削除しました。');
                }
            }

            loadSampleData() {
                this.initSamplesIfNeeded();
                this.renderRecords();
                this.showToast('サンプルデータを読み込みました。');
            }

            renderRecords() {
                const container = document.getElementById('records-container');
                const query = document.getElementById('search-query').value.toLowerCase();
                
                const filtered = this.records.filter(r => 
                    r.title.toLowerCase().includes(query) || 
                    r.unit.toLowerCase().includes(query) ||
                    (r.level && r.level.toLowerCase().includes(query)) ||
                    String(r.id).includes(query)
                );

                document.getElementById('record-count').textContent = `${filtered.length}件`;

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10 text-slate-400 text-sm border border-dashed border-slate-200 rounded-lg">
                            保存された記録はありません
                        </div>
                    `;
                    return;
                }

                container.innerHTML = filtered.map(r => `
                    <div class="p-3.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-mono text-xs font-bold text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">#${r.id}</span>
                                <span class="text-xs px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-medium border border-indigo-100">${escapeHtml(r.level || '一般')}</span>
                                <h3 class="font-semibold text-slate-800 text-sm">${escapeHtml(r.title)}</h3>
                            </div>
                            <div class="text-xs text-slate-500 flex gap-4">
                                <span>獲得量: <strong class="text-slate-700">${r.qty} ${escapeHtml(r.unit)}</strong></span>
                                <span>作業回数: <strong class="text-slate-700">${r.workcount}回</strong></span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
                            <button onclick="app.reverseLookup(${r.id})" class="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-medium rounded-md transition">
                                逆引き
                            </button>
                            <button onclick="app.copyRecord(${r.id})" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-md transition">
                                コピー
                            </button>
                            <button onclick="app.deleteRecord(${r.id})" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium rounded-md transition">
                                削除
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"]/g, function(tag) {
                const chars = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                return chars[tag] || tag;
            });
        }

        const app = new WorkToolApp();
    </script>
</body>
</html>
