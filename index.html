<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLDOUT2 管理ツール ポータル</title>
<style>
body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}
.container { max-width: 600px; margin: auto; }
h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
.description { color: #666; margin-bottom: 24px; font-size: 14px; text-align: center; }
.menu-card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-decoration: none;
    color: #222;
    transition: transform 0.2s, background 0.2s;
}
.menu-card:hover {
    background: #e8f3ff;
    transform: translateY(-2px);
}
.menu-title { font-size: 18px; font-weight: bold; color: #1976d2; }
.menu-desc { font-size: 13px; color: #666; margin-top: 4px; }
.arrow { font-size: 20px; color: #1976d2; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h1>SOLDOUT2 管理ツール</h1>
    <div class="description">目的に応じたツールを選択してください。</div>

    <!-- 販売管理ツールへのリンク -->
    <a href="sales.html" class="menu-card">
        <div>
            <div class="menu-title">販売・作業管理ツール</div>
            <div class="menu-desc">在庫・価格・販売実績から完売予想や売上を計算・保存します。</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <!-- 作業ツールへのリンク -->
    <a href="work.html" class="menu-card">
        <div>
            <div class="menu-title">作業データ解析ツール (Work Tool)</div>
            <div class="menu-desc">作業ログの解析や効率の計算を行います。</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <!-- 必要に応じてツールを追加できます -->
</div>

</body>
</html>
