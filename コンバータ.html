<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アベレージ自動変換</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;margin:0;padding:20px;background:#f5f5f7;color:#222}
main{max-width:700px;margin:auto}
h1{font-size:24px}
textarea{width:100%;box-sizing:border-box;min-height:190px;border:1px solid #ccc;border-radius:14px;padding:14px;font-size:16px;background:white}
button{border:0;border-radius:12px;padding:12px 18px;font-size:16px;margin:10px 6px 0 0}
.primary{background:#222;color:white}
#out{white-space:pre-wrap;background:white;border-radius:14px;padding:15px;margin-top:16px;min-height:90px}
.hint{font-size:14px;color:#666}
</style>
</head>
<body>
<main>
<h1>アベレージ自動変換</h1>
<p class="hint">「商品名 数量」「作業回数」を貼り付けてください。複数まとめてOK。</p>
<textarea id="input" placeholder="氷 33kg
作業回数：2回

ハイポーション：249本
作業回数：30回

ハイエーテル：115本
作業回数：16回"></textarea>
<br>
<button class="primary" onclick="convert()">変換</button>
<button onclick="copyOut()">結果をコピー</button>
<button onclick="clearAll()">クリア</button>
<div id="out"></div>
</main>
<script>
function fmt(n){
  if(Math.abs(n-Math.round(n))<1e-10) return String(Math.round(n));
  return n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function convert(){
  const s=document.getElementById('input').value.replace(/\r/g,'');
  const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);
  let res=[], item=null, qty=null, unit='';
  for(const line of lines){
    let m=line.match(/作業回数\s*[:：]?\s*([0-9]+(?:\.[0-9]+)?)\s*回/);
    if(m){
      const cnt=parseFloat(m[1]);
      if(item!==null && qty!==null && cnt>0){
        const avg=qty/cnt;
        res.push(`${item} ${fmt(qty)}${unit} ÷ ${fmt(cnt)}回 = ${fmt(avg)}${unit}/回`);
      }
      item=null; qty=null; unit='';
      continue;
    }
    let q=line.match(/^(.+?)[：:\s]+([0-9]+(?:\.[0-9]+)?)\s*([^\d\s]*)$/);
    if(q){
      item=q[1].trim(); qty=parseFloat(q[2]); unit=q[3].trim();
    } else {
      q=line.match(/^(.+?)\s*([0-9]+(?:\.[0-9]+)?)\s*(本|個|kg|g|枚|塊|回)$/i);
      if(q){ item=q[1].trim(); qty=parseFloat(q[2]); unit=q[3]; }
    }
  }
  document.getElementById('out').textContent=res.length?res.join('\n\n'):'認識できませんでした。例の形式で入力してください。';
}
async function copyOut(){
  const t=document.getElementById('out').textContent;
  if(!t)return;
  await navigator.clipboard.writeText(t);
  alert('コピーしました');
}
function clearAll(){document.getElementById('input').value='';document.getElementById('out').textContent='';}
</script>
</body>
</html>
