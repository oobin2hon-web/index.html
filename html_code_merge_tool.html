<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTMLコード保存・結合ツール</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--line:#dfe4ea;--text:#20252b;
  --muted:#68727d;--accent:#3478f6;--accent2:#eaf1ff;
  --danger:#d9534f;--shadow:0 4px 18px rgba(20,30,40,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
header{padding:18px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0 0 5px}
header p{font-size:12px;color:var(--muted);margin:0}
.wrap{max-width:1200px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-head h2{font-size:15px;margin:0}
.panel-body{padding:12px 14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,textarea,select{width:100%;border:1px solid #cfd6dd;border-radius:9px;background:#fbfcfd;padding:9px;color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,120,246,.1)}
textarea{resize:vertical;line-height:1.5}
#codeInput{min-height:390px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.btn{padding:9px 12px;border-radius:9px;background:#eef1f4;color:#26313b;font-weight:600}
.btn.primary{background:var(--accent);color:white}
.btn.danger{background:#fff0ef;color:var(--danger)}
.btn.small{padding:6px 9px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:7px;max-height:520px;overflow:auto}
.item{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}
.item.selected{border-color:var(--accent);background:var(--accent2)}
.item-top{display:flex;align-items:center;gap:7px}
.item-top strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.item-meta{font-size:11px;color:var(--muted);margin-top:4px}
.item-actions{display:flex;gap:4px;margin-top:7px}
.item-actions button{flex:1}
.badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#e9edf2;color:#56616c}
label{font-size:12px;font-weight:700;display:block;margin:0 0 5px}
.field{margin-bottom:10px}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500}
.check input{width:auto}
#preview{width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:white}
#mergedCode{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.empty{padding:25px 10px;text-align:center;color:var(--muted);font-size:12px}
.status{font-size:11px;color:var(--muted);min-height:18px}
.order-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.order-item{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff}
.order-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){
 .grid{grid-template-columns:1fr}
 header{position:static}
 #codeInput{min-height:280px}
 #preview{height:330px}
}
</style>
</head>
<body>
<header>
  <h1>HTMLコード保存・結合（マージ）ツール</h1>
  <p>HTML断片やHTMLファイルを保存・編集し、選択した順番で1つのHTMLへ結合できます。</p>
</header>

<main class="wrap">
<div class="grid">

<section class="panel">
  <div class="panel-head">
    <h2>① コード保存・管理</h2>
    <button class="btn primary small" id="newBtn">＋新規</button>
  </div>
  <div class="panel-body">
    <div class="field">
      <label>名前（タイトル）</label>
      <input id="titleInput" placeholder="例：トップページ">
    </div>
    <div class="field">
      <label>HTMLコード</label>
      <textarea id="codeInput" spellcheck="false" placeholder="ここにHTMLコードを貼り付けてください"></textarea>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="saveBtn">保存</button>
      <button class="btn" id="fileBtn">HTMLファイル読込</button>
      <button class="btn" id="clearBtn">入力クリア</button>
      <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
    </div>
    <div class="status" id="editStatus"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <label>保存済みコード</label>
    <div class="list" id="savedList"></div>
    <div class="toolbar" style="margin-top:9px">
      <button class="btn small" id="exportDataBtn">管理データを書き出す</button>
      <button class="btn small" id="importDataBtn">管理データを読込</button>
      <input type="file" id="dataInput" accept=".json,application/json" hidden>
    </div>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <h2>② 結合・プレビュー</h2>
    <span class="badge" id="countBadge">0件選択</span>
  </div>
  <div class="panel-body">
    <div class="field">
      <label>結合するコード</label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="smartMerge" checked> スマート結合（head/bodyを統合）</label>
        <label class="check"><input type="checkbox" id="removeScripts"> プレビュー時のscript実行を無効化</label>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn primary" id="mergeBtn">選択項目を結合</button>
      <button class="btn" id="selectAllBtn">全選択</button>
      <button class="btn" id="clearSelectBtn">選択解除</button>
    </div>

    <div class="hint">保存済みコードの「選択」を入れた順に、下の順番で結合します。▲▼で順番を変更できます。</div>
    <div class="order-list" id="orderList"></div>

    <div style="margin-top:14px">
      <label>プレビュー</label>
      <iframe id="preview" sandbox=""></iframe>
    </div>

    <div style="margin-top:14px">
      <label>完成HTMLコード</label>
      <textarea id="mergedCode" spellcheck="false" placeholder="「選択項目を結合」を押すとここに出力されます"></textarea>
    </div>

    <div class="toolbar" style="margin-top:9px">
      <button class="btn primary" id="downloadBtn">完成HTMLをダウンロード</button>
      <button class="btn" id="copyBtn">コードをコピー</button>
      <button class="btn" id="previewBtn">プレビュー更新</button>
    </div>
  </div>
</section>

</div>
</main>

<script>
(function(){
"use strict";
const KEY="htmlMergeToolRecords_v1";
let records=[];
let editingId=null;
let selected=new Set();
let merged="";

const $=id=>document.getElementById(id);
const titleInput=$("titleInput"), codeInput=$("codeInput"), savedList=$("savedList");
const orderList=$("orderList"), mergedCode=$("mergedCode"), preview=$("preview");
const status=$("editStatus");

function uid(){return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"[]");
    records=Array.isArray(x)?x:[];
  }catch(e){records=[]}
  renderList(); renderOrder(); updateBadge();
}
function persist(){localStorage.setItem(KEY,JSON.stringify(records))}

function renderList(){
  savedList.innerHTML="";
  if(!records.length){savedList.innerHTML='<div class="empty">保存済みコードはありません。<br>名前とコードを入力して「保存」してください。</div>';return}
  records.forEach((r,i)=>{
    const el=document.createElement("div");
    el.className="item"+(selected.has(r.id)?" selected":"");
    el.innerHTML=`
      <div class="item-top">
        <input type="checkbox" class="pick" data-id="${r.id}" ${selected.has(r.id)?"checked":""}>
        <strong title="${escapeHtml(r.title)}">${escapeHtml(r.title)}</strong>
      </div>
      <div class="item-meta">${r.code.length.toLocaleString()}文字　${new Date(r.updatedAt).toLocaleString("ja-JP")}</div>
      <div class="item-actions">
        <button class="btn small load">編集</button>
        <button class="btn small up">▲</button>
        <button class="btn small down">▼</button>
        <button class="btn small danger del">削除</button>
      </div>`;
    el.querySelector(".pick").onchange=e=>{
      if(e.target.checked) selected.add(r.id); else selected.delete(r.id);
      renderList(); renderOrder(); updateBadge();
    };
    el.querySelector(".load").onclick=()=>edit(r.id);
    el.querySelector(".up").onclick=()=>move(i,-1);
    el.querySelector(".down").onclick=()=>move(i,1);
    el.querySelector(".del").onclick=()=>{
      if(confirm("この保存データを削除しますか？")){
        records=records.filter(x=>x.id!==r.id);selected.delete(r.id);
        persist();renderList();renderOrder();updateBadge();
      }
    };
    savedList.appendChild(el);
  });
}
function edit(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  editingId=id;titleInput.value=r.title;codeInput.value=r.code;
  status.textContent="編集中："+r.title;
  window.scrollTo({top:0,behavior:"smooth"});
}
function move(i,d){
  const j=i+d;if(j<0||j>=records.length)return;
  [records[i],records[j]]=[records[j],records[i]];
  persist();renderList();renderOrder();
}
function renderOrder(){
  orderList.innerHTML="";
  const arr=records.filter(r=>selected.has(r.id));
  if(!arr.length){orderList.innerHTML='<div class="empty">選択したコードの結合順がここに表示されます。</div>';return}
  arr.forEach((r,k)=>{
    const el=document.createElement("div");el.className="order-item";
    el.innerHTML=`<b>${k+1}</b><span>${escapeHtml(r.title)}</span>
      <button class="btn small" data-dir="-1">▲</button>
      <button class="btn small" data-dir="1">▼</button>
      <button class="btn small danger">解除</button>`;
    el.querySelector('[data-dir="-1"]').onclick=()=>moveSelected(k,-1);
    el.querySelector('[data-dir="1"]').onclick=()=>moveSelected(k,1);
    el.querySelector(".danger").onclick=()=>{selected.delete(r.id);renderList();renderOrder();updateBadge()};
    orderList.appendChild(el);
  });
}
function moveSelected(k,d){
  const arr=records.filter(r=>selected.has(r.id));
  const target=k+d;if(target<0||target>=arr.length)return;
  const a=arr[k],b=arr[target];
  const ia=records.indexOf(a),ib=records.indexOf(b);
  [records[ia],records[ib]]=[records[ib],records[ia]];
  persist();renderList();renderOrder();
}
function updateBadge(){$("countBadge").textContent=selected.size+"件選択"}

function save(){
  const title=titleInput.value.trim()||"無題_"+new Date().toLocaleString("ja-JP");
  const code=codeInput.value;
  if(!code.trim()){alert("HTMLコードを入力してください。");return}
  if(editingId){
    const r=records.find(x=>x.id===editingId);
    if(r){r.title=title;r.code=code;r.updatedAt=Date.now()}
  }else{
    const r={id:uid(),title,code,createdAt:Date.now(),updatedAt:Date.now()};
    records.push(r);editingId=r.id;selected.add(r.id);
  }
  persist();renderList();renderOrder();updateBadge();
  status.textContent="保存しました："+title;
}
function newRecord(){
  editingId=null;titleInput.value="";codeInput.value="";
  status.textContent="新規入力";
  titleInput.focus();
}
function smartMergeCodes(arr){
  const docs=arr.map(x=>x.code);
  const parser=new DOMParser();
  let title="";
  let heads=[], bodies=[], other=[];
  docs.forEach(src=>{
    const doc=parser.parseFromString(src,"text/html");
    if(doc.title && !title) title=doc.title;
    [...doc.head.children].forEach(n=>{
      if(n.tagName.toLowerCase()==="title"){if(!title)title=n.textContent}
      else heads.push(n.cloneNode(true));
    });
    [...doc.body.children].forEach(n=>bodies.push(n.cloneNode(true)));
    if(!doc.head.children.length && !doc.body.children.length) other.push(src);
  });
  const out=document.implementation.createHTMLDocument(title||"Merged HTML");
  heads.forEach(n=>out.head.appendChild(out.importNode(n,true)));
  bodies.forEach(n=>out.body.appendChild(out.importNode(n,true)));
  let result="<!DOCTYPE html>\\n"+out.documentElement.outerHTML;
  if(other.length) result+="\\n<!-- 解析できなかった断片 -->\\n"+other.join("\\n");
  return result;
}
function simpleMerge(arr){
  return "<!DOCTYPE html>\\n<html lang=\"ja\">\\n<head>\\n<meta charset=\"UTF-8\">\\n</head>\\n<body>\\n"+
    arr.map(r=>"<!-- ===== "+r.title+" ===== -->\\n"+r.code).join("\\n\\n")+
    "\\n</body>\\n</html>";
}
function doMerge(){
  const arr=records.filter(r=>selected.has(r.id));
  if(!arr.length){alert("結合するコードを選択してください。");return}
  merged=$("smartMerge").checked?smartMergeCodes(arr):simpleMerge(arr);
  mergedCode.value=merged;
  updatePreview();
}
function updatePreview(){
  if(!mergedCode.value.trim()){preview.srcdoc="";return}
  let src=mergedCode.value;
  if($("removeScripts").checked)src=src.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,"");
  preview.srcdoc=src;
}
function download(){
  const src=mergedCode.value;
  if(!src.trim()){alert("先にHTMLを結合してください。");return}
  const blob=new Blob([src],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="merged_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function copyCode(){
  if(!mergedCode.value){alert("コピーするコードがありません。");return}
  try{await navigator.clipboard.writeText(mergedCode.value);alert("コードをコピーしました。")}
  catch(e){mergedCode.select();document.execCommand("copy");alert("コードをコピーしました。")}
}
$("newBtn").onclick=newRecord;
$("saveBtn").onclick=save;
$("clearBtn").onclick=newRecord;
$("mergeBtn").onclick=doMerge;
$("downloadBtn").onclick=download;
$("copyBtn").onclick=copyCode;
$("previewBtn").onclick=updatePreview;
$("selectAllBtn").onclick=()=>{records.forEach(r=>selected.add(r.id));renderList();renderOrder();updateBadge()};
$("clearSelectBtn").onclick=()=>{selected.clear();renderList();renderOrder();updateBadge()};
$("fileBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  codeInput.value=await f.text();
  titleInput.value=f.name.replace(/\.(html?|HTML?)$/,"");
  editingId=null;status.textContent="ファイルを読み込みました："+f.name;
  e.target.value="";
};
$("exportDataBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="html-code-backup.json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("importDataBtn").onclick=()=>$("dataInput").click();
$("dataInput").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw Error();
    const incoming=data.filter(x=>x&&typeof x.title==="string"&&typeof x.code==="string")
      .map(x=>({...x,id:uid(),updatedAt:x.updatedAt||Date.now(),createdAt:x.createdAt||Date.now()}));
    records=records.concat(incoming);persist();renderList();
    alert(incoming.length+"件を追加しました。");
  }catch(err){alert("JSONデータを読み込めませんでした。")}
  e.target.value="";
};
mergedCode.addEventListener("input",()=>{merged=mergedCode.value});
load();
})();
</script>
</body>
</html>
