<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HTMLコード保存・結合ツール</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
.wrap{max-width:900px;margin:auto;padding:12px}
h1{font-size:20px;margin:4px 0 10px}
h2{font-size:16px;margin:0 0 8px}
.card{background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:12px;margin-bottom:10px}
.status{position:sticky;top:0;z-index:5;background:#eef6ff;border:1px solid #b9d8f7;border-radius:8px;padding:9px 10px;margin-bottom:10px;min-height:40px}
.status.ok{background:#eef9f0;border-color:#b9dfbf}
.status.warn{background:#fff8e8;border-color:#ead28b}
.status.err{background:#fff0f0;border-color:#e2b3b3}
.small{font-size:12px;color:#667085}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],textarea{width:100%;border:1px solid #cbd2da;border-radius:7px;padding:9px;font:inherit;background:#fff}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
button{border:0;border-radius:7px;padding:9px 12px;background:#2563eb;color:white;font-weight:600;cursor:pointer}
button.secondary{background:#64748b}
button.danger{background:#dc2626}
button.light{background:#e5e7eb;color:#222}
button:disabled{opacity:.45}
.file{padding:8px 0}
.list{margin-top:8px}
.item{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid #eee}
.item:first-child{border-top:0}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.orderitem{display:flex;align-items:center;gap:6px;padding:7px;background:#f1f5f9;border-radius:7px}
.orderitem .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;border-radius:8px;padding:10px;max-height:300px;overflow:auto;font-size:12px}
.hidden{display:none!important}
.count{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<h1>HTMLコード保存・結合ツール</h1>

<div id="status" class="status">待機中：操作するとここに結果が表示されます。</div>

<section class="card">
<h2>① HTMLを保存</h2>
<input id="title" type="text" placeholder="名前（例：xpcalc）">
<div style="height:7px"></div>
<textarea id="code" placeholder="HTMLコードを貼り付け"></textarea>
<div class="row" style="margin-top:7px">
<button id="saveBtn">保存する</button>
<button id="clearBtn" class="light">入力をクリア</button>
<label class="small">またはHTMLファイルを読み込む
<input id="fileInput" type="file" accept=".html,.htm,text/html" style="display:block;margin-top:4px">
</label>
</div>
<div id="editInfo" class="small" style="margin-top:7px"></div>
</section>

<section class="card">
<h2>② 保存データ</h2>
<div class="small">保存件数：<span id="savedCount" class="count">0</span>件</div>
<div id="savedList" class="list"></div>
<div class="row" style="margin-top:8px">
<button id="deleteBtn" class="danger">選択データを削除</button>
<button id="reloadBtn" class="secondary">保存データを再表示</button>
</div>
</section>

<section class="card">
<h2>③ 結合する順番</h2>
<div class="small">チェックしたものが下に並びます。▲▼で順番を変更できます。</div>
<div id="orderList" class="order"></div>
<div class="row" style="margin-top:8px">
<button id="mergeBtn">選択したHTMLを結合</button>
<button id="previewBtn" class="secondary">結合結果を見る</button>
<button id="downloadBtn" class="secondary">HTML保存</button>
</div>
</section>

<section class="card">
<h2>④ 結合結果</h2>
<div class="small" id="resultInfo">まだ結合していません。</div>
<pre id="result"></pre>
</section>
</div>

<script>
"use strict";

const KEY="html_merge_records_v3";
let records=[];
let selected=new Set();
let editingId=null;
let merged="";

const $=id=>document.getElementById(id);
const status=$("status");

function message(text,type="ok"){
  status.textContent=text;
  status.className="status "+type;
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    records=raw?JSON.parse(raw):[];
    if(!Array.isArray(records)) records=[];
    message("保存データを読み込みました。現在 "+records.length+"件です。","ok");
  }catch(e){
    records=[];
    message("保存データの読み込みに失敗しました："+e.message,"err");
  }
  render();
}

function persist(){
  try{
    localStorage.setItem(KEY,JSON.stringify(records));
    return true;
  }catch(e){
    message("保存失敗：ブラウザの保存容量を超えた可能性があります。","err");
    return false;
  }
}

function render(){
  $("savedCount").textContent=records.length;
  const list=$("savedList");
  list.innerHTML="";
  if(!records.length){
    list.innerHTML='<div class="small" style="padding:8px 0">保存データはありません。</div>';
  }else{
    records.forEach(r=>{
      const div=document.createElement("div");
      div.className="item";
      const cb=document.createElement("input");
      cb.type="checkbox";
      cb.checked=selected.has(r.id);
      cb.onchange=()=>{
        if(cb.checked) selected.add(r.id); else selected.delete(r.id);
        renderOrder();
        message(cb.checked?`「${r.title}」を結合対象に追加しました。`:`「${r.title}」を結合対象から外しました。`,"ok");
      };
      const name=document.createElement("div");
      name.className="name";
      name.textContent=r.title;
      const edit=document.createElement("button");
      edit.textContent="編集";
      edit.className="light";
      edit.onclick=()=>editRecord(r.id);
      div.append(cb,name,edit);
      list.appendChild(div);
    });
  }
  renderOrder();
}

function renderOrder(){
  const box=$("orderList");
  box.innerHTML="";
  const chosen=records.filter(r=>selected.has(r.id));
  if(!chosen.length){
    box.innerHTML='<div class="small">結合対象を選択してください。</div>';
    return;
  }
  chosen.forEach((r,i)=>{
    const div=document.createElement("div");
    div.className="orderitem";
    const n=document.createElement("span");
    n.className="name";
    n.textContent=(i+1)+". "+r.title;
    const up=document.createElement("button");
    up.textContent="▲"; up.className="light";
    up.onclick=()=>move(i,-1);
    const down=document.createElement("button");
    down.textContent="▼"; down.className="light";
    down.onclick=()=>move(i,1);
    div.append(n,up,down);
    box.appendChild(div);
  });
}

function move(index,delta){
  const chosen=records.filter(r=>selected.has(r.id));
  const ni=index+delta;
  if(ni<0||ni>=chosen.length){
    message("これ以上移動できません。","warn");
    return;
  }
  const a=chosen[index].id,b=chosen[ni].id;
  const ia=records.findIndex(r=>r.id===a), ib=records.findIndex(r=>r.id===b);
  [records[ia],records[ib]]=[records[ib],records[ia]];
  if(persist()){
    render();
    message(`結合順を変更しました：「${records[ia].title}」と「${records[ib].title}」を入れ替えました。`);
  }
}

$("saveBtn").onclick=()=>{
  const title=$("title").value.trim();
  const code=$("code").value;
  if(!title){message("保存できません：名前を入力してください。","warn");$("title").focus();return}
  if(!code.trim()){message("保存できません：HTMLコードを入力してください。","warn");$("code").focus();return}

  if(editingId){
    const r=records.find(x=>x.id===editingId);
    if(r){r.title=title;r.code=code;r.updated=new Date().toISOString();}
    editingId=null;
    $("editInfo").textContent="";
    if(persist()){render();message(`「${title}」を更新して保存しました。`);}
  }else{
    const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2),title,code,created:new Date().toISOString()};
    records.push(r);
    if(persist()){
      render();
      selected.add(r.id);
      render();
      message(`「${title}」を保存しました。結合対象にも追加しました。`);
    }
  }
};

$("clearBtn").onclick=()=>{
  $("title").value="";$("code").value="";editingId=null;$("editInfo").textContent="";
  message("入力欄をクリアしました。","ok");
};

$("fileInput").onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  try{
    const text=await file.text();
    $("title").value=file.name.replace(/\.(html?|HTML?)$/,"");
    $("code").value=text;
    message(`「${file.name}」を読み込みました。内容を確認して「保存する」を押してください。`);
  }catch(err){message("ファイル読み込み失敗："+err.message,"err")}
  e.target.value="";
};

function editRecord(id){
  const r=records.find(x=>x.id===id);
  if(!r)return;
  $("title").value=r.title;
  $("code").value=r.code;
  editingId=id;
  $("editInfo").textContent="編集中：「"+r.title+"」";
  window.scrollTo({top:0,behavior:"smooth"});
  message(`「${r.title}」を編集モードにしました。保存すると上書き更新します。`);
}

$("deleteBtn").onclick=()=>{
  const ids=[...selected];
  if(!ids.length){message("削除するデータを選択してください。","warn");return}
  const names=records.filter(r=>selected.has(r.id)).map(r=>r.title);
  if(!confirm(names.join("、")+" を削除しますか？")){message("削除をキャンセルしました。","warn");return}
  records=records.filter(r=>!selected.has(r.id));
  selected.clear();
  if(persist()){render();message(names.length+"件を削除しました。");}
};

$("reloadBtn").onclick=()=>load();

$("mergeBtn").onclick=()=>{
  const chosen=records.filter(r=>selected.has(r.id));
  if(!chosen.length){message("結合できません：結合対象を1件以上選択してください。","warn");return}
  // 軽量版：文字列として順番通り連結。DOMParserは使用しない。
  merged=chosen.map((r,i)=>`<!-- ===== ${r.title} START ===== -->\n${r.code}\n<!-- ===== ${r.title} END ===== -->`).join("\n\n");
  $("result").textContent=merged;
  $("resultInfo").textContent=`結合完了：${chosen.length}件 / ${merged.length.toLocaleString()}文字`;
  message(`${chosen.length}件を指定順で結合しました。結果は下の「結合結果」に表示されています。`);
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
};

$("previewBtn").onclick=()=>{
  if(!merged){message("プレビューできません：先に「選択したHTMLを結合」を押してください。","warn");return}
  const w=window.open("","_blank");
  if(!w){message("プレビューを開けませんでした。Safariのポップアップ設定を確認してください。","err");return}
  w.document.open();w.document.write(merged);w.document.close();
  message("結合結果を新しい画面でプレビューしました。");
};

$("downloadBtn").onclick=()=>{
  if(!merged){message("保存できません：先にHTMLを結合してください。","warn");return}
  const blob=new Blob([merged],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="merged.html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  message("merged.html の保存処理を開始しました。");
};

load();
</script>
</body>
</html>
