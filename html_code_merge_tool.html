<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HTMLコード保存・軽量マージツール</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f8;--card:#fff;--line:#dce2e8;--text:#20252b;--muted:#697582;--blue:#2563eb;--bluebg:#eef4ff;--red:#dc2626}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px}
h1{font-size:19px;margin:0 0 4px}header p{font-size:12px;color:var(--muted);margin:0}
main{max-width:1100px;margin:auto;padding:12px}
.layout{display:grid;grid-template-columns:350px 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.card h2{font-size:14px;margin:0;padding:11px 13px;border-bottom:1px solid var(--line)}
.body{padding:12px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field{margin-bottom:10px}
input[type=text],textarea{width:100%;border:1px solid #cbd4dd;border-radius:8px;padding:8px;background:#fcfdff;color:var(--text);outline:none}
textarea{resize:vertical}
#code{height:250px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#result{height:230px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{border:0;border-radius:8px;padding:8px 10px;background:#edf1f5;color:#27313b;font-weight:650;cursor:pointer}
button.primary{background:var(--blue);color:#fff}button.red{background:#fff0f0;color:var(--red)}
button.small{padding:5px 7px;font-size:11px}
.buttons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.status{font-size:11px;color:var(--muted);min-height:17px}
.list{max-height:390px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);border-radius:9px;padding:7px}
.item.sel{border-color:var(--blue);background:var(--bluebg)}
.line{display:flex;align-items:center;gap:7px}.line input{margin:0}
.name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700}
.meta{font-size:10px;color:var(--muted);margin-top:3px}
.actions{display:flex;gap:4px;margin-top:5px}.actions button{flex:1}
.order{display:flex;flex-direction:column;gap:5px;margin:6px 0 11px}
.orderrow{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:11px}
.orderrow .n{width:20px;text-align:center}.orderrow .name{font-weight:600}
.preview{display:block;width:100%;height:300px;border:1px solid var(--line);border-radius:8px;background:#fff}
.check{display:flex;align-items:center;gap:6px;font-weight:500}.check input{width:auto}
.note{font-size:10px;color:var(--muted);line-height:1.45;margin:6px 0 9px}
.empty{text-align:center;color:var(--muted);font-size:11px;padding:20px 5px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media(max-width:760px){.layout{grid-template-columns:1fr}#code{height:230px}.preview{height:270px}}
</style>
</head>
<body>
<header>
<h1>HTMLコード保存・軽量マージツール</h1>
<p>普段は軽く動作し、結合・プレビュー時だけ処理します。</p>
</header>
<main><div class="layout">

<section class="card">
<h2>① 保存・管理</h2>
<div class="body">
<div class="field"><label>名前</label><input id="title" type="text" placeholder="例：xpcalc 本体"></div>
<div class="field"><label>HTMLコード</label><textarea id="code" spellcheck="false" placeholder="HTMLコードを貼り付け"></textarea></div>
<div class="buttons">
<button class="primary" id="save">保存</button>
<button id="new">新規</button>
<button id="fileBtn">HTML読込</button>
<input id="file" type="file" accept=".html,.htm,text/html" hidden>
</div>
<div id="status" class="status"></div>
<hr>
<label>保存済みコード</label>
<div id="list" class="list"></div>
<div class="buttons">
<button id="backup">バックアップ</button>
<button id="restore">復元</button>
<input id="json" type="file" accept=".json,application/json" hidden>
</div>
</div>
</section>

<section class="card">
<h2>② 選択 → 順番 → 結合</h2>
<div class="body">
<div class="buttons">
<button class="primary" id="merge">結合する</button>
<button id="all">全選択</button>
<button id="none">全解除</button>
</div>
<label class="check"><input id="smart" type="checkbox" checked> スマート結合</label>
<div class="note">ON：HTML文書としてhead/bodyを整理して結合。OFF：各コードをbody内へそのまま並べます。大きなコードではOFFのほうが軽量です。</div>
<label>結合順</label>
<div id="order" class="order"></div>
<label>プレビュー</label>
<iframe id="preview" class="preview" sandbox=""></iframe>
<div class="buttons">
<button id="previewBtn">プレビュー更新</button>
<button id="copy">コピー</button>
<button class="primary" id="download">HTML保存</button>
</div>
<label>完成HTML</label>
<textarea id="result" spellcheck="false" placeholder="「結合する」で生成"></textarea>
</div>
</section>

</div></main>

<script>
"use strict";
(function(){
const KEY="html_merge_light_v1";
let records=[];
let selected=new Set();
let editingId=null;

const $=id=>document.getElementById(id);
const title=$("title"),code=$("code"),list=$("list"),order=$("order"),result=$("result"),preview=$("preview"),status=$("status");

function makeId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(records));return true}
  catch(e){status.textContent="保存容量を超えました。バックアップを利用してください。";return false}
}
function load(){
  try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");records=Array.isArray(x)?x:[]}
  catch(e){records=[]}
  renderList();renderOrder();
}
function renderList(){
  const frag=document.createDocumentFragment();
  if(!records.length){
    const e=document.createElement("div");e.className="empty";e.innerHTML="まだ保存されていません。";frag.appendChild(e);
  }else{
    records.forEach((r,i)=>{
      const e=document.createElement("div");e.className="item"+(selected.has(r.id)?" sel":"");
      e.innerHTML='<div class="line"><input type="checkbox" '+(selected.has(r.id)?"checked":"")+'><div class="name">'+esc(r.title||"無題")+'</div></div>'+
        '<div class="meta">'+Number(r.code.length).toLocaleString()+"文字"+(r.updated?"　"+new Date(r.updated).toLocaleString("ja-JP"):"")+'</div>'+
        '<div class="actions"><button class="small edit">編集</button><button class="small up">▲</button><button class="small down">▼</button><button class="small red del">削除</button></div>';
      e.querySelector("input").onchange=ev=>{
        if(ev.target.checked)selected.add(r.id);else selected.delete(r.id);
        // 選択変更では保存も全一覧再構築もしない
        e.classList.toggle("sel",ev.target.checked);renderOrder();
      };
      e.querySelector(".edit").onclick=()=>edit(r.id);
      e.querySelector(".up").onclick=()=>moveRecord(i,-1);
      e.querySelector(".down").onclick=()=>moveRecord(i,1);
      e.querySelector(".del").onclick=()=>{
        if(confirm("「"+r.title+"」を削除しますか？")){
          records.splice(i,1);selected.delete(r.id);
          if(editingId===r.id)newEntry();
          persist();renderList();renderOrder();
        }
      };
      frag.appendChild(e);
    });
  }
  list.replaceChildren(frag);
}
function renderOrder(){
  const frag=document.createDocumentFragment();
  const arr=records.filter(r=>selected.has(r.id));
  if(!arr.length){
    const e=document.createElement("div");e.className="empty";e.textContent="選択したコードの順番がここに表示されます。";frag.appendChild(e);
  }else{
    arr.forEach((r,i)=>{
      const e=document.createElement("div");e.className="orderrow";
      e.innerHTML='<span class="n">'+(i+1)+'</span><span class="name">'+esc(r.title||"無題")+'</span>'+
        '<button class="small up">▲</button><button class="small down">▼</button><button class="small red remove">解除</button>';
      e.querySelector(".up").onclick=()=>moveSelected(i,-1);
      e.querySelector(".down").onclick=()=>moveSelected(i,1);
      e.querySelector(".remove").onclick=()=>{selected.delete(r.id);renderList();renderOrder()};
      frag.appendChild(e);
    });
  }
  order.replaceChildren(frag);
}
function moveRecord(i,d){
  const j=i+d;if(j<0||j>=records.length)return;
  [records[i],records[j]]=[records[j],records[i]];
  persist();renderList();renderOrder();
}
function moveSelected(i,d){
  const arr=records.filter(r=>selected.has(r.id)),j=i+d;
  if(j<0||j>=arr.length)return;
  const a=records.indexOf(arr[i]),b=records.indexOf(arr[j]);
  [records[a],records[b]]=[records[b],records[a]];
  persist();renderList();renderOrder();
}
function edit(id){
  const r=records.find(x=>x.id===id);if(!r)return;
  editingId=id;title.value=r.title;code.value=r.code;status.textContent="編集中："+r.title;
  title.focus();
}
function newEntry(){editingId=null;title.value="";code.value="";status.textContent="新規入力";}
function saveEntry(){
  const c=code.value;
  if(!c.trim()){alert("HTMLコードを入力してください。");return}
  const t=title.value.trim()||"無題";
  if(editingId){
    const r=records.find(x=>x.id===editingId);if(r){r.title=t;r.code=c;r.updated=Date.now()}
  }else{
    const r={id:makeId(),title:t,code:c,updated:Date.now()};
    records.push(r);selected.add(r.id);editingId=r.id;
  }
  persist();renderList();renderOrder();status.textContent="保存しました："+t;
}
function simpleMerge(arr){
  return '<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n</head>\n<body>\n'+
    arr.map(r=>'<!-- ===== '+r.title.replace(/-->/g,"")+' ===== -->\n'+r.code).join("\n\n")+
    '\n</body>\n</html>';
}
function smartMerge(arr){
  // DOMParserは結合時に1回だけ実行。通常操作では呼ばない。
  const p=new DOMParser(),heads=[],bodies=[];let pageTitle="";
  arr.forEach(r=>{
    const d=p.parseFromString(r.code,"text/html");
    if(!pageTitle && d.title)pageTitle=d.title;
    Array.from(d.head.children).forEach(n=>{
      if(n.tagName.toLowerCase()!=="title")heads.push(n.outerHTML);
    });
    Array.from(d.body.childNodes).forEach(n=>{
      if(n.nodeType===1)bodies.push(n.outerHTML);
      else if(n.nodeType===3 && n.textContent.trim())bodies.push(n.textContent);
    });
  });
  return '<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n'+
    (pageTitle?'<title>'+esc(pageTitle)+'</title>\n':'')+
    heads.join("\n")+'\n</head>\n<body>\n'+bodies.join("\n")+
    '\n</body>\n</html>';
}
function doMerge(){
  const arr=records.filter(r=>selected.has(r.id));
  if(!arr.length){alert("結合するコードを選択してください。");return}
  status.textContent="結合処理中…";
  // UI更新を1フレーム挟み、大きなコードでも固まったように見えにくくする
  requestAnimationFrame(()=>{
    try{
      result.value=$("smart").checked?smartMerge(arr):simpleMerge(arr);
      status.textContent=arr.length+"件を結合しました。";
    }catch(e){alert("結合中にエラーが発生しました。");status.textContent="結合エラー";}
  });
}
function updatePreview(){
  if(!result.value.trim()){alert("先に結合してください。");return}
  preview.srcdoc=result.value;
}
async function copy(){
  if(!result.value){alert("先に結合してください。");return}
  try{await navigator.clipboard.writeText(result.value);status.textContent="コピーしました。"}
  catch(e){result.focus();result.select();document.execCommand("copy");status.textContent="コピーしました。"}
}
function download(){
  if(!result.value){alert("先に結合してください。");return}
  const b=new Blob([result.value],{type:"text/html;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  const d=new Date(),z=n=>String(n).padStart(2,"0");
  a.href=u;a.download="merged_"+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+".html";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
$("save").onclick=saveEntry;$("new").onclick=newEntry;$("merge").onclick=doMerge;
$("previewBtn").onclick=updatePreview;$("copy").onclick=copy;$("download").onclick=download;
$("all").onclick=()=>{selected=new Set(records.map(r=>r.id));renderList();renderOrder()};
$("none").onclick=()=>{selected.clear();renderList();renderOrder()};
$("fileBtn").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{code.value=await f.text();title.value=f.name.replace(/\.(html?|HTML?)$/i,"");editingId=null;status.textContent="読み込み完了。確認して「保存」を押してください。"}
  catch(err){alert("ファイルを読み込めませんでした。")}
  e.target.value="";
};
$("backup").onclick=()=>{
  const b=new Blob([JSON.stringify(records,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="html_merge_backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
$("restore").onclick=()=>$("json").click();
$("json").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();
    let n=0;
    data.forEach(x=>{if(x&&typeof x.code==="string"){records.push({id:makeId(),title:String(x.title||"無題"),code:x.code,updated:Date.now()});n++}});
    persist();renderList();renderOrder();alert(n+"件を追加しました。");
  }catch(err){alert("バックアップJSONを読み込めませんでした。")}
  e.target.value="";
};
load();
})();
</script>
</body>
</html>
