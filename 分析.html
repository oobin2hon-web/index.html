<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生産・作業分析ツール</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --border: #334155;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 20px; }
        h2 { font-size: 16px; }
        h1, h2, h3 {
            color: #f1f5f9;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 5px;
            touch-action: manipulation;
        }
        button:active { opacity: 0.8; }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }
        th { background-color: #0f172a; cursor: pointer; }
        input[type="text"], input[type="number"], select {
            background-color: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
        }
        .small-input { width: 70px !important; }
        .highlight { color: var(--accent); font-weight: bold; }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 15px;
            align-items: center;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .btn-file {
            background-color: #8b5cf6;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
            font-size: 14px;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            width: 95%; max-width: 600px;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px; margin-bottom: 12px;
        }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        /* 材料行のレイアウト修正：材料名を広く、個数・単価を適切に */
        .material-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .material-row .mat-name { flex: 3; }
        .material-row .mat-count { flex: 1; min-width: 60px; }
        .material-row .mat-price { flex: 1.5; min-width: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h1>生産・作業分析ツール</h1>

    <div class="card">
        <h2>作業結果の自動解析 ＆ 追加</h2>
        <p style="font-size: 13px; color: var(--text-muted);">テキストを貼り付けてボタンを押してください。</p>
        <textarea id="logInput" placeholder="例:
錬金術師LV 7 (+1.44%)
28.52%
獲得したもの
スノーフラワー
494本
作業回数：40回"></textarea>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
            <button id="parseBtn" style="background-color: var(--primary);">テキストを解析して追加</button>
            <button id="addManualBtn" style="background-color: var(--accent);">＋ 手動で追加</button>
        </div>
    </div>

    <div class="card">
        <h2>記録一覧 & シミュレーション</h2>
        
        <div class="filter-bar">
            <label>🔍 職種: 
                <select id="professionFilter">
                    <option value="all">すべて</option>
                </select>
            </label>
            <label>🔎 検索: 
                <input type="text" id="searchKeyword" placeholder="キーワード..." style="width: 140px;">
            </label>
        </div>

        <table id="recordTable">
            <thead>
                <tr>
                    <th data-sort="profession">職種 ↕</th>
                    <th data-sort="itemName">アイテム ↕</th>
                    <th data-sort="amount">獲得数 ↕</th>
                    <th data-sort="workCount">回数 ↕</th>
                    <th>原価詳細</th>
                    <th data-sort="cost">原価合計 ↕</th>
                    <th data-sort="price">販売価格 ↕</th>
                    <th data-sort="speed">1h販売 ↕</th>
                    <th>売切予測</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        
        <div class="button-group">
            <button id="saveBtn" style="background-color: var(--accent);">保存</button>
            <button id="exportBtn" style="background-color: #3b82f6;">📥 ファイル出力</button>
            <button id="markdownBtn" style="background-color: #f59e0b;">🐻 Markdown</button>
            
            <div class="file-input-wrapper">
                <button class="btn-file">📂 読込</button>
                <input type="file" id="importFile" accept=".html,.json">
            </div>
            
            <button id="clearBtn" style="background-color: var(--danger);">全削除</button>
        </div>
    </div>
</div>

<!-- モーダル -->
<div id="materialModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle" style="margin:0; font-size:16px;">材料設定</h3>
            <button class="close-btn" id="modalCloseBtn">&times;</button>
        </div>
        <div id="materialListContainer"></div>
        <button id="addMatRowBtn" style="background-color: #334155; margin-bottom: 12px; font-size:13px;">＋ 材料行を追加</button>
        <div style="text-align: right; border-top: 1px solid var(--border); padding-top: 10px;">
            <p style="font-size: 14px; margin: 5px 0;">原価合計: <span id="modalCalculatedCost" class="highlight" style="font-size: 18px;">0</span> G</p>
            <button id="modalSaveBtn" style="background-color: var(--accent);">確定して保存</button>
        </div>
    </div>
</div>

<script>
    let records = [];
    let currentSort = { column: null, ascending: true };
    let editingIndex = null;

    let masters = {
        professions: ["錬金術師", "木こり", "採掘師", "狩人", "農家", "紡績工", "裁縫師", "鍛冶師", "彫金師", "薬師", "料理人"],
        items: [],
        materials: []
    };

    window.addEventListener('DOMContentLoaded', () => {
        loadDataFromStorage();
        initEventListeners();
        updateProfessionFilterOptions();
        renderTable();
    });

    function loadDataFromStorage() {
        try {
            const savedRecords = localStorage.getItem('alchemy_records_v6');
            if (savedRecords) {
                records = JSON.parse(savedRecords);
                records.forEach(r => { if (!r.materials) r.materials = []; });
            }
            const savedMasters = localStorage.getItem('alchemy_masters_v6');
            if (savedMasters) {
                masters = JSON.parse(savedMasters);
            }
        } catch (e) {
            console.error("データ読込エラー:", e);
        }
        updateAllMasters();
    }

    // 保存処理の安定化（エラーが出ないように調整）
    function saveData(showAlert = true) {
        try {
            localStorage.setItem('alchemy_records_v6', JSON.stringify(records));
            localStorage.setItem('alchemy_masters_v6', JSON.stringify(masters));
            if (showAlert) {
                alert('データを保存しました！');
            }
            return true;
        } catch (e) {
            console.error("保存エラー:", e);
            alert('保存に失敗しました（容量制限やブラウザ設定をご確認ください）');
            return false;
        }
    }

    function initEventListeners() {
        document.getElementById('parseBtn').addEventListener('click', parseAndAddLog);
        document.getElementById('addManualBtn').addEventListener('click', addNewManualRecord);
        document.getElementById('professionFilter').addEventListener('change', renderTable);
        document.getElementById('searchKeyword').addEventListener('input', renderTable);
        
        document.getElementById('saveBtn').addEventListener('click', () => saveData(true));
        document.getElementById('exportBtn').addEventListener('click', exportHTMLFile);
        document.getElementById('markdownBtn').addEventListener('click', copyForBear);
        document.getElementById('importFile').addEventListener('change', importDataFile);
        document.getElementById('clearBtn').addEventListener('click', clearAllData);

        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        document.getElementById('addMatRowBtn').addEventListener('click', addMaterialRow);
        document.getElementById('modalSaveBtn').addEventListener('click', saveModalMaterials);

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                let col = th.getAttribute('data-sort');
                if (currentSort.column === col) {
                    currentSort.ascending = !currentSort.ascending;
                } else {
                    currentSort.column = col;
                    currentSort.ascending = true;
                }
                renderTable();
            });
        });
    }

    function updateAllMasters() {
        let itemSet = new Set(masters.items);
        let matSet = new Set(masters.materials);
        let profSet = new Set(masters.professions);

        records.forEach(r => {
            if (r.profession) profSet.add(r.profession);
            if (r.itemName) itemSet.add(r.itemName);
            if (r.materials) {
                r.materials.forEach(m => { if (m.name) matSet.add(m.name); });
            }
        });

        masters.professions = [...profSet];
        masters.items = [...itemSet];
        masters.materials = [...matSet];
    }

    function parseAndAddLog() {
        const rawText = document.getElementById('logInput').value;
        if (!rawText.trim()) {
            alert('テキストを入力してください。');
            return;
        }

        const normalizedText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const lines = normalizedText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        let profession = "錬金術師";
        let itemName = "";
        let amount = 0;
        let workCount = 1;

        for (let line of lines) {
            for (let prof of masters.professions) {
                if (line.includes(prof)) {
                    profession = prof;
                    break;
                }
            }
        }

        for (let line of lines) {
            if (line.includes("作業回数")) {
                let workMatch = line.match(/([\d,]+)/);
                if (workMatch) workCount = parseInt(workMatch[1].replace(/,/g, ''));
            }
        }

        for (let i = 0; i < lines.length; i++) {
            if (lines[i] === "獲得したもの" || lines[i].includes("獲得")) {
                if (i + 1 < lines.length) {
                    itemName = lines[i + 1];
                }
                if (i + 2 < lines.length) {
                    let amtMatch = lines[i + 2].match(/^([\d,]+)/);
                    if (amtMatch) {
                        amount = parseInt(amtMatch[1].replace(/,/g, ''));
                    }
                }
                break;
            }
        }

        if (!itemName && lines.length >= 2) {
            itemName = lines[lines.length - 2];
            let amtMatch = lines[lines.length - 1].match(/^([\d,]+)/);
            if (amtMatch) amount = parseInt(amtMatch[1].replace(/,/g, ''));
        }

        if (!itemName) itemName = "スノーフラワー";
        if (isNaN(amount) || amount <= 0) amount = 1;

        const newRecord = {
            id: Date.now(),
            profession: profession,
            itemName: itemName,
            amount: amount,
            workCount: workCount,
            materials: [],
            cost: 0,
            price: 0,
            speed: 10
        };

        records.push(newRecord);
        updateAllMasters();
        updateProfessionFilterOptions();
        renderTable();
        saveData(false);
        document.getElementById('logInput').value = '';
        alert(`✅ 追加成功: ${itemName} (${amount}個 / 作業回数:${workCount})`);
    }

    function addNewManualRecord() {
        const newRecord = {
            id: Date.now(),
            profession: masters.professions[0] || "錬金術師",
            itemName: "新しいアイテム",
            amount: 1,
            workCount: 1,
            materials: [],
            cost: 0,
            price: 0,
            speed: 10
        };
        records.push(newRecord);
        updateAllMasters();
        updateProfessionFilterOptions();
        renderTable();
        saveData(false);
    }

    function updateProfessionFilterOptions() {
        const select = document.getElementById('professionFilter');
        const currentValue = select.value;
        select.innerHTML = '<option value="all">すべて</option>';
        masters.professions.forEach(prof => {
            const opt = document.createElement('option');
            opt.value = prof;
            opt.textContent = prof;
            select.appendChild(opt);
        });
        select.value = currentValue;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const selectedProf = document.getElementById('professionFilter').value;
        const searchKeyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
        tbody.innerHTML = '';

        let filteredRecords = records.filter(rec => {
            const matchProf = (selectedProf === 'all' || rec.profession === selectedProf);
            let matchKeyword = true;
            if (searchKeyword) {
                const matchItem = rec.itemName.toLowerCase().includes(searchKeyword);
                const matchMat = rec.materials && rec.materials.some(m => m.name.toLowerCase().includes(searchKeyword));
                const matchProfText = rec.profession.toLowerCase().includes(searchKeyword);
                matchKeyword = matchItem || matchMat || matchProfText;
            }
            return matchProf && matchKeyword;
        });

        if (currentSort.column) {
            filteredRecords.sort((a, b) => {
                let valA = a[currentSort.column];
                let valB = b[currentSort.column];
                if (typeof valA === 'string') {
                    return currentSort.ascending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return currentSort.ascending ? valA - valB : valB - valA;
                }
            });
        }

        if (filteredRecords.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">記録がありません</td></tr>';
            return;
        }

        filteredRecords.forEach((rec) => {
            const index = records.findIndex(r => r.id === rec.id);

            if (rec.materials && rec.materials.length > 0) {
                rec.cost = rec.materials.reduce((sum, m) => sum + ((parseFloat(m.count) || 0) * (parseFloat(m.unitPrice) || 0)), 0);
            }

            let timeText = "-";
            if (rec.speed > 0 && rec.amount > 0) {
                let hours = rec.amount / rec.speed;
                let h = Math.floor(hours);
                let m = Math.round((hours - h) * 60);
                timeText = `${h}h ${m}m`;
            }

            const tr = document.createElement('tr');
            
            let profHtml = `<select class="row-prof" data-index="${index}">`;
            masters.professions.forEach(p => {
                profHtml += `<option value="${p}" ${p === rec.profession ? 'selected' : ''}>${p}</option>`;
            });
            profHtml += `</select>`;

            let itemHtml = `<input type="text" class="row-item" data-index="${index}" value="${rec.itemName}">`;

            tr.innerHTML = `
                <td>${profHtml}</td>
                <td>${itemHtml}</td>
                <td><input type="number" value="${rec.amount}" class="small-input row-amount" data-index="${index}"></td>
                <td><input type="number" value="${rec.workCount}" class="small-input row-work" data-index="${index}"></td>
                <td><button class="btn-modal" data-index="${index}" style="background-color: #334155; padding: 4px 8px; margin:0; font-size: 11px;">🧪編集 (${rec.materials ? rec.materials.length : 0})</button></td>
                <td><strong>${rec.cost.toLocaleString()}G</strong></td>
                <td><input type="number" value="${rec.price}" class="small-input row-price" data-index="${index}"></td>
                <td><input type="number" value="${rec.speed}" class="small-input row-speed" data-index="${index}"></td>
                <td><span class="highlight">${timeText}</span></td>
                <td><button class="btn-delete" data-index="${index}" style="background-color: var(--danger); padding: 4px 8px; margin:0; font-size:11px;">削除</button></td>
            `;
            tbody.appendChild(tr);
        });

        bindTableEvents();
    }

    function bindTableEvents() {
        document.querySelectorAll('.row-prof').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].profession = e.target.value;
                updateProfessionFilterOptions();
                saveData(false);
            });
        });
        document.querySelectorAll('.row-item').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].itemName = e.target.value;
                updateAllMasters();
                saveData(false);
            });
        });
        document.querySelectorAll('.row-amount').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].amount = parseFloat(e.target.value) || 0;
                renderTable();
                saveData(false);
            });
        });
        document.querySelectorAll('.row-work').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].workCount = parseFloat(e.target.value) || 0;
                saveData(false);
            });
        });
        document.querySelectorAll('.row-price').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].price = parseFloat(e.target.value) || 0;
                saveData(false);
            });
        });
        document.querySelectorAll('.row-speed').forEach(el => {
            el.addEventListener('change', (e) => {
                let idx = e.target.getAttribute('data-index');
                records[idx].speed = parseFloat(e.target.value) || 0;
                renderTable();
                saveData(false);
            });
        });
        document.querySelectorAll('.btn-modal').forEach(el => {
            el.addEventListener('click', (e) => {
                let idx = e.target.getAttribute('data-index');
                openModal(idx);
            });
        });
        document.querySelectorAll('.btn-delete').forEach(el => {
            el.addEventListener('click', (e) => {
                let idx = e.target.getAttribute('data-index');
                if (confirm('削除しますか？')) {
                    records.splice(idx, 1);
                    updateProfessionFilterOptions();
                    renderTable();
                    saveData(false);
                }
            });
        });
    }

    function openModal(index) {
        editingIndex = index;
        const rec = records[index];
        document.getElementById('modalTitle').textContent = `材料設定: ${rec.itemName}`;
        
        const container = document.getElementById('materialListContainer');
        container.innerHTML = '';

        if (!rec.materials || rec.materials.length === 0) {
            rec.materials = [{ name: '', count: 1, unitPrice: 0 }];
        }

        rec.materials.forEach((mat) => {
            appendMaterialRow(mat.name, mat.count, mat.unitPrice);
        });

        calculateModalCost();
        document.getElementById('materialModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('materialModal').style.display = 'none';
        editingIndex = null;
    }

    function appendMaterialRow(name = '', count = 1, unitPrice = 0) {
        const container = document.getElementById('materialListContainer');
        const row = document.createElement('div');
        row.className = 'material-row';
        
        row.innerHTML = `
            <input type="text" placeholder="材料名" value="${name}" class="mat-name" style="font-size:13px;">
            <input type="number" placeholder="個数" value="${count}" class="mat-count" style="font-size:13px;">
            <input type="number" placeholder="G" value="${unitPrice}" class="mat-price" style="font-size:13px;">
            <button type="button" class="mat-del" style="background-color: var(--danger); padding: 4px 8px; margin:0;">×</button>
        `;

        row.querySelector('.mat-count').addEventListener('input', calculateModalCost);
        row.querySelector('.mat-price').addEventListener('input', calculateModalCost);
        row.querySelector('.mat-del').addEventListener('click', (e) => {
            e.target.parentElement.remove();
            calculateModalCost();
        });

        container.appendChild(row);
    }

    function addMaterialRow() { appendMaterialRow('', 1, 0); }

    function calculateModalCost() {
        const rows = document.querySelectorAll('#materialListContainer .material-row');
        let total = 0;
        rows.forEach(row => {
            let count = parseFloat(row.querySelector('.mat-count').value) || 0;
            let price = parseFloat(row.querySelector('.mat-price').value) || 0;
            total += count * price;
        });
        document.getElementById('modalCalculatedCost').textContent = total.toLocaleString();
    }

    function saveModalMaterials() {
        if (editingIndex === null) return;
        const rows = document.querySelectorAll('#materialListContainer .material-row');
        let newMaterials = [];
        let totalCost = 0;

        rows.forEach(row => {
            let name = row.querySelector('.mat-name').value.trim();
            let count = parseFloat(row.querySelector('.mat-count').value) || 0;
            let unitPrice = parseFloat(row.querySelector('.mat-price').value) || 0;
            if (name) {
                newMaterials.push({ name, count, unitPrice });
                totalCost += count * unitPrice;
            }
        });

        records[editingIndex].materials = newMaterials;
        records[editingIndex].cost = totalCost;

        updateAllMasters();
        closeModal();
        renderTable();
        saveData(false);
    }

    function exportHTMLFile() {
        saveData(false);
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tracker_${new Date().toISOString().slice(0,10)}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function importDataFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const content = e.target.result;
                let imported = [];
                if (file.name.endsWith('.json')) {
                    imported = JSON.parse(content);
                } else {
                    let match = content.match(/let records = (\[[\s\S]*?\]);/);
                    if (match) {
                        imported = JSON.parse(match[1]);
                    } else {
                        throw new Error("データが見つかりません");
                    }
                }
                records = records.concat(imported);
                updateAllMasters();
                updateProfessionFilterOptions();
                renderTable();
                saveData(false);
                alert('読み込み成功！');
            } catch (err) { alert('読み込み失敗: ' + err.message); }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function copyForBear() {
        if (records.length === 0) { alert('データがありません'); return; }
        let md = `# 生産・作業分析レポート\n\n| 職種 | アイテム | 獲得数 | 原価合計 |\n| :--- | :--- | :---: | :---: |\n`;
        records.forEach(rec => {
            md += `| ${rec.profession} | ${rec.itemName} | ${rec.amount} | ${rec.cost.toLocaleString()}G |\n`;
        });
        navigator.clipboard.writeText(md).then(() => { alert('Markdownをコピーしました！'); });
    }

    function clearAllData() {
        if (confirm("全データを削除しますか？")) {
            records = [];
            localStorage.removeItem('alchemy_records_v6');
            updateProfessionFilterOptions();
            renderTable();
            alert('全データを削除しました。');
        }
    }
</script>
