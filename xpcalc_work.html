<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業経験値計算 - SOLDOUT2</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 12px;
    background: #f5f5f5;
    color: #222;
}
.container { max-width: 700px; margin: auto; }
.header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.back-btn {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    background: #e0e0e0;
    color: #333;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}
h1 { font-size: 20px; margin: 0; text-align: center; flex-grow: 1; }
.card {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
h2 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #1976d2; }
.help-text { font-size: 11px; color: #666; margin-bottom: 8px; line-height: 1.4; }
textarea, input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
}
textarea { height: 110px; font-family: monospace; resize: vertical; }
.form-group { margin-bottom: 10px; }
.form-group label {
    font-size: 12px;
    font-weight: bold;
    color: #444;
    display: block;
    margin-bottom: 4px;
}
.form-row { display: flex; gap: 8px; }
.form-row input { margin-bottom: 0; }
button {
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
}
.primary-btn { background: #1976d2; color: white; margin-bottom: 6px; }
.secondary-btn { background: #4caf50; color: white; }
.action-btn-group { display: flex; gap: 8px; }
.merge-btn { background: #ff9800; color: white; font-size: 12px; padding: 6px 10px; width: auto; }
.clear-all-btn { background: #e53935; color: white; font-size: 12px; padding: 6px 10px; width: auto; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 13px;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}
th { background: #f0f0f0; }
.del-btn {
    background: #e53935;
    color: white;
    padding: 4px 8px;
    font-size: 11px;
    width: auto;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class="container">

    <div class="header-bar">
        <a href="index.html" class="back-btn">← 戻る</a>
        <h1>作業経験値計算</h1>
        <div style="width: 60px;"></div>
    </div>

    <!-- 1. 共通設定（題目） -->
    <div class="card" style="border-left: 5px solid #1976d2;">
        <div class="form-group" style="margin-bottom: 0;">
            <label for="commonWorkName">📌 対象の作業名（任意）</label>
            <input type="text" id="commonWorkName" placeholder="例: 斧作成（ログから取れない場合に適用されます）">
        </div>
    </div>

    <!-- 2. ログ柔軟解析 -->
    <div class="card">
        <h2>📋 ゲーム内ログから自動解析</h2>
        <div class="help-text">
            ゲーム内の画面テキストをそのまま丸ごと貼り付けてOKです。
        </div>
        <textarea id="logInput" placeholder="貼り付け例：
46.93%
鍛冶職人LV 7 (+1.81%)
26.1%
獲得したもの
斧
436本
作業回数：50回"></textarea>
        <button class="primary-btn" onclick="parseGameText()">ログを解析して追加</button>
    </div>

    <!-- 3. 柔軟手入力 -->
    <div class="card">
        <h2>✏️ 手動入力</h2>
        <div class="help-text">「50回」「1.81%」など、単位付きで入力しても自動修正されます。</div>
        <div class="form-row">
            <input type="text" id="workCount" placeholder="作業回数 (例: 50 または 50回)">
            <input type="text" id="workXp" placeholder="獲得XP / % (例: 1.81% や 150)">
        </div>
        <button class="secondary-btn" onclick="addManualRecord()" style="margin-top: 8px;">手動追加</button>
    </div>

    <!-- 4. 保存記録一覧 -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="margin: 0;">📜 保存された作業記録</h2>
            <div class="action-btn-group">
                <button class="merge-btn" onclick="mergeRecords()">同名を統合</button>
                <button class="clear-all-btn" onclick="clearAllRecords()">全削除</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>作業名</th>
                    <th>回数</th>
                    <th>獲得(XP / %)</th>
                    <th>1回平均</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordsTable">
                <tr>
                    <td colspan="5" style="text-align: center; color: #888;">保存された記録はありません</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
let records = JSON.parse(localStorage.getItem("xp_work_records") || "[]");
renderTable();

// 数字（整数・小数）だけを強力に抽出する関数
function extractNumber(val) {
    if (!val) return 0;
    const match = String(val).match(/\d+(?:\.\d+)?/);
    return match ? parseFloat(match[0]) : 0;
}

// ログ全体を柔軟にブロック・解析する処理
function parseGameText() {
    const rawText = document.getElementById("logInput").value;
    const defaultName = document.getElementById("commonWorkName").value.trim();

    if (!rawText.trim()) {
        alert("テキストを入力してください。");
        return;
    }

    let count = 0;
    let xp = 0;
    let name = defaultName;

    const lines = rawText.split("\n").map(l => l.trim()).filter(l => l);

    // 1. 作業回数の抽出 ("作業回数：50回" や "50回" など)
    for (let line of lines) {
        if (line.includes("作業回数") || line.includes("回")) {
            let num = extractNumber(line);
            if (num > 0) {
                count = num;
                break;
            }
        }
    }

    // 2. 経験値/% の抽出 ("+1.81%" や "150XP" など)
    for (let line of lines) {
        if (line.includes("%") || line.includes("XP") || line.includes("exp")) {
            let num = extractNumber(line);
            if (num > 0) {
                xp = num;
                break;
            }
        }
    }

    // 3. アイテム名・作業名の抽出 ("獲得したもの" の直後の行など)
    for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes("獲得したもの") && lines[i + 1]) {
            if (!lines[i + 1].includes("回") && !lines[i + 1].includes("%")) {
                name = lines[i + 1];
                break;
            }
        }
    }

    // 万が一「回数」がまだ取れていない場合のフォールバック（行内の数値を探す）
    if (count === 0) {
        for (let line of lines) {
            if (/^\d+回?$/.test(line)) {
                count = extractNumber(line);
                break;
            }
        }
    }

    if (count > 0) {
        records.push({
            id: Date.now() + Math.random(),
            name: name || "作業",
            count: count,
            xp: xp
        });
        saveAndRender();
        document.getElementById("logInput").value = "";
        alert(`解析成功: 【${name || "作業"}】 ${count}回 / 獲得: ${xp}`);
    } else {
        alert("作業回数を読み取れませんでした。手動入力でお試しください。");
    }
}

// 手動追加（文字列が入っても数字のみ抽出して受容）
function addManualRecord() {
    const defaultName = document.getElementById("commonWorkName").value.trim();
    const name = defaultName || "作業";
    
    const countRaw = document.getElementById("workCount").value;
    const xpRaw = document.getElementById("workXp").value;

    const count = extractNumber(countRaw);
    const xp = extractNumber(xpRaw);

    if (count <= 0) {
        alert("作業回数を正しく入力してください（例: 50 または 50回）。");
        return;
    }

    records.push({ id: Date.now(), name, count, xp });
    saveAndRender();

    document.getElementById("workCount").value = "";
    document.getElementById("workXp").value = "";
}

function deleteRecord(index) {
    records.splice(index, 1);
    saveAndRender();
}

function mergeRecords() {
    if (records.length === 0) return;

    const mergedMap = new Map();
    records.forEach(item => {
        if (mergedMap.has(item.name)) {
            const target = mergedMap.get(item.name);
            target.count += item.count;
            target.xp += item.xp;
        } else {
            mergedMap.set(item.name, { ...item });
        }
    });

    records = Array.from(mergedMap.values());
    saveAndRender();
    alert("同名の作業記録を統合しました！");
}

function clearAllRecords() {
    if (records.length === 0) return;
    if (confirm("すべての保存記録を削除しますか？")) {
        records = [];
        saveAndRender();
    }
}

function saveAndRender() {
    localStorage.setItem("xp_work_records", JSON.stringify(records));
    renderTable();
}

function renderTable() {
    const tbody = document.getElementById("recordsTable");
    if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">保存された記録はありません</td></tr>';
        return;
    }

    tbody.innerHTML = records.map((item, index) => {
        const avgXp = item.count > 0 ? (item.xp / item.count).toFixed(3) : 0;
        return `
            <tr>
                <td><strong>${item.name}</strong></td>
                <td>${item.count.toLocaleString()} 回</td>
                <td>${item.xp}</td>
                <td>${avgXp}</td>
                <td><button class="del-btn" onclick="deleteRecord(${index})">削除</button></td>
            </tr>
        `;
    }).join("");
}
</script>

</body>
</html>
