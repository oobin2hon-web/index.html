<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLDOUT2 作業結果取り込み</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;margin:0;color:#222}header{background:#222;color:white;padding:18px}main{max-width:700px;margin:auto;padding:14px}.card{background:white;padding:16px;border-radius:14px;margin-bottom:14px}h1{font-size:20px;margin:0 0 5px}h2{font-size:17px}textarea{width:100%;height:190px;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;font:inherit}button{padding:11px 15px;border:0;border-radius:9px;background:#222;color:white;font-weight:bold;margin:8px 5px 0 0}.sub{background:#eee;color:#222}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}.msg{font-size:13px}.ok{color:#176b2c}.err{color:#b00020}.small{font-size:12px;color:#666}</style></head><body><header><h1>作業結果取り込み</h1><div class="small" style="color:#ccc">まずは作業結果の取り込みだけに特化したシンプル版</div></header><main><section class="card"><h2>① 作業結果を貼り付け</h2><p class="small">SOLDOUT2からコピーした結果を、そのまま貼り付けてください。</p><textarea id="raw" placeholder="ここに作業結果を貼り付け"></textarea><br><button onclick="parse()">解析する</button><button class="sub" onclick="clearAll()">クリア</button><div id="msg" class="msg"></div></section><section id="resultCard" class="card" style="display:none"><h2>② 解析結果</h2><div id="result"></div><button onclick="copyOutputs()">成果物をコピー</button><button onclick="saveResult()">保存する</button></section><section class="card"><h2>保存した結果</h2><div id="saved" class="small">まだありません。</div></section></main><script>let data=null;const KEY='so2_work_import_simple_v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parse(){const raw=document.getElementById('raw').value.trim();if(!raw){msg('作業結果を貼り付けてください。','err');return}const lines=raw.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);data={raw,job:'',level:'',xpGain:'',count:'',outputs:[]};for(const l of lines){let m=l.match(/^LV\s*(\d+)/i);if(m)data.level=m[1];m=l.match(/(?:作業回数|回数)\s*[：:]?\s*(\d+)\s*回?/);if(m)data.count=m[1];m=l.match(/^\+?\s*([0-9]+(?:\.[0-9]+)?)\s*%/);if(m&&!data.xpGain)data.xpGain=m[1];m=l.match(/^(.+?)\s+([0-9][0-9,]*(?:\.[0-9]+)?)\s*(本|個|枚|組|kg|瓶|塊|束|袋)?$/);if(m&&!/^LV/i.test(l)&&!/^(作業回数|回数)/.test(l))data.outputs.push({name:m[1].trim(),qty:m[2].replace(/,/g,''),unit:m[3]||''})}if(lines[0]&&!/^LV\b/i.test(lines[0])&&!/^(作業回数|回数)/.test(lines[0]))data.job=lines[0];render();msg('解析しました。内容を確認してください。','ok')}function render(){let h='';[['作業名',data.job||'—'],['LV',data.level||'—'],['獲得経験値',data.xpGain?'+'+data.xpGain+'%':'—'],['作業回数',data.count?data.count+'回':'—']].forEach(x=>h+='<div class="row"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>');h+='<h3>成果物</h3>';h+=data.outputs.length?data.outputs.map(o=>'<div class="row"><span>'+esc(o.name)+'</span><b>'+esc(o.qty)+esc(o.unit)+'</b></div>').join(''):'<div class="small">自動判定できる成果物がありません。</div>';document.getElementById('result').innerHTML=h;document.getElementById('resultCard').style.display='block'}function copyOutputs(){if(!data)return;navigator.clipboard?.writeText(data.outputs.map(o=>o.name+' '+o.qty+o.unit).join('\n'));msg('成果物をコピーしました。','ok')}function saveResult(){if(!data)return;let a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift({...data,savedAt:new Date().toLocaleString('ja-JP')});localStorage.setItem(KEY,JSON.stringify(a.slice(0,100)));renderSaved();msg('保存しました。','ok')}function renderSaved(){let a=JSON.parse(localStorage.getItem(KEY)||'[]');document.getElementById('saved').innerHTML=a.length?a.map(x=>'<div class="card"><b>'+esc(x.savedAt)+'</b><br>'+esc(x.job||'作業結果')+' '+esc(x.count||'')+'回<br>'+x.outputs.map(o=>esc(o.name)+' '+esc(o.qty)+esc(o.unit)).join(' / ')+'</div>').join(''):'まだありません。'}function clearAll(){document.getElementById('raw').value='';data=null;document.getElementById('resultCard').style.display='none';msg('','')}function msg(t,c){document.getElementById('msg').innerHTML=t?'<span class="'+c+'">'+esc(t)+'</span>':''}renderSaved();</script></body></html>
