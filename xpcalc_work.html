<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業経験値計算 - SOLDOUT2</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 12px;
    background: #f5f5f5;
    color: #222;
}
.container { max-width: 700px; margin: auto; }
.header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.back-btn {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    background: #e0e0e0;
    color: #333;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}
h1 { font-size: 20px; margin: 0; text-align: center; flex-grow: 1; }
.card {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
h2 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #1976d2; }
.help-text { font-size: 11px; color: #666; margin-bottom: 8px; line-height: 1.4; }
textarea, input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
}
textarea { height: 100px; font-family: monospace; resize: vertical; }
.form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.form-row input { margin-bottom: 0; }
button {
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
}
.primary-btn { background: #1976d2; color: white; margin-bottom: 6px; }
.secondary-btn { background: #4caf50; color: white; }
.action-btn-group {
    display: flex;
    gap: 8px;
}
.merge-btn { background: #ff9800; color: white; font-size: 12px; padding: 6px 10px; width: auto; }
.clear-all-btn { background: #e53935; color: white; font-size: 12px; padding: 6px 10px; width: auto; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 13px;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}
th { background: #f0f0f0; }
.del-btn {
    background: #e53935;
    color: white;
    padding: 4px 8px;
    font-size: 11px;
    width: auto;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class="container">

    <div class="header-bar">
        <a href="index.html" class="back-btn">← 戻る</a>
        <h1>作業経験値計算</h1>
        <div style="width: 60px;"></div>
    </div>

    <!-- 1. ゲーム内テキスト貼り付け解析機能 -->
    <div class="card">
        <h2>📋 ゲーム内ログから自動解析</h2>
        <div class="help-text">
            作業ログや成果テキストをそのまま貼り付けて解析ボタンを押すと、作業名・回数・獲得経験値を自動抽出して保存します。
        </div>
        <textarea id="logInput" placeholder="ここに作業ログを貼り付けてください...
例：
[作業] 薬草調合 を 5回 実行し、150XP 獲得しました
薬草調合 (5回) +150XP"></textarea>
        <button class="primary-btn" onclick="parseGameText()">ログを解析して記録追加</button>
    </div>

    <!-- 2. 手動入力 -->
    <div class="card">
        <h2>✏️ 手動入力</h2>
        <input type="text" id="workName" placeholder="作業名・レシピ名 (例: 薬草調合)">
        <div class="form-row">
            <input type="number" id="workCount" placeholder="作業回数" min="1">
            <input type="number" id="workXp" placeholder="獲得経験値(XP)" min="0">
        </div>
        <button class="secondary-btn" onclick="addManualRecord()">記録を手動追加</button>
    </div>

    <!-- 3. 保存記録一覧 (統合・削除機能付き) -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="margin: 0;">📜 保存された作業記録</h2>
            <div class="action-btn-group">
                <button class="merge-btn" onclick="mergeRecords()">同名を統合</button>
                <button class="clear-all-btn" onclick="clearAllRecords()">全削除</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>作業名</th>
                    <th>回数</th>
                    <th>獲得XP</th>
                    <th>1回平均XP</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordsTable">
                <tr>
                    <td colspan="5" style="text-align: center; color: #888;">保存された記録はありません</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
let records = JSON.parse(localStorage.getItem("xp_work_records") || "[]");
renderTable();

// ゲーム内ログの自動解析・抽出
function parseGameText() {
    const text = document.getElementById("logInput").value;
    if (!text.trim()) {
        alert("テキストを入力してください。");
        return;
    }

    const lines = text.split("\n");
    let addedCount = 0;

    lines.forEach(line => {
        let cleanLine = line.replace(/\[.*?\]/g, '').trim();
        if (!cleanLine) return;

        // パターン1: 「作業名 を 5回 実行し、150XP 獲得」などの形式
        let m1 = cleanLine.match(/^(.+?)\s*(?:を|\s)\s*(\d+)回.*?(?:で|\s|し、)?\s*(\d+)(?:XP|exp)/i);
        // パターン2: 「作業名 (5回) +150XP」などの形式
        let m2 = cleanLine.match(/^(.+?)\s*\(\s*(\d+)回\s*\)\s*\+?(\d+)(?:XP|exp)/i);
        // パターン3: 「作業名 5回 150XP」などのシンプルな形式
        let m3 = cleanLine.match(/^(.+?)\s+(\d+)回\s+(\d+)(?:XP|exp)?$/i);

        let name = "", count = 0, xp = 0;

        if (m1) {
            name = m1[1].trim();
            count = parseInt(m1[2]);
            xp = parseInt(m1[3]);
        } else if (m2) {
            name = m2[1].trim();
            count = parseInt(m2[2]);
            xp = parseInt(m2[3]);
        } else if (m3) {
            name = m3[1].trim();
            count = parseInt(m3[2]);
            xp = parseInt(m3[3]);
        }

        if (name && count > 0) {
            records.push({ id: Date.now() + Math.random(), name, count, xp });
            addedCount++;
        }
    });

    if (addedCount > 0) {
        saveAndRender();
        document.getElementById("logInput").value = "";
        alert(`${addedCount} 件の作業記録を自動抽出しました！`);
    } else {
        alert("有効な作業ログが抽出できませんでした。手動入力をご利用ください。");
    }
}

// 手動追加
function addManualRecord() {
    const name = document.getElementById("workName").value.trim() || "未設定作業";
    const count = parseInt(document.getElementById("workCount").value) || 0;
    const xp = parseInt(document.getElementById("workXp").value) || 0;

    if (count <= 0) {
        alert("作業回数を入力してください。");
        return;
    }

    records.push({ id: Date.now(), name, count, xp });
    saveAndRender();

    document.getElementById("workName").value = "";
    document.getElementById("workCount").value = "";
    document.getElementById("workXp").value = "";
}

// 個別削除
function deleteRecord(index) {
    records.splice(index, 1);
    saveAndRender();
}

// 同名データの統合
function mergeRecords() {
    if (records.length === 0) return;

    const mergedMap = new Map();

    records.forEach(item => {
        if (mergedMap.has(item.name)) {
            const target = mergedMap.get(item.name);
            target.count += item.count;
            target.xp += item.xp;
        } else {
            mergedMap.set(item.name, { ...item });
        }
    });

    records = Array.from(mergedMap.values());
    saveAndRender();
    alert("同名の作業記録をまとめました！");
}

// 全削除
function clearAllRecords() {
    if (records.length === 0) return;
    if (confirm("すべての保存記録を削除しますか？")) {
        records = [];
        saveAndRender();
    }
}

function saveAndRender() {
    localStorage.setItem("xp_work_records", JSON.stringify(records));
    renderTable();
}

function renderTable() {
    const tbody = document.getElementById("recordsTable");
    if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">保存された記録はありません</td></tr>';
        return;
    }

    tbody.innerHTML = records.map((item, index) => {
        const avgXp = item.count > 0 ? (item.xp / item.count).toFixed(1) : 0;
        return `
            <tr>
                <td><strong>${item.name}</strong></td>
                <td>${item.count.toLocaleString()} 回</td>
                <td>${item.xp.toLocaleString()} XP</td>
                <td>${avgXp} XP</td>
                <td><button class="del-btn" onclick="deleteRecord(${index})">削除</button></td>
            </tr>
        `;
    }).join("");
}
</script>

</body>
</html>
