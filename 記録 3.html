<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競馬レース結果一覧表</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            border-bottom: 2px solid #004d40;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }
        .input-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        select, input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            background-color: #fff;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00796b;
        }
        button {
            background-color: #00796b;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #004d40;
        }
        
        .section-title {
            font-size: 18px;
            color: #004d40;
            margin-top: 25px;
            margin-bottom: 10px;
            border-left: 4px solid #00796b;
            padding-left: 8px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: #fff;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #f1f8f6;
            color: #004d40;
            font-weight: bold;
            width: 25%;
        }
        td.result-cell {
            font-weight: bold;
            color: #d32f2f;
            background-color: #fff;
        }
        td.empty-cell {
            color: #ccc;
        }
        .action-cell {
            width: 15%;
        }
        .delete-btn {
            background: #e0e0e0;
            border: none;
            color: #666;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #d32f2f;
            color: white;
        }
        .reset-container {
            text-align: right;
            margin-top: 20px;
        }
        .reset-btn {
            background: #9e9e9e;
            font-size: 12px;
            padding: 6px 12px;
            width: auto;
        }
        .reset-btn:hover {
            background: #616161;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>競馬レース結果一覧表 (1R〜12R)</h1>
        
        <!-- 入力フォーム -->
        <div class="input-group">
            <div class="input-row">
                <select id="raceCourse">
                    <option value="阪神">阪神競馬場</option>
                    <option value="中山">中山競馬場</option>
                </select>
                
                <select id="raceNumber">
                    <script>
                        for (let i = 1; i <= 12; i++) {
                            document.write(`<option value="${i}">${i}レース</option>`);
                        }
                    </script>
                </select>
            </div>
            
            <div class="input-row">
                <input type="text" id="raceResult" placeholder="例: 12-9-4" autocomplete="off">
            </div>
            
            <button onclick="addRecord()">記録を追加・更新する</button>
        </div>

        <!-- 阪神競馬場テーブル -->
        <div class="section-title">阪神競馬場</div>
        <div id="hanshinTableContainer"></div>

        <!-- 中山競馬場テーブル -->
        <div class="section-title">中山競馬場</div>
        <div id="nakayamaTableContainer"></div>

        <div class="reset-container">
            <button class="reset-btn" onclick="resetAllData()">すべての記録をリセット</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadRecords);

        // データの構造: { "阪神": { "1": "12-9-4", "2": "", ... }, "中山": { ... } }
        let allRecords = {
            "阪神": {},
            "中山": {}
        };

        function addRecord() {
            const course = document.getElementById("raceCourse").value;
            const number = document.getElementById("raceNumber").value;
            const resultInput = document.getElementById("raceResult");
            const result = resultInput.value.trim();

            if (!result) {
                alert("着順（例: 12-9-4）を入力してください。");
                return;
            }

            // データを格納
            allRecords[course][number] = result;
            
            // ローカルストレージに保存
            localStorage.setItem("keibaTableRecords", JSON.stringify(allRecords));

            // 入力欄クリアと再描画
            resultInput.value = "";
            renderTables();
        }

        function loadRecords() {
            const saved = localStorage.getItem("keibaTableRecords");
            if (saved) {
                allRecords = JSON.parse(saved);
            } else {
                // 初期サンプルとして阪神1Rにデータをセット
                allRecords["阪神"]["1"] = "12-9-4";
            }
            renderTables();
        }

        function renderTables() {
            renderSingleTable("Hanshin", "阪神");
            renderSingleTable("Nakayama", "中山");
        }

        function renderSingleTable(containerId, courseName) {
            const container = document.getElementById(containerId.toLowerCase() + "TableContainer");
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>レース</th>
                            <th>着順</th>
                            <th class="action-cell">操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (let i = 1; i <= 12; i++) {
                const res = allRecords[courseName][i];
                if (res) {
                    html += `
                        <tr>
                            <th>${i}レース</th>
                            <td class="result-cell">${escapeHTML(res)}</td>
                            <td class="action-cell"><button class="delete-btn" onclick="deleteRecord('${courseName}', ${i})">削除</button></td>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <th>${i}レース</th>
                            <td class="empty-cell">-</td>
                            <td class="action-cell">-</td>
                        </tr>
                    `;
                }
            }

            html += `
                    </tbody>
                </table>
            `;
            container.innerHTML = html;
        }

        function deleteRecord(courseName, raceNum) {
            delete allRecords[courseName][raceNum];
            localStorage.setItem("keibaTableRecords", JSON.stringify(allRecords));
            renderTables();
        }

        function resetAllData() {
            if (confirm("すべての記録をリセットしますか？")) {
                allRecords = { "阪神": {}, "中山": {} };
                localStorage.removeItem("keibaTableRecords");
                renderTables();
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&'`"<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '"': '&quot;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }
    </script>

</body>
</html>
