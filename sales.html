<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>マイ・ローカルデータベース＆Hub</title>
    <!-- 👇 ここに結合されたデータが埋め込まれます -->
    <script id="embedded-data" type="application/json">{}</script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f6f8; color: #333; box-sizing: border-box; }
        h1 { font-size: 1.3rem; margin-bottom: 10px; color: #2c3e50; }
        .card { background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 12px; }
        select, input, button { padding: 8px 10px; font-size: 0.9rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #2980b9; }
        
        .main-layout { display: flex; gap: 12px; align-items: flex-start; }
        @media (max-width: 768px) { .main-layout { flex-direction: column; } }
        .tab-buttons { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
        .tab-btn { background: #e0e0e0; color: #555; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; text-align: left; }
        .tab-btn.active { background: #2c3e50; color: #fff; font-weight: bold; }
        .tab-content-area { flex-grow: 1; width: 100%; background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        textarea { width: 100%; height: 100px; padding: 10px; font-family: monospace; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 8px; }
        
        .template-card { background: #fff; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-bottom: 10px; text-align: left; }
        .template-card h4 { margin: 0 0 6px 0; font-size: 0.95rem; color: #2c3e50; }
        .template-pre { background: #f8fafc; padding: 8px; border-radius: 4px; border: 1px solid #e2e8f0; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; margin-bottom: 8px; }
        .generator-panel { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; margin-bottom: 12px; text-align: left; }
        .generator-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 8px; }
        .generator-grid input, .generator-grid select { width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>🗂️ マイ・ローカルデータベース＆Hub</h1>

    <div class="card" style="background: #eef2f7; border: 1px solid #cbd5e1; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 0.9rem; font-weight: bold; color: #2c3e50;">👤 ユーザー:</span>
            <input type="text" id="usernameInput" placeholder="ユーザー名" style="padding: 5px 8px; font-size: 0.85rem;" onchange="saveCurrentUser()">
        </div>
        <button onclick="exportIntegratedHTML()" style="background: #e67e22; font-size: 0.85rem;">📦 結合したHTMLを出力する</button>
    </div>

    <div class="main-layout">
        <div class="tab-buttons" id="tabButtonContainer">
            <button class="tab-btn active" onclick="switchTab('templateTab', this)">📋 定型文・品名登録</button>
            <button class="tab-btn" onclick="switchTab('adminTab', this)" style="background: #27ae60; color: #fff;">⚙️ HTML & JSON 結合管理</button>
        </div>

        <div class="tab-content-area">
            <!-- タブ: 定型文・品名登録 -->
            <div id="templateTab" class="tab-content active">
                <div class="generator-panel">
                    <div class="generator-grid">
                        <div>
                            <label style="font-size: 0.75rem; font-weight: bold;">カテゴリ・品名選択:</label>
                            <select id="categorySelect" onchange="onCategoryChange()" style="margin-bottom: 4px;">
                                <option value="">-- カテゴリを選択 --</option>
                            </select>
                            <input type="text" id="genItemName" value="コッペパン" placeholder="品名">
                        </div>
                        <div>
                            <label style="font-size: 0.75rem; font-weight: bold;">価格:</label>
                            <input type="text" id="genPrice" value="200">
                        </div>
                        <div>
                            <label style="font-size: 0.75rem; font-weight: bold;">数量:</label>
                            <input type="text" id="genQuantity" value="3口無言可">
                        </div>
                    </div>
                </div>
                <div id="templateListArea"></div>
            </div>

            <!-- タブ: 結合管理画面 -->
            <div id="adminTab" class="tab-content">
                <h3 style="margin-top: 0; font-size: 1.1rem; color: #2c3e50;">⚙️ HTMLとJSONの取り込み・結合</h3>
                <div class="generator-panel" style="background: #fff; border-color: #cbd5e1; margin-top: 15px;">
                    <h4 style="margin: 0 0 6px 0; font-size: 0.9rem;">1. ベースHTMLファイルの取り込み</h4>
                    <input type="file" id="htmlImportFile" accept=".html" style="width: 100%; margin-bottom: 8px;">

                    <h4 style="margin: 10px 0 6px 0; font-size: 0.9rem;">2. 品名マスターJSONファイルの取り込み</h4>
                    <input type="file" id="jsonImportFile" accept=".json" style="width: 100%; margin-bottom: 8px;">

                    <button onclick="processIntegration()" style="background: #d35400; width: 100%; margin-top: 6px;">🔗 取り込んでデータを結合する</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getCurrentUser() {
            let user = localStorage.getItem('hub_current_user');
            if (!user) { user = 'default_user'; localStorage.setItem('hub_current_user', user); }
            return user;
        }

        function saveCurrentUser() {
            localStorage.setItem('hub_current_user', document.getElementById('usernameInput').value.trim() || 'default_user');
            updateTemplates();
        }

        const defaultTemplates = [
            { id: 1, category: "パン・食品", label: "求・出形式", text: "{name}）求　{name}）出" },
            { id: 2, category: "パン・食品", label: "トレード用", text: "<トレード>\n求) {name} （{qty}）\n出) {name} @1:{price}\n無言可です。" }
        ];

        function getStoredData() {
            const user = getCurrentUser();
            const stored = localStorage.getItem('hub_master_data_' + user);
            try { return stored ? JSON.parse(stored) : { templates: defaultTemplates }; } catch(e) { return { templates: defaultTemplates }; }
        }

        function saveStoredData(data) {
            localStorage.setItem('hub_master_data_' + getCurrentUser(), JSON.stringify(data));
        }

        // HTMLファイルとJSONファイルを同時に取り込んで結合する処理
        function processIntegration() {
            const htmlFile = document.getElementById('htmlImportFile').files[0];
            const jsonFile = document.getElementById('jsonImportFile').files[0];

            if (!jsonFile) return alert('品名マスターのJSONファイルを選択してください。');

            const readerJson = new FileReader();
            readerJson.onload = function(eJSON) {
                try {
                    const parsedJson = JSON.parse(eJSON.target.result);
                    let currentData = getStoredData();
                    
                    // JSONが配列またはオブジェクトの場合の調整
                    if (Array.isArray(parsedJson)) {
                        currentData.templates = parsedJson;
                    } else if (parsedJson.templates) {
                        currentData = parsedJson;
                    }
                    saveStoredData(currentData);

                    // もしHTMLファイルも選択されていれば、その中身をベースにする処理
                    if (htmlFile) {
                        const readerHtml = new FileReader();
                        readerHtml.onload = function(eHtml) {
                            // 簡易的にHTMLを取り込んだ場合の処理（今回はブラウザ上のデータを更新）
                            updateTemplates();
                            updateCategoryDropdown(currentData.templates);
                            alert('HTMLとJSONの結合・取り込みが完了しました！');
                        };
                        readerHtml.readAsText(htmlFile, 'utf-8');
                    } else {
                        updateTemplates();
                        updateCategoryDropdown(currentData.templates);
                        alert('JSONデータの取り込みとカテゴリ連動が完了しました！');
                    }
                } catch(err) {
                    alert('JSONファイルの解析に失敗しました。');
                }
            };
            readerJson.readAsText(jsonFile, 'utf-8');
        }

        // カテゴリと連動したセレクトボックスの構築
        function updateCategoryDropdown(templates) {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">-- カテゴリ・品名を選択 --</option>';
            
            templates.forEach(t => {
                const opt = document.createElement('option');
                const catName = t.category ? `[${t.category}] ` : '';
                opt.value = t.label || t.name || '品名';
                opt.textContent = catName + (t.label || t.name || '品名');
                select.appendChild(opt);
            });
        }

        function onCategoryChange() {
            const select = document.getElementById('categorySelect');
            if (select.value) {
                document.getElementById('genItemName').value = select.value;
                updateTemplates();
            }
        }

        function exportIntegratedHTML() {
            const data = getStoredData();
            const clone = document.documentElement.cloneNode(true);
            let dataScript = clone.querySelector('#embedded-data');
            if (!dataScript) {
                dataScript = document.createElement('script');
                dataScript.id = 'embedded-data';
                dataScript.type = 'application/json';
                clone.querySelector('head').appendChild(dataScript);
            }
            dataScript.textContent = JSON.stringify(data);

            const htmlContent = "<!DOCTYPE html>\n<html lang=\"ja\">\n" + clone.innerHTML + "\n</html>";
            const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "memo.html";
            a.click();
            URL.revokeObjectURL(url);
        }

        function getGeneratedTemplates() {
            const name = document.getElementById('genItemName').value.trim() || '品名';
            const price = document.getElementById('genPrice').value.trim() || '価格';
            const qty = document.getElementById('genQuantity').value.trim() || '数量';
            const data = getStoredData();
            return (data.templates || []).map(tpl => ({
                id: tpl.id || Date.now(),
                label: tpl.label || 'テンプレート',
                text: (tpl.text || '').replace(/\{name\}/g, name).replace(/\{price\}/g, price).replace(/\{qty\}/g, qty)
            }));
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (btnElement) btnElement.classList.add('active');
        }

        function updateTemplates() {
            const area = document.getElementById('templateListArea');
            area.innerHTML = '';
            getGeneratedTemplates().forEach(tpl => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.innerHTML = `
                    <div style="font-weight: bold; font-size: 0.95rem; color: #2c3e50; margin-bottom: 6px;">📝 ${escapeHtml(tpl.label)}</div>
                    <div class="template-pre">${escapeHtml(tpl.text)}</div>
                    <button onclick="copyToClipboard('${escapeJS(tpl.text)}')" style="width: 100%; font-size: 0.8rem;">📋 コピー</button>
                `;
                area.appendChild(card);
            });
        }

        ['genItemName', 'genPrice', 'genQuantity'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateTemplates);
        });

        function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => alert('コピーしました！')); }
        function escapeHtml(str) { return str ? str.replace(/[&'`<>]/g, m => ({ '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;' }[m])) : ''; }
        function escapeJS(str) { return str ? str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n') : ''; }

        window.onload = function() {
            const dataScript = document.getElementById('embedded-data');
            if (dataScript && dataScript.textContent && dataScript.textContent !== '{}') {
                try {
                    const embedded = JSON.parse(dataScript.textContent);
                    if (embedded.templates) saveStoredData(embedded);
                } catch(e) {}
            }
            document.getElementById('usernameInput').value = getCurrentUser();
            const data = getStoredData();
            updateTemplates();
            updateCategoryDropdown(data.templates);
        };
    </script>
</body>
</html>
