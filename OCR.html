<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HTML出力 & OCR読み込みツール</title>
    <!-- OCR用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; font-size: 18px; margin-top: 20px; }
        .file-name-input { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; font-weight: bold; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fffdf0; }
        textarea { width: 100%; height: 220px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .toolbar { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #ddd; }
        button, select { padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.save { background: #28a745; color: white; border: none; }
        button.test { background: #17a2b8; color: white; border: none; }
        button.clear-btn { background: #e74c3c; color: white; border: none; }
        .wiki-ocr-box { background: #fdf8f4; border: 1px solid #e67e22; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .master-item-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        .master-item-row:hover { background: #f9f9f9; }
        .delete-item-btn { background: #e74c3c; color: white; border: none; padding: 2px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ HTML出力・コード編集スペース</h2>
    <label style="font-size:12px; font-weight:bold; color:#666;">ファイル名:</label>
    <input type="text" id="active_filename" class="file-name-input" value="index.html">
    
    <textarea id="active_textarea" placeholder="ここにHTMLコードやテキストを入力..."></textarea>
    <div class="toolbar">
        <button type="button" class="save" onclick="saveActiveData()">💾 保存・ダウンロード</button>
        <button type="button" class="test" onclick="runActiveTest()">▶️ プレビュー表示</button>
        <button type="button" class="clear-btn" onclick="clearActiveCode()">🗑️ 消去</button>
        <a id="active_download" style="font-size:13px; color:#007bff; text-decoration:none; font-weight:bold; margin-left:auto;" download="">⬇️ ファイルをダウンロード</a>
    </div>

    <h2>🤖 スクショ画像からOCR自動抽出（図鑑データ管理）</h2>
    <div class="wiki-ocr-box">
        <div style="margin-bottom: 8px;">
            <label style="font-size:12px; font-weight:bold;">カテゴリ選択:</label>
            <select id="ocrCategorySelect" style="padding:4px; font-size:12px;">
                <option value="原料">原料</option>
                <option value="本">本</option>
                <option value="薬">薬</option>
                <option value="剣">剣</option>
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <input type="file" id="ocrImageInput" accept="image/*" multiple style="font-size:12px;">
        </div>
        <button type="button" onclick="runOcrExtraction()" style="background:#e67e22; color:#fff; border:none; padding:6px 12px; font-size:13px; font-weight:bold; cursor:pointer; border-radius:4px;">🔍 画像を解析してリストに追加</button>
        <span id="ocrStatus" style="font-size:12px; font-weight:bold; margin-left:8px; color:#d35400;"></span>
    </div>
    
    <div style="background:#fff; border:1px solid #ccc; padding:15px; border-radius:6px;">
        <h3 style="margin:0 0 8px 0; font-size:14px;">📋 登録品名一覧</h3>
        <div id="masterItemList" style="max-height: 150px; overflow-y: auto; background: #f9f9f9; border: 1px solid #ddd; padding: 6px; font-size: 13px; margin-bottom: 10px;"></div>
        <button type="button" onclick="exportMasterJson()" style="background:#27ae60; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; font-size:13px;">📦 JSONダウンロード</button>
    </div>
</div>

<script>
    // --- HTML出力・エディター関連の処理 ---
    function saveActiveData() {
        const filename = document.getElementById('active_filename').value.trim() || 'index.html';
        const currentText = document.getElementById('active_textarea').value;
        const dlEl = document.getElementById('active_download');
        
        const blob = new Blob([currentText], { type: 'text/html' });
        dlEl.href = URL.createObjectURL(blob);
        dlEl.download = filename;
        alert(`「${filename}」のダウンロード準備ができました！`);
    }

    function runActiveTest() {
        const text = document.getElementById('active_textarea').value;
        if (!text.trim()) { alert('コードがありません。'); return; }
        window.open(URL.createObjectURL(new Blob([text], { type: 'text/html' })), '_blank');
    }

    function clearActiveCode() {
        if (confirm('すべて消去しますか？')) {
            document.getElementById('active_textarea').value = '';
        }
    }

    // --- OCR・図鑑データ管理関連の処理 ---
    function getStoredMasterItems() {
        const savedJson = localStorage.getItem('hub_item_master_user');
        return savedJson ? JSON.parse(savedJson) : [];
    }

    function saveStoredMasterItems(items) {
        localStorage.setItem('hub_item_master_user', JSON.stringify(items, null, 2));
        loadAndDisplayMasterItems();
    }

    async function runOcrExtraction() {
        const fileInput = document.getElementById('ocrImageInput');
        const statusLabel = document.getElementById('ocrStatus');
        const catSelect = document.getElementById('ocrCategorySelect');
        
        if (!fileInput.files.length) { 
            alert('解析する画像を選択してください。'); 
            return; 
        }
        
        statusLabel.textContent = '画像解析中...';
        let items = getStoredMasterItems();
        let count = 0;
        
        try {
            for (let file of fileInput.files) {
                const res = await Tesseract.recognize(file, 'jpn+eng');
                res.data.text.split(/[\r\n]+/).forEach(line => {
                    const trimmed = line.replace(/[\s　]+/g, '').trim();
                    if (trimmed.length >= 2 && trimmed.length <= 15 && !items.some(i => i.name === trimmed)) {
                        items.push({ name: trimmed, category: catSelect.value });
                        count++;
                    }
                });
            }
            saveStoredMasterItems(items);
            statusLabel.textContent = `✨ ${count}件追加しました！`;
            fileInput.value = '';
        } catch(e) {
            statusLabel.textContent = '❌ 解析エラー';
        }
    }

    function loadAndDisplayMasterItems() {
        const listContainer = document.getElementById('masterItemList');
        if (!listContainer) return;

        let items = getStoredMasterItems();
        if (!items.length) {
            listContainer.innerHTML = '<div style="color:#888; text-align:center; padding:10px;">データはまだありません</div>';
            return;
        }

        let html = '';
        items.forEach((item, index) => {
            html += `
                <div class="master-item-row">
                    <span><b>[${item.category}]</b> ${item.name}</span>
                    <button type="button" class="delete-item-btn" onclick="deleteOneItem(${index})">❌ 削除</button>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }

    function deleteOneItem(idx) {
        let items = getStoredMasterItems();
        if (idx > -1) {
            items.splice(idx, 1);
            saveStoredMasterItems(items);
        }
    }

    function exportMasterJson() {
        const items = getStoredMasterItems();
        if (!items.length) {
            alert('ダウンロードするデータがありません。');
            return;
        }
        const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'item_master.json';
        a.click();
    }

    // 初期化時にリストを表示
    window.addEventListener('DOMContentLoaded', () => {
        loadAndDisplayMasterItems();
    });
</script>

</body>
</html>
