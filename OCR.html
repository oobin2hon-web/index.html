<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HTML出力 & OCR読み込み・図鑑管理ツール（完全検証版）</title>
    <!-- OCR用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; font-size: 18px; margin-top: 20px; }
        .file-select-box { display: flex; gap: 8px; margin-bottom: 10px; }
        .file-name-input { flex-grow: 1; padding: 8px; box-sizing: border-box; font-size: 14px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px; background: #fffdf0; }
        textarea { width: 100%; height: 220px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; }
        .toolbar { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #f9f9f9; padding: 10px; border-radius: 4px; border: 1px solid #ddd; }
        button, select { padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.save { background: #28a745; color: white; border: none; }
        button.test { background: #17a2b8; color: white; border: none; }
        button.clear-btn { background: #e74c3c; color: white; border: none; }
        .wiki-ocr-box { background: #fdf8f4; border: 1px solid #e67e22; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .master-item-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 13px; background: #fff; }
        .master-item-row:hover { background: #f9f9f9; }
        .action-btn { background: #007bff; color: white; border: none; padding: 3px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
        .update-btn { background: #ffc107; color: #333; border: none; padding: 3px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
        .delete-item-btn { background: #e74c3c; color: white; border: none; padding: 3px 8px; font-size: 11px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ HTML出力・コード編集スペース</h2>
    <label style="font-size:12px; font-weight:bold; color:#666;">ファイル名（プルダウン選択 または 直接微調整）:</label>
    <div class="file-select-box">
        <select id="file_select_dropdown" style="font-size: 13px; padding: 6px; background: #eef2f7;">
            <option value="">-- ファイルを選ぶ --</option>
        </select>
        <input type="text" id="active_filename" class="file-name-input" value="index.html">
    </div>
    
    <textarea id="active_textarea" placeholder="ここにHTMLコードやテキストを入力... (OCRの「💻 コードに追加」ボタンでここに挿入されます)"></textarea>
    
    <div class="toolbar">
        <button type="button" class="save" onclick="saveActiveData()">💾 ファイルを保存・ダウンロード</button>
        <button type="button" class="test" onclick="runActiveTest()">▶️ プレビュー表示</button>
        <button type="button" class="clear-btn" onclick="clearActiveCode()">🗑️ 消去</button>
    </div>

    <!-- ダウンロード救済用の常設リンク表示エリア（出力がブロックされる環境対策） -->
    <div id="download_link_container" style="margin-top: 10px; padding: 10px; background: #e8f8f5; border: 1px solid #27ae60; border-radius: 4px; display: none;">
        <span style="font-size: 13px; font-weight: bold; color: #27ae60;">✅ 保存の準備ができました：</span>
        <a id="active_download_link" href="#" style="font-size: 13px; font-weight: bold; color: #007bff; text-decoration: underline;" download="">ここをクリックしてファイルを保存</a>
    </div>

    <h2>🤖 スクショ画像からOCR自動抽出（図鑑データ管理）</h2>
    <div class="wiki-ocr-box">
        <div style="margin-bottom: 8px;">
            <label style="font-size:12px; font-weight:bold;">デフォルトカテゴリ（判定できない場合）:</label>
            <select id="ocrCategorySelect" style="padding:4px; font-size:12px;">
                <option value="原料">原料</option>
                <option value="本">本</option>
                <option value="薬">薬</option>
                <option value="剣">剣</option>
                <option value="鎧">鎧</option>
                <option value="盾">盾</option>
                <option value="杖">杖</option>
                <option value="アクセサリ">アクセサリ</option>
            </select>
        </div>
        <div style="margin-bottom: 8px;">
            <input type="file" id="ocrImageInput" accept="image/*" multiple style="font-size:12px;">
        </div>
        <button type="button" onclick="runOcrExtraction()" style="background:#e67e22; color:#fff; border:none; padding:6px 12px; font-size:13px; font-weight:bold; cursor:pointer; border-radius:4px;">🔍 画像を解析してリストに追加</button>
        <span id="ocrStatus" style="font-size:12px; font-weight:bold; margin-left:8px; color:#d35400;"></span>
    </div>
    
    <div style="background:#fff; border:1px solid #ccc; padding:15px; border-radius:6px;">
        <h3 style="margin:0 0 8px 0; font-size:14px;">📋 登録品名一覧（修正・ワンタッチ追加可能）</h3>
        <div id="masterItemList" style="max-height: 220px; overflow-y: auto; background: #f9f9f9; border: 1px solid #ddd; padding: 6px; font-size: 13px; margin-bottom: 10px;"></div>
        <button type="button" onclick="exportMasterJson()" style="background:#27ae60; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; font-size:13px;">📦 JSONダウンロード</button>
    </div>
</div>

<script>
    // 元のファイル一覧（プルダウン用）
    const defaultFileNames = [
        "HTMLファイル.html",
        "PRO.html",
        "README.md",
        "index.html",
        "item_master.json",
        "level.html",
        "materials.html",
        "memo.html",
        "sales.html",
        "soldout2_parser.html",
        "trade.html",
        "work_tool.html",
        "xpcalc.html",
        "xpcalc_detail.html",
        "xpcalc_work.html",
        "画録再生.html"
    ];

    function initFileSelect() {
        const selectEl = document.getElementById('file_select_dropdown');
        if (!selectEl) return;
        defaultFileNames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            selectEl.appendChild(opt);
        });
        
        selectEl.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val) {
                document.getElementById('active_filename').value = val;
            }
        });
    }

    // --- ファイル出力（保存・ダウンロード）の確実な実行処理 ---
    function saveActiveData() {
        const filenameInput = document.getElementById('active_filename').value.trim();
        const filename = filenameInput || 'index.html';
        const currentText = document.getElementById('active_textarea').value;
        
        let mimeType = 'text/plain;charset=utf-8';
        if (filename.endsWith('.html')) {
            mimeType = 'text/html;charset=utf-8';
        } else if (filename.endsWith('.json')) {
            mimeType = 'application/json;charset=utf-8';
        } else if (filename.endsWith('.md')) {
            mimeType = 'text/markdown;charset=utf-8';
        }

        try {
            // データURIスキームを用いた確実なダウンロード方式
            const base64Data = btoa(unescape(encodeURIComponent(currentText)));
            const dataUri = `data:${mimeType};base64,${base64Data}`;

            const a = document.createElement('a');
            a.href = dataUri;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            // 救済用の直リンクも常時更新して表示
            const container = document.getElementById('download_link_container');
            const link = document.getElementById('active_download_link');
            link.href = dataUri;
            link.download = filename;
            link.textContent = `💾 ${filename} をダウンロードする（直リンク）`;
            container.style.display = 'block';

            alert(`「${filename}」の保存・ダウンロード処理を実行しました。`);
        } catch (err) {
            alert('ダウンロードに失敗しました: ' + err.message);
        }
    }

    function runActiveTest() {
        const text = document.getElementById('active_textarea').value;
        if (!text.trim()) { alert('コードがありません。'); return; }
        const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
        window.open(URL.createObjectURL(blob), '_blank');
    }

    function clearActiveCode() {
        if (confirm('すべて消去しますか？')) {
            document.getElementById('active_textarea').value = '';
        }
    }

    // --- OCR・図鑑データ管理関連の処理 ---
    function getStoredMasterItems() {
        const savedJson = localStorage.getItem('hub_item_master_user');
        return savedJson ? JSON.parse(savedJson) : [];
    }

    function saveStoredMasterItems(items) {
        localStorage.setItem('hub_item_master_user', JSON.stringify(items, null, 2));
        loadAndDisplayMasterItems();
    }

    // キーワードから自動でカテゴリを推測するヘルパー
    function guessCategory(name, fallback) {
        if (/ポーション|エーテル|エリ草|薬/.test(name)) return '薬';
        if (/入門|のすべて|指南書|設計図|本|グリモワール/.test(name)) return '本';
        if (/ソード|ブレイド|剣|鎌|ランス|短剣|杖|刀/.test(name)) return '剣';
        if (/インゴット|鉱石|原石|木|草|枝|皮|骨|羽|石|オイル|水|肥料/.test(name)) return '原料';
        return fallback;
    }

    async function runOcrExtraction() {
        const fileInput = document.getElementById('ocrImageInput');
        const statusLabel = document.getElementById('ocrStatus');
        const catSelect = document.getElementById('ocrCategorySelect');
        
        if (!fileInput.files.length) { 
            alert('解析する画像を選択してください。'); 
            return; 
        }
        
        statusLabel.textContent = '画像解析中...';
        let items = getStoredMasterItems();
        let count = 0;
        
        try {
            for (let file of fileInput.files) {
                const res = await Tesseract.recognize(file, 'jpn+eng');
                res.data.text.split(/[\r\n]+/).forEach(line => {
                    const trimmed = line.replace(/[\s　]+/g, '').trim();
                    if (trimmed.length >= 2 && trimmed.length <= 15 && !items.some(i => i.name === trimmed)) {
                        const autoCat = guessCategory(trimmed, catSelect.value);
                        items.push({ name: trimmed, category: autoCat });
                        count++;
                    }
                });
            }
            saveStoredMasterItems(items);
            statusLabel.textContent = `✨ ${count}件追加しました！`;
            fileInput.value = '';
        } catch(e) {
            statusLabel.textContent = '❌ 解析エラー';
        }
    }

    function loadAndDisplayMasterItems() {
        const listContainer = document.getElementById('masterItemList');
        if (!listContainer) return;

        let items = getStoredMasterItems();
        if (!items.length) {
            listContainer.innerHTML = '<div style="color:#888; text-align:center; padding:10px;">データはまだありません</div>';
            return;
        }

        const categories = ["原料", "本", "薬", "剣", "鎧", "盾", "杖", "アクセサリ"];
        let html = '';
        
        items.forEach((item, index) => {
            let catOptions = categories.map(c => `<option value="${c}" ${c === item.category ? 'selected' : ''}>${c}</option>`).join('');
            html += `
                <div class="master-item-row">
                    <select id="cat_${index}" style="padding:2px; font-size:12px;">${catOptions}</select>
                    <input type="text" id="name_${index}" value="${item.name}" style="flex-grow:1; padding:3px; font-size:12px;">
                    <button type="button" class="action-btn" onclick="appendItemToEditor(${index})">💻 コードに追加</button>
                    <button type="button" class="update-btn" onclick="updateItem(${index})">💾 更新</button>
                    <button type="button" class="delete-item-btn" onclick="deleteOneItem(${index})">❌ 削除</button>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }

    // 1行のデータを更新する
    function updateItem(idx) {
        let items = getStoredMasterItems();
        const newName = document.getElementById(`name_${idx}`).value.trim();
        const newCat = document.getElementById(`cat_${idx}`).value;
        if (!newName) { alert('品名を入力してください'); return; }
        
        items[idx] = { name: newName, category: newCat };
        saveStoredMasterItems(items);
        alert('更新しました！');
    }

    // 選択した品名をエディター（コード欄）にワンタッチ追加
    function appendItemToEditor(idx) {
        let items = getStoredMasterItems();
        const item = items[idx];
        const textarea = document.getElementById('active_textarea');
        
        const snippet = `{"name": "${item.name}", "category": "${item.category}"},\n`;
        textarea.value += snippet;
    }

    function deleteOneItem(idx) {
        let items = getStoredMasterItems();
        if (idx > -1) {
            items.splice(idx, 1);
            saveStoredMasterItems(items);
        }
    }

    function exportMasterJson() {
        const items = getStoredMasterItems();
        if (!items.length) {
            alert('ダウンロードするデータがありません。');
            return;
        }
        const jsonStr = JSON.stringify(items, null, 2);
        const base64Data = btoa(unescape(encodeURIComponent(jsonStr)));
        const dataUri = `data:application/json;charset=utf-8;base64,${base64Data}`;

        const a = document.createElement('a');
        a.href = dataUri;
        a.download = 'item_master.json';
        a.click();
    }

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
        initFileSelect();
        loadAndDisplayMasterItems();
    });
</script>

</body>
</html>
