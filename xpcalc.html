<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xpcalc</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px}
h1{text-align:center;font-size:22px;margin:8px 0 12px}
.card{background:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0001}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;position:sticky;top:0;background:#f4f4f7;padding:4px 0;z-index:5}
.tabs button{margin:0;padding:10px 4px;background:#ddd;color:#222}
.tabs button.active{background:#333;color:#fff}
.section{display:none}.section.active{display:block}
label{display:block;font-weight:700;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:16px;background:#fff}
textarea{min-height:150px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;border:0;border-radius:10px;padding:12px;margin-top:12px;font-size:16px;font-weight:700;background:#333;color:#fff}
button.sub{background:#eee;color:#222}
button.del{background:#b3261e;color:#fff;padding:7px;margin:0;font-size:13px}
button.edit{background:#eee;color:#222;padding:7px;margin:0;font-size:13px}
.result{line-height:1.8;margin-top:12px}.big{text-align:center;font-size:25px;font-weight:800;margin:8px 0 14px}
.note{font-size:13px;color:#666;line-height:1.5}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th,td{border-bottom:1px solid #eee;padding:8px;text-align:left;vertical-align:top}
.memo{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;background:#fafafa}
.memo.expired{opacity:.6}
.memohead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.memoTitle{font-weight:800;font-size:17px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8e8e8;font-size:12px;margin:3px 3px 3px 0}
.badge.want{background:#fff0f0}.badge.offer{background:#f0f7ff}.badge.deadline{background:#fff8df}
.memoText{white-space:pre-wrap;line-height:1.6;margin:10px 0}
.actions{display:flex;gap:6px}.actions button{width:auto}
.search{margin-bottom:8px}
.smallgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}.smallgrid{grid-template-columns:1fr}}

.book{border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0;background:#fafafa}.bookTitle{font-size:18px;font-weight:800;margin-bottom:7px}.bookGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.bookImg{width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:#eee;margin:8px 0}.bookRow{margin:5px 0;white-space:pre-wrap}.bookLabel{font-weight:700}.bookActions{display:flex;gap:6px;margin-top:10px}.bookActions button{flex:1}.badge.bookcat{background:#eee}
</style>
</head>
<body>
<div class="wrap">
<h1>経験値・成果量・備忘録</h1>

<div class="tabs">
<button id="tabxp" class="active" onclick="show('xp')">経験値</button>
<button id="tabout" onclick="show('out')">成果量</button>
<button id="tablog" onclick="show('log')">記録</button>
<button id="tabmemo" onclick="show('memo')">備忘録</button>
<button id="tabbook" onclick="show('book')">図鑑</button>
</div>

<div id="xp" class="section active">
<div class="card">
<h2>経験値計算</h2>
<div class="note">販売・作業それぞれの実測値から、1回あたりの経験値と必要回数を計算します。</div>
<label>現在Lv</label><input id="level" type="number" min="1" value="8">
<label>現在の経験値（%）</label><input id="current" type="number" min="0" max="99.999999" step="0.001" value="99.92">
<label>1回で増える経験値（%）</label><input id="gain" type="number" min="0" step="0.000001" value="0.01">
<label>取得回数</label><input id="count" type="number" min="0" value="100">
<button onclick="calcXP()">計算する</button>
<div id="xpResult" class="result"></div>
</div>
<div class="card">
<h2>販売記録を保存</h2>
<label>職種・職業</label><input id="sjob" placeholder="例：道具屋">
<label>販売物</label><input id="sitem" placeholder="例：ポーション">
<div class="grid2"><div><label>街名</label><input id="scity" placeholder="例：王都"></div><div><label>Lv</label><input id="slv" type="number" min="1"></div></div>
<div class="grid2"><div><label>販売価格（G/個）</label><input id="sprice" type="number" min="0" step="any"></div><div><label>販売数</label><input id="scount" type="number" min="1" step="any"></div></div>
<label>増加経験値（%）</label><input id="sgain" type="number" min="0" step="0.000001">
<button onclick="addSale()">販売記録を保存</button><button class="sub" onclick="pickRecord('s')">保存済みの販売記録から入力</button>
</div>
<div class="card">
<h2>販売ペース・完売予測</h2>
<div class="note">一定の販売ペースが続く場合の完売時間を計算します。</div>
<div class="grid2"><div><label>現在の在庫数（個）</label><input id="stock" type="number" min="0" step="any"></div><div><label>売れた数（個）</label><input id="sold" type="number" min="0" step="any"></div></div>
<label>経過時間（時間）</label><input id="hours" type="number" min="0" step="0.01">
<button onclick="calcSellRate()">完売時間を計算</button><div id="sellRateResult" class="result"></div>
</div>
<div class="card">
<h2>作業記録を保存</h2>
<label>職種・職業</label><input id="wjob" placeholder="例：木こり">
<label>作業名</label><input id="wname" placeholder="例：林道を探索">
<div class="grid2"><div><label>街名</label><input id="wcity" placeholder="例：王都"></div><div><label>Lv</label><input id="wlv" type="number" min="1"></div></div>
<div class="grid2"><div><label>座標X</label><input id="wx" type="number" step="any"></div><div><label>座標Y</label><input id="wy" type="number" step="any"></div></div>
<div class="grid2"><div><label>作業回数</label><input id="wcount" type="number" min="1"></div><div><label>増加経験値（%）</label><input id="wgain" type="number" min="0" step="0.000001"></div></div>
<button onclick="addWork()">作業記録を保存</button><button class="sub" onclick="pickRecord('w')">保存済みの作業記録から入力</button>
</div>
</div>

<div id="out" class="section">
<div class="card">
<h2>成果量の記録</h2>
<label>職種・職業</label><input id="ojob" placeholder="例：木こり">
<label>成果物</label><input id="oitem" placeholder="例：木の枝">
<label>街名</label><input id="ocity" placeholder="例：王都">
<div class="grid2"><div><label>座標X</label><input id="ox" type="number" step="any"></div><div><label>座標Y</label><input id="oy" type="number" step="any"></div></div>
<label>成果量</label><input id="oqty" type="number" min="0" step="0.0001" placeholder="例：561">
<label>作業回数</label><input id="ocount" type="number" min="1" value="50">
<label>単位</label><input id="ounit" placeholder="例：個、kg、本">
<button onclick="calcOut()">成果量を計算</button>
<div id="or" class="result"></div>
<button onclick="addOut()">成果量を保存</button><button class="sub" onclick="pickRecord('o')">保存済みの成果量記録から入力</button>
</div>
</div>

<div id="log" class="section">
<div class="card"><h2>保存した記録</h2><div id="salesLog"></div><hr><div id="workLog"></div><hr><div id="outLog"></div></div>
<div class="card"><button class="del" onclick="clearRecords()">記録だけ全削除</button><p class="note">以前のxpcalcの記録キー（xpcalc_all_v4）も自動で読み込みます。</p></div>
</div>

<div id="memo" class="section">
<div class="card">
<h2>📝 備忘録</h2>
<div class="note">ゲーム内の掲示板・取引メモ・攻略メモなどを、そのまま貼り付けて保存できます。</div>
<label>タイトル</label><input id="mtitle" placeholder="例：ポーション交換募集">
<div class="smallgrid">
<div><label>カテゴリ</label><select id="mcat"><option>取引</option><option>募集</option><option>攻略</option><option>ゲーム</option><option>その他</option></select></div>
<div><label>街名</label><input id="mcity" placeholder="任意"></div>
<div><label>タグ</label><input id="mtags" placeholder="例：ポーション,募集"></div>
</div>
<label>求（欲しいもの）</label><input id="mwant" placeholder="例：獣の肉100">
<label>出（出せるもの）</label><input id="moffer" placeholder="例：G 10000">
<label>募集期限</label><input id="mdeadline" type="date">
<label>内容</label><textarea id="mtext" placeholder="ここに掲示板の文章などをそのまま貼り付け"></textarea>
<button onclick="addMemo()">備忘録を保存</button>
</div>
<div class="card">
<h2>保存済み備忘録</h2>
<input class="search" id="msearch" placeholder="タイトル・内容・求・出・タグ・街名を検索" oninput="renderMemos()">
<div class="smallgrid">
<select id="mfilter" onchange="renderMemos()"><option value="">すべてのカテゴリ</option><option>取引</option><option>募集</option><option>攻略</option><option>ゲーム</option><option>その他</option></select>
<select id="mstatus" onchange="renderMemos()"><option value="">期限すべて</option><option value="active">期限内・期限なし</option><option value="expired">期限切れ</option></select>
<select id="msort" onchange="renderMemos()"><option value="new">新しい順</option><option value="old">古い順</option><option value="deadline">期限順</option></select>
</div>
<div id="memoList"></div>
</div>
<div class="card"><button class="del" onclick="clearMemos()">備忘録だけ全削除</button></div>
</div>
</div>

<div id="book" class="section">
<div class="card">
<h2>📖 図鑑登録</h2>
<div class="note">ゲーム内の作業・アイテム・NPC・場所・イベントなどを登録して、あとから検索できます。</div>
<label>名前・項目名</label><input id="bname" placeholder="例：スノーマンを呼び出す">
<div class="smallgrid">
<div><label>カテゴリ</label><select id="bcat"><option>作業</option><option>アイテム</option><option>NPC</option><option>場所</option><option>イベント</option><option>その他</option></select></div>
<div><label>職種・職業</label><input id="bjob" placeholder="任意"></div>
<div><label>必要Lv</label><input id="blv" type="number" min="0" step="1"></div>
<div><label>街名</label><input id="bcity" placeholder="任意"></div>
<div><label>座標X</label><input id="bx" placeholder="任意"></div>
<div><label>座標Y</label><input id="by" placeholder="任意"></div>
</div>
<label>条件・効果</label><textarea id="bcond" placeholder="条件や効果"></textarea>
<label>必要素材・消費アイテム</label><textarea id="bmat" placeholder="必要素材・消費するアイテム"></textarea>
<label>成果・入手物</label><textarea id="bout" placeholder="成果物・入手できるもの"></textarea>
<label>その他</label><textarea id="bextra" placeholder="時間・価格・回数など"></textarea>
<label>画像</label><input id="bimage" type="file" accept="image/*" onchange="previewBookImage()">
<div id="bpreview"></div>
<label>メモ</label><textarea id="bnote" placeholder="自由メモ"></textarea>
<button onclick="addBook()">図鑑に登録</button> <button class="sub" onclick="clearBookForm()">入力をクリア</button>
</div>
<div class="card">
<h2>登録済み図鑑</h2>
<input class="search" id="bsearch" placeholder="名前・条件・素材・成果物などを検索" oninput="renderBooks()">
<select id="bfilter" onchange="renderBooks()"><option value="">すべてのカテゴリ</option><option>作業</option><option>アイテム</option><option>NPC</option><option>場所</option><option>イベント</option><option>その他</option></select>
<div id="bookList"></div>
</div>
<div class="card"><button class="del" onclick="clearBooks()">図鑑だけ全削除</button></div>
</div>

<script>
const KEY='xpcalc_all_v4';
let records=JSON.parse(localStorage.getItem(KEY)||'[]');
if(!records.length){const old=JSON.parse(localStorage.getItem('xpcalc_all_v3')||'[]');if(old.length)records=old}
const MEMOKEY='xpcalc_memos_v1';
let memos=JSON.parse(localStorage.getItem(MEMOKEY)||'[]');

function val(id){return document.getElementById(id).value}
function num(id){return Number(val(id))||0}
function f(x){return Number(x).toLocaleString('ja-JP',{maximumFractionDigits:8})}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
 document.getElementById('tab'+id).classList.add('active');
 if(id==='log')render();
 if(id==='memo')renderMemos();
 if(id==='book')renderBooks();
}
function calcXP(){
 const lv=num('level'),cur=num('current'),gain=num('gain'),count=num('count');
 if(gain<=0){document.getElementById('xpResult').innerHTML='増加経験値を入力してください。';return}
 const total=cur+gain*count,up=Math.floor(total/100),remain=total%100,need=Math.max(0,Math.ceil((100-cur)/gain-1e-12));
 document.getElementById('xpResult').innerHTML='<div class="big">Lv '+(lv+up)+' / 経験値 '+f(remain)+'%</div><div>'+count+'回で <b>+'+f(gain*count)+'%</b><br>次のLVまで <b>'+need+'回</b></div>';
}
function addSale(){
 const count=num('scount'),gain=num('sgain');
 if(!count||gain<=0){alert('販売数と増加経験値を入力してください。');return}
 records.push({type:'s',date:new Date().toLocaleString('ja-JP'),job:val('sjob').trim(),name:val('sitem').trim(),city:val('scity').trim(),lv:num('slv'),price:num('sprice'),count,gain});
 saveRecords();show('log');
}
function addWork(){
 const count=num('wcount'),gain=num('wgain');
 if(!count||gain<=0){alert('作業回数と増加経験値を入力してください。');return}
 records.push({type:'w',date:new Date().toLocaleString('ja-JP'),job:val('wjob').trim(),name:val('wname').trim(),city:val('wcity').trim(),x:val('wx'),y:val('wy'),lv:num('wlv'),count,gain});
 saveRecords();show('log');
}
function calcOut(){
 const q=num('oqty'),c=num('ocount'),u=val('ounit')||'個';
 if(!q||!c){document.getElementById('or').innerHTML='成果量と作業回数を入力してください。';return}
 document.getElementById('or').innerHTML='<div>1回あたり：<b>'+f(q/c)+u+'</b></div><div class="big">50回期待値：'+f(q/c*50)+u+'</div>';
}
function addOut(){
 const q=num('oqty'),c=num('ocount');
 if(!q||!c){alert('成果量と作業回数を入力してください。');return}
 records.push({type:'o',date:new Date().toLocaleString('ja-JP'),job:val('ojob').trim(),name:val('oitem').trim(),city:val('ocity').trim(),x:val('ox'),y:val('oy'),qty:q,count:c,unit:val('ounit')||'個'});
 saveRecords();show('log');
}
function saveRecords(){localStorage.setItem(KEY,JSON.stringify(records));render()}
function render(){
 const s=records.filter(x=>x.type==='s'),w=records.filter(x=>x.type==='w'),o=records.filter(x=>x.type==='o');
 document.getElementById('salesLog').innerHTML=table(s,'s');
 document.getElementById('workLog').innerHTML=table(w,'w');
 document.getElementById('outLog').innerHTML=outTable(o);
}
function table(arr,type){
 if(!arr.length)return '<h3>'+ (type==='s'?'販売記録':'作業記録') +'</h3><p class="note">まだ記録がありません。</p>';
 let h=type==='s'?'<tr><th>日時</th><th>職種</th><th>販売物</th><th>街</th><th>Lv</th><th>価格</th><th>販売数</th><th>売上</th><th>XP</th><th></th></tr>':'<tr><th>日時</th><th>職種</th><th>作業名</th><th>街</th><th>座標</th><th>Lv</th><th>回数</th><th>XP</th><th>1回XP</th><th></th></tr>';
 return '<h3>'+ (type==='s'?'販売記録':'作業記録') +'</h3><div class="tablewrap"><table>'+h+arr.map(x=>{
 const i=records.indexOf(x);
 if(type==='s'){const rev=(x.price||0)*x.count;return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.job)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.city||'')+'</td><td>'+x.lv+'</td><td>'+f(x.price||0)+' G</td><td>'+f(x.count)+'</td><td>'+f(rev)+' G</td><td>+'+f(x.gain)+'%</td><td><button class="edit" onclick="copyRecord('+i+')">コピー</button><button class="del" onclick="delRecord('+i+')">削除</button></td></tr>'}
 return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.job)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.city||'')+'</td><td>'+esc((x.x??'')+(x.x!==undefined&&x.y!==undefined?', ':'')+(x.y??''))+'</td><td>'+x.lv+'</td><td>'+f(x.count)+'回</td><td>+'+f(x.gain)+'%</td><td>+'+f(x.gain/x.count)+'%</td><td><button class="edit" onclick="copyRecord('+i+')">コピー</button><button class="del" onclick="delRecord('+i+')">削除</button></td></tr>'
 }).join('')+'</table></div>';
}
function outTable(arr){
 if(!arr.length)return '<h3>成果量記録</h3><p class="note">まだ記録がありません。</p>';
 return '<h3>成果量記録</h3><div class="tablewrap"><table><tr><th>日時</th><th>職種</th><th>成果物</th><th>街</th><th>座標</th><th>成果量</th><th>回数</th><th>平均</th><th>50回期待値</th><th></th></tr>'+arr.map(x=>{const i=records.indexOf(x),a=x.qty/x.count;return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.job)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.city||'')+'</td><td>'+esc((x.x??'')+(x.x!==undefined&&x.y!==undefined?', ':'')+(x.y??''))+'</td><td>'+f(x.qty)+esc(x.unit)+'</td><td>'+f(x.count)+'回</td><td>'+f(a)+esc(x.unit)+'</td><td>'+f(a*50)+esc(x.unit)+'</td><td><button class="edit" onclick="copyRecord('+i+')">コピー</button><button class="del" onclick="delRecord('+i+')">削除</button></td></tr>'}).join('')+'</table></div>';
}
function setv(id,v){const e=document.getElementById(id);if(e)e.value=v??''}
function fillRecord(x){
 if(x.type==='s'){setv('sjob',x.job);setv('sitem',x.name);setv('scity',x.city);setv('slv',x.lv);setv('sprice',x.price);setv('scount',x.count);setv('sgain',x.gain);show('xp');}
 else if(x.type==='w'){setv('wjob',x.job);setv('wname',x.name);setv('wcity',x.city);setv('wx',x.x);setv('wy',x.y);setv('wlv',x.lv);setv('wcount',x.count);setv('wgain',x.gain);show('xp');}
 else {setv('ojob',x.job);setv('oitem',x.name);setv('ocity',x.city);setv('ox',x.x);setv('oy',x.y);setv('oqty',x.qty);setv('ocount',x.count);setv('ounit',x.unit);show('out');calcOut();}
}
function copyRecord(i){const x=records[i];if(x)fillRecord(x)}
function pickRecord(type){
 const arr=records.filter(x=>x.type===type).slice(-30).reverse();
 if(!arr.length){alert('保存済みの記録がありません。');return}
 const labels=arr.map((x,i)=>{if(type==='s')return (i+1)+': '+(x.job||'')+' / '+(x.name||'')+' / '+f(x.count)+'個';if(type==='w')return (i+1)+': '+(x.job||'')+' / '+(x.name||'')+' / '+f(x.count)+'回';return (i+1)+': '+(x.job||'')+' / '+(x.name||'')+' / '+f(x.qty)+((x.unit)||'個')});
 const n=prompt('入力したい記録の番号を入力してください。\n'+labels.join('\n'));
 const idx=Number(n)-1;if(Number.isInteger(idx)&&arr[idx])fillRecord(arr[idx]);
}
function calcSellRate(){
 const stock=num('stock'),sold=num('sold'),hours=num('hours'),out=document.getElementById('sellRateResult');
 if(stock<=0||sold<=0||hours<=0){out.innerHTML='在庫数・売れた数・経過時間を入力してください。';return}
 const rate=sold/hours,remaining=Math.max(0,stock-sold),remainH=remaining/rate,totalH=stock/rate;
 out.innerHTML='販売ペース：<b>'+f(rate)+'</b>個/時間<br>残り：<b>'+f(remaining)+'</b>個<br>完売まであと：<b>'+formatDuration(remainH)+'</b><br>最初から完売まで：<b>'+formatDuration(totalH)+'</b>';
}
function formatDuration(h){if(h<1)return Math.round(h*60)+'分';const hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'時間'+(mm?' '+mm+'分':'')}

function delRecord(i){records.splice(i,1);saveRecords()}
function clearRecords(){if(confirm('経験値・販売・作業・成果量の記録をすべて削除しますか？')){records=[];saveRecords();}}

function addMemo(){
 const title=val('mtitle').trim(),text=val('mtext').trim();
 if(!title&&!text){alert('タイトルか内容を入力してください。');return}
 memos.push({id:Date.now(),date:new Date().toLocaleString('ja-JP'),title,cat:val('mcat'),city:val('mcity').trim(),tags:val('mtags').trim(),want:val('mwant').trim(),offer:val('moffer').trim(),deadline:val('mdeadline'),text});
 localStorage.setItem(MEMOKEY,JSON.stringify(memos));
 ['mtitle','mcity','mtags','mwant','moffer','mdeadline','mtext'].forEach(id=>document.getElementById(id).value='');
 renderMemos();
}
function memoExpired(m){return m.deadline && m.deadline < new Date().toISOString().slice(0,10)}
function renderMemos(){
 const q=val('msearch').trim().toLowerCase(),cat=val('mfilter'),status=val('mstatus'),sort=val('msort');
 let arr=memos.filter(m=>{
  const hay=[m.title,m.text,m.want,m.offer,m.tags,m.city,m.cat].join(' ').toLowerCase();
  if(q&&!hay.includes(q))return false;
  if(cat&&m.cat!==cat)return false;
  if(status==='active'&&memoExpired(m))return false;
  if(status==='expired'&&!memoExpired(m))return false;
  return true;
 });
 arr.sort((a,b)=>sort==='old'?a.id-b.id:sort==='deadline'?(a.deadline||'9999').localeCompare(b.deadline||'9999'):b.id-a.id);
 document.getElementById('memoList').innerHTML=arr.length?arr.map(m=>{
  const exp=memoExpired(m);
  return '<div class="memo '+(exp?'expired':'')+'"><div class="memohead"><div><div class="memoTitle">'+esc(m.title||'無題')+'</div><span class="badge">'+esc(m.cat)+'</span>'+(m.city?'<span class="badge">'+esc(m.city)+'</span>':'')+(m.deadline?'<span class="badge deadline">'+(exp?'期限切れ：':'期限：')+esc(m.deadline)+'</span>':'')+'</div><div class="actions"><button class="edit" onclick="copyMemo('+m.id+')">コピー</button><button class="del" onclick="delMemo('+m.id+')">削除</button></div></div>'+
  (m.want?'<div><span class="badge want">求</span>'+esc(m.want)+'</div>':'')+
  (m.offer?'<div><span class="badge offer">出</span>'+esc(m.offer)+'</div>':'')+
  '<div class="memoText">'+esc(m.text)+'</div>'+
  (m.tags?'<div>'+m.tags.split(',').map(t=>'<span class="badge">#'+esc(t.trim())+'</span>').join('')+'</div>':'')+
  '<div class="note">保存：'+esc(m.date)+'</div></div>'
 }).join(''):'<p class="note">該当する備忘録はありません。</p>';
}
function delMemo(id){if(confirm('この備忘録を削除しますか？')){memos=memos.filter(m=>m.id!==id);localStorage.setItem(MEMOKEY,JSON.stringify(memos));renderMemos()}}
function copyMemo(id){
 const m=memos.find(x=>x.id===id);if(!m)return;
 const text=(m.want?'求）'+m.want+'\n':'')+(m.offer?'出）'+m.offer+'\n':'')+(m.deadline?'期限）'+m.deadline+'\n':'')+m.text;
 navigator.clipboard?.writeText(text).then(()=>alert('コピーしました。')).catch(()=>prompt('コピー用テキスト',text));
}
function clearMemos(){if(confirm('備忘録をすべて削除しますか？')){memos=[];localStorage.setItem(MEMOKEY,'[]');renderMemos()}}

const BOOKKEY='xpcalc_book_v1';
let books=JSON.parse(localStorage.getItem(BOOKKEY)||'[]');
let bookImageData='';
function previewBookImage(){
 const file=document.getElementById('bimage').files[0]; if(!file)return;
 const reader=new FileReader(); reader.onload=e=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);bookImageData=c.toDataURL('image/jpeg',0.72);document.getElementById('bpreview').innerHTML='<img class="bookImg" src="'+bookImageData+'">'};img.src=e.target.result};reader.readAsDataURL(file);
}
function addBook(){
 const name=val('bname').trim(); if(!name){alert('名前・項目名を入力してください。');return}
 books.push({id:Date.now(),date:new Date().toLocaleString('ja-JP'),name,cat:val('bcat'),job:val('bjob').trim(),lv:num('blv'),city:val('bcity').trim(),cond:val('bcond').trim(),mat:val('bmat').trim(),out:val('bout').trim(),x:val('bx'),y:val('by'),extra:val('bextra').trim(),image:bookImageData,note:val('bnote').trim()});
 localStorage.setItem(BOOKKEY,JSON.stringify(books)); clearBookForm(); renderBooks();
}
function clearBookForm(){['bname','bjob','blv','bcity','bcond','bmat','bout','bx','by','bextra','bnote','bimage'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});bookImageData='';document.getElementById('bpreview').innerHTML=''}
function renderBooks(){
 const q=val('bsearch').trim().toLowerCase(),cat=val('bfilter');
 let arr=books.filter(b=>{const hay=[b.name,b.cat,b.job,b.city,b.cond,b.mat,b.out,b.extra,b.note].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!cat||b.cat===cat)}).sort((a,b)=>b.id-a.id);
 document.getElementById('bookList').innerHTML=arr.length?arr.map(b=>{
  const i=books.indexOf(b),coord=(b.x!==''||b.y!=='')?(b.x||'')+', '+(b.y||''):'';
  return '<div class="book">'+(b.image?'<img class="bookImg" src="'+b.image+'">':'')+'<div class="bookTitle">'+esc(b.name)+'</div><span class="badge bookcat">'+esc(b.cat)+'</span>'+(b.job?'<span class="badge">'+esc(b.job)+'</span>':'')+(b.lv?'<span class="badge">Lv '+esc(b.lv)+'</span>':'')+(b.city?'<span class="badge">'+esc(b.city)+'</span>':'')+(coord?'<div class="bookRow"><span class="bookLabel">座標：</span>'+esc(coord)+'</div>':'')+(b.cond?'<div class="bookRow"><span class="bookLabel">条件・効果：</span>'+esc(b.cond)+'</div>':'')+(b.mat?'<div class="bookRow"><span class="bookLabel">必要素材・消費：</span>'+esc(b.mat)+'</div>':'')+(b.out?'<div class="bookRow"><span class="bookLabel">成果・入手：</span>'+esc(b.out)+'</div>':'')+(b.extra?'<div class="bookRow"><span class="bookLabel">その他：</span>'+esc(b.extra)+'</div>':'')+(b.note?'<div class="bookRow"><span class="bookLabel">メモ：</span>'+esc(b.note)+'</div>':'')+'<div class="note">登録：'+esc(b.date)+'</div><div class="bookActions"><button class="edit" onclick="copyBook('+i+')">コピーして新規登録</button><button class="del" onclick="delBook('+i+')">削除</button></div></div>';
 }).join(''):'<p class="note">まだ図鑑登録がありません。</p>';
}
function copyBook(i){const b=books[i];if(!b)return;['bname','bjob','blv','bcity','bcond','bmat','bout','bx','by','bextra','bnote'].forEach(id=>setv(id,''));setv('bname',b.name);setv('bcat',b.cat);setv('bjob',b.job);setv('blv',b.lv);setv('bcity',b.city);setv('bcond',b.cond);setv('bmat',b.mat);setv('bout',b.out);setv('bx',b.x);setv('by',b.y);setv('bextra',b.extra);setv('bnote',b.note);bookImageData=b.image||'';document.getElementById('bpreview').innerHTML=bookImageData?'<img class="bookImg" src="'+bookImageData+'">':'';alert('図鑑登録フォームにコピーしました。必要なところだけ変更して登録できます。')}
function delBook(i){if(confirm('この図鑑項目を削除しますか？')){books.splice(i,1);localStorage.setItem(BOOKKEY,JSON.stringify(books));renderBooks()}}
function clearBooks(){if(confirm('図鑑をすべて削除しますか？')){books=[];localStorage.setItem(BOOKKEY,'[]');renderBooks()}}
render();
renderBooks();
</script>
