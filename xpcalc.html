<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLDOUT2 経験値計算</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;margin:0;padding:10px;color:#222}.wrap{max-width:760px;margin:auto}h1{font-size:21px;margin:4px 0}.sub,.note{font-size:12px;color:#666;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.tab,button{border:0;border-radius:8px;padding:10px;font-size:15px;font-weight:700;background:#333;color:#fff}.tab{background:#ddd;color:#333}.tab.on{background:#333;color:#fff}.panel{display:none}.panel.on{display:block}.card{background:#fff;border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 1px 5px #ddd}h2{font-size:17px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}textarea{min-height:85px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.light{background:#eee;color:#222}.result{margin-top:10px;padding:10px;background:#f7f7f7;border-radius:8px;line-height:1.75}.big{font-size:21px;font-weight:800}.warn{background:#fff5d8;padding:9px;border-radius:8px;font-size:12px;line-height:1.5;margin-top:8px}.history{border:1px solid #ddd;border-radius:8px;padding:8px;margin-top:7px}@media(max-width:520px){.grid,.actions{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>SOLDOUT2 経験値計算</h1><p class="sub">経験値計算と販売経験値の減衰計算を分離しています。</p>
<div class="tabs"><button class="tab on" onclick="tab('exp',this)">経験値計算</button><button class="tab" onclick="tab('decay',this)">減衰計算</button></div>

<section id="exp" class="panel on">
<div class="card"><h2>データ取り込み</h2><textarea id="imp" placeholder="例：19個販売　経験値 +0.01%&#10;50回作業　経験値 +0.25%"></textarea><div class="actions"><button onclick="parse('sale')">販売へ取り込む</button><button onclick="parse('work')">作業へ取り込む</button></div><p id="imsg" class="note"></p></div>

<div class="card"><h2>作業経験値</h2><div class="grid">
<div><label>現在Lv</label><input id="wl" type="number" min="1" value="8"></div><div><label>現在経験値（%）</label><input id="wc" type="number" min="0" max="99.999999" step="0.0000001" value="99.92"></div>
<div><label>基礎作業時間（分）</label><input id="wb" type="number" min="0" step="0.001" placeholder="例：30"></div><div><label>作業速度（%）</label><input id="ws" type="number" min="0.001" value="100" step="0.001"></div>
<div><label>基準作業回数</label><input id="wn" type="number" min="1" value="1"></div><div><label>実測経験値（任意）</label><input id="wg" type="number" min="0" step="0.0000001" placeholder="例：0.0147"></div></div>
<div class="actions"><button onclick="work()">作業を計算</button><button class="light" onclick="copy('wr')">結果をコピー</button></div><div id="wr" class="result"></div>
<p class="note">実測経験値があればそれを使用。なければ「基礎作業時間÷作業速度」から予想作業時間を出し、1分=1ポイントとして計算する構成です。内部値は0.01%未満も保持します。</p></div>

<div class="card"><h2>販売経験値</h2><div class="grid">
<div><label>現在Lv</label><input id="sl" type="number" min="1" value="8"></div><div><label>現在経験値（%）</label><input id="sc" type="number" min="0" max="99.999999" step="0.0000001" value="99.92"></div>
<div><label>販売数</label><input id="sn" type="number" min="1" value="19"></div><div><label>今回の売上（g）</label><input id="sr" type="number" min="0" placeholder="例：100000"></div>
<div><label>実測経験値（%）</label><input id="sg" type="number" min="0" step="0.0000001" placeholder="例：0.01"></div><div><label>販売物</label><input id="sname" placeholder="例：ハイポーション"></div></div>
<div class="actions"><button onclick="sale()">販売を計算</button><button class="light" onclick="copy('rr')">結果をコピー</button></div><div id="rr" class="result"></div><p class="note">ここでは減衰を勝手に適用しません。減衰は右のタブで管理します。</p></div>
</section>

<section id="decay" class="panel">
<div class="card"><h2>販売経験値・減衰計算</h2><div class="grid">
<div><label>現在Lv</label><input id="dl" type="number" min="1" value="8"></div><div><label>現在経験値（%）</label><input id="dc" type="number" min="0" max="99.999999" step="0.0000001" value="99.92"></div>
<div><label>本日受け取り済み売上（g）</label><input id="dr" type="number" min="0" value="0"></div><div><label>次に受け取る売上（g）</label><input id="dn" type="number" min="0" placeholder="例：100000"></div></div>
<div class="actions"><button onclick="decay()">減衰を計算</button><button class="light" onclick="add()">受取履歴に追加</button></div><div id="dres" class="result"></div>
<div class="warn">正確な減衰式を確認できるまでは、未確認の式を自動適用しません。ここでは「受取済み＋次回受取」を正確に記録・整理します。</div></div>
<div class="card"><h2>本日の受取履歴</h2><div id="hist"></div><div class="actions"><button class="light" onclick="sum()">合計を反映</button><button class="light" onclick="clearH()">履歴を消去</button></div></div>
</section></div>
<script>
const $=id=>document.getElementById(id),N=id=>Number($(id).value)||0,F=x=>Number(x).toLocaleString('ja-JP',{maximumFractionDigits:8});
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');b.classList.add('on')}
function work(){let c=N('wc'),n=N('wn'),g=N('wg'),t=N('wb')/(N('ws')/100);if(!g&&t>0)g=t/100;if(c<0||c>=100||n<=0||g<=0){$('wr').innerHTML='<div class="warn">現在経験値・回数・経験値を確認してください。</div>';return}let p=g/n,r=100-c,q=r/p;$('wr').innerHTML=`現在Lv：${N('wl')}<br>現在経験値：${F(c)}%<br>LVアップまで：${F(r)}%<hr>${t?`予想作業時間：${F(t)}分<br>`:''}1回あたり：+${F(p)}%<br>理論上あと：${F(q)}回<div class="big">あと ${Math.ceil(q).toLocaleString()}回でLVアップ（推定）</div>`}
function sale(){let c=N('sc'),n=N('sn'),g=N('sg');if(c<0||c>=100||n<=0||g<=0){$('rr').innerHTML='<div class="warn">販売数・現在経験値・実測経験値を確認してください。</div>';return}let p=g/n,r=100-c,q=r/p;$('rr').innerHTML=`現在Lv：${N('sl')}<br>現在経験値：${F(c)}%<br>LVアップまで：${F(r)}%<hr>${N('sr')?`今回の売上：${F(N('sr'))}g<br>`:''}1販売あたり：+${F(p)}%<br>理論上あと：${F(q)}販売<div class="big">あと ${Math.ceil(q).toLocaleString()}販売でLVアップ（推定）</div>`}
function parse(k){let t=$('imp').value,m=t.match(/([\d,]+)\s*個?\s*販売/),w=t.match(/([\d,]+)\s*回/),g=t.match(/(?:経験値|EXP)[^\d]*([0-9]+(?:\.[0-9]+)?)/i),num=k==='sale'?(m?m[1]:0):(w?w[1]:0),gain=g?g[1]:0;if(k==='sale'){if(num)$('sn').value=String(num).replace(/,/g,'');if(gain)$('sg').value=gain}else{if(num)$('wn').value=String(num).replace(/,/g,'');if(gain)$('wg').value=gain}$('imsg').textContent=`${k==='sale'?'販売':'作業'}へ取り込み：${num||'未検出'} / ${gain||'未検出'}%。確認してから計算してください。`}
function hist(){try{return JSON.parse(localStorage.xph||'[]')}catch(e){return[]}}
function show(){let h=hist();$('hist').innerHTML=h.length?h.map((x,i)=>`<div class="history">${x.time}　<b>${F(x.a)}g</b>　<button class="light" onclick="del(${i})">削除</button></div>`).join(''):'<p class="note">受取履歴なし</p>'}
function add(){let a=N('dn');if(a<=0)return;let h=hist();h.push({a,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});localStorage.xph=JSON.stringify(h);$('dn').value='';show();sum()}
function sum(){$('dr').value=hist().reduce((a,x)=>a+Number(x.a),0)}
function del(i){let h=hist();h.splice(i,1);localStorage.xph=JSON.stringify(h);show();sum()}
function clearH(){localStorage.removeItem('xph');show();sum()}
function decay(){let a=N('dr'),b=N('dn');$('dres').innerHTML=`現在Lv：${N('dl')}<br>現在経験値：${F(N('dc'))}%<hr>本日受取済み：${F(a)}g<br>次回受取：${F(b)}g<br><b>次回受取後の累計：${F(a+b)}g</b><div class="big">減衰計算の入力状態を確認しました</div>`}
function copy(id){navigator.clipboard?.writeText($(id).innerText);alert('コピーしました')}
work();sale();show();
</script></body></html>
