<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経験値取得シミュレーター</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f4f4f7;color:#222}
.wrap{max-width:600px;margin:auto;padding:18px}
h1{text-align:center;font-size:24px}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:bold;margin:12px 0 6px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;font-size:17px;font-weight:bold}
.result{font-size:17px;line-height:1.8}
.big{text-align:center;font-size:27px;font-weight:bold;margin:8px}
.small{color:#666;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
hr{border:0;border-top:1px solid #eee;margin:15px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>経験値取得シミュレーター</h1>

<div class="card">
<label>現在レベル</label>
<input id="level" type="number" value="8" min="1">

<label>現在の経験値（%）</label>
<input id="current" type="number" value="99.92" min="0" max="100" step="0.01">

<label>経験値の基準</label>
<div class="small">「販売数」と「作業回数」の両方を設定できます。</div>

<div class="row">
<div>
<label>販売数</label>
<input id="sales" type="number" value="19" min="0">
</div>
<div>
<label>販売1個あたり経験値（%）</label>
<input id="salesGain" type="number" value="0" min="0" step="0.001">
</div>
</div>

<div class="row">
<div>
<label>作業回数</label>
<input id="work" type="number" value="1" min="0">
</div>
<div>
<label>作業1回あたり経験値（%）</label>
<input id="workGain" type="number" value="0.01" min="0" step="0.001">
</div>
</div>

<label>追加の販売数（シミュレーション）</label>
<input id="addSales" type="number" value="0" min="0">

<label>追加の作業回数（シミュレーション）</label>
<input id="addWork" type="number" value="100" min="0">

<button onclick="calc()">計算する</button>
</div>

<div class="card result">
<div class="big" id="final">---</div>
<div id="detail"></div>
</div>

<div class="card result">
<b>LVアップまで</b>
<div id="need">---</div>
</div>

<div class="card small">
<b>計算方法</b><br>
販売による経験値 ＋ 作業による経験値 ＋ 現在経験値 で計算します。<br>
販売数と作業回数は別々に入力できるので、ゲーム内の「販売数」と「作業回数」が違うケースにも対応しています。
</div>
</div>

<script>
function n(id){return Number(document.getElementById(id).value)||0;}
function calc(){
 const lv=n('level'), cur=n('current');
 const sales=n('sales'), salesGain=n('salesGain');
 const work=n('work'), workGain=n('workGain');
 const addSales=n('addSales'), addWork=n('addWork');

 const totalSales=sales+addSales;
 const totalWork=work+addWork;
 const salesExp=totalSales*salesGain;
 const workExp=totalWork*workGain;
 const total=cur+salesExp+workExp;

 const ups=Math.floor(total/100);
 const remain=total-ups*100;
 const finalLv=lv+ups;

 const perAction = salesGain+workGain;
 const need=perAction>0 ? Math.ceil(Math.max(0,100-cur)/perAction) : 0;

 document.getElementById('final').textContent=`LV${finalLv}　${remain.toFixed(3)}%`;
 document.getElementById('detail').innerHTML=
 `販売数：<b>${totalSales}</b>個 → 経験値 <b>${salesExp.toFixed(3)}%</b><br>`+
 `作業回数：<b>${totalWork}</b>回 → 経験値 <b>${workExp.toFixed(3)}%</b><br>`+
 `今回増加する経験値：<b>${(salesExp+workExp).toFixed(3)}%</b><br>`+
 `レベルアップ：<b>${ups}回</b><hr>`+
 `最終経験値：<b>${remain.toFixed(3)}%</b>`;

 document.getElementById('need').innerHTML=
 `現在のLV${lv} → LV${lv+1} に必要：<b>${Math.max(0,100-cur).toFixed(3)}%</b><br>`+
 `販売＋作業を1セットとした場合の目安：<b>${need}セット</b>`;
}
calc();
</script>
</body>
</html>
