<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経験値取得シミュレーター_販売数_作業回数対応</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;margin:0;padding:16px;color:#222}
.container{max-width:700px;margin:auto}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #ddd}
h1{font-size:21px} h2{font-size:17px;margin-top:0}
label{display:block;font-weight:bold;margin:10px 0 5px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#333;color:white;font-size:16px;margin-top:12px}
.result{line-height:1.8;font-size:17px}
.small{font-size:13px;color:#666}
hr{border:0;border-top:1px solid #ddd;margin:14px 0}
</style>
</head>
<body>
<div class="container">
<h1>経験値取得シミュレーター</h1>

<div class="card">
<h2>作業の経験値</h2>
<p class="small">販売とは完全に独立して計算します。</p>

<label>作業回数</label>
<input id="workCount" type="number" min="0" value="0">

<label>1作業で得られる経験値（%）</label>
<input id="workXp" type="number" min="0" step="0.0001" value="0">

<button onclick="calcWork()">作業だけ計算</button>
<div id="workResult" class="result"></div>
</div>

<div class="card">
<h2>販売の経験値</h2>
<p class="small">作業とは完全に独立して計算します。作業回数から販売数を算出しません。</p>

<label>販売数</label>
<input id="saleCount" type="number" min="0" value="0">

<label>1販売で得られる経験値（%）</label>
<input id="saleXp" type="number" min="0" step="0.0001" value="0">

<button onclick="calcSale()">販売だけ計算</button>
<div id="saleResult" class="result"></div>
</div>

<div class="card">
<h2>完全分離の確認</h2>
<p class="small">
作業の計算では販売数を一切使用しません。<br>
販売の計算では作業回数を一切使用しません。<br>
両者を合算する機能も入れていません。
</p>
</div>
</div>

<script>
function val(id){return Number(document.getElementById(id).value)||0}
function fmt(x){return x.toLocaleString('ja-JP',{maximumFractionDigits:6})}

function calcWork(){
 const count=val('workCount'), xp=val('workXp');
 document.getElementById('workResult').innerHTML=
   '<hr><b>作業で得られる経験値：</b>'+fmt(count*xp)+'%';
}

function calcSale(){
 const count=val('saleCount'), xp=val('saleXp');
 document.getElementById('saleResult').innerHTML=
   '<hr><b>販売で得られる経験値：</b>'+fmt(count*xp)+'%';
}
</script>
</body>
</html>
