<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>経験値取得シミュレーター_販売数_作業回数対応</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
.container{max-width:720px;margin:auto;padding:16px}
h1{font-size:22px;margin:8px 0 18px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #ddd}
h2{font-size:17px;margin:0 0 12px}
label{display:block;margin:10px 0 5px;font-weight:bold}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#333;color:white;font-size:16px;margin-top:14px}
.result{font-size:18px;line-height:1.8}
.note{font-size:13px;color:#666;line-height:1.5}
.sep{border-top:1px solid #ddd;margin:14px 0}
</style>
</head>
<body>
<div class="container">
<h1>経験値取得シミュレーター</h1>

<div class="card">
<h2>① 現在の経験値</h2>
<label>現在Lv</label>
<input id="lv" type="number" value="8" min="1">

<label>現在の経験値（%）</label>
<input id="xp" type="number" value="99.92" min="0" max="100" step="0.01">

<p class="note">Lvアップに必要な経験値量は、ゲーム内で表示される「次のLvまで」の値などに合わせて入力してください。</p>
</div>

<div class="card">
<h2>② 作業による経験値</h2>
<label>作業回数</label>
<input id="workCount" type="number" value="0" min="0">

<label>1作業あたりの経験値（%）</label>
<input id="workXp" type="number" value="0" min="0" step="0.0001">

<p class="note">ここは「作業」だけを計算します。販売数とは連動させません。</p>
</div>

<div class="card">
<h2>③ 販売による経験値</h2>
<label>販売数</label>
<input id="saleCount" type="number" value="19" min="0">

<label>1販売あたりの経験値（%）</label>
<input id="saleXp" type="number" value="0.0005263158" min="0" step="0.0000001">

<p class="note">ここは「販売」だけを計算します。作業回数とは連動させません。</p>
</div>

<div class="card">
<h2>④ Lvアップ設定</h2>
<label>1Lv分の経験値（%）</label>
<input id="lvXp" type="number" value="100" min="0.0001" step="0.01">
</div>

<div class="card">
<button onclick="calc()">計算する</button>
<div id="result" class="result"></div>
</div>
</div>

<script>
function n(id){return Number(document.getElementById(id).value)||0}
function fmt(x,d=4){return x.toLocaleString('ja-JP',{maximumFractionDigits:d})}

function calc(){
  const lv=n('lv');
  const current=n('xp');
  const workCount=n('workCount');
  const workXp=n('workXp');
  const saleCount=n('saleCount');
  const saleXp=n('saleXp');
  const lvXp=n('lvXp');

  const workTotal=workCount*workXp;
  const saleTotal=saleCount*saleXp;
  const total=workTotal+saleTotal;

  let xp=current+total;
  let up=0;
  if(lvXp>0){
    up=Math.floor(xp/lvXp);
    xp=xp%lvXp;
  }

  const finalLv=lv+up;

  document.getElementById('result').innerHTML=
    '<div><b>作業による経験値：</b>'+fmt(workTotal)+'%</div>'+
    '<div><b>販売による経験値：</b>'+fmt(saleTotal)+'%</div>'+
    '<div class="sep"></div>'+
    '<div><b>合計獲得経験値：</b>'+fmt(total)+'%</div>'+
    '<div><b>最終Lv：</b>'+finalLv+'</div>'+
    '<div><b>最終経験値：</b>'+fmt(xp)+'%</div>';
}
calc();
</script>
</body>
</html>
