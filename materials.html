<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLDOUT2 素材管理ツール</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 12px;
    background: #f5f5f5;
    color: #222;
}
.container { max-width: 700px; margin: auto; }
.header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.back-btn {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    background: #e0e0e0;
    color: #333;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}
h1 { font-size: 20px; margin: 0; text-align: center; flex-grow: 1; }
.card {
    background: white;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
h2 { font-size: 15px; margin-top: 0; margin-bottom: 8px; color: #1976d2; }
.help-text { font-size: 11px; color: #666; margin-bottom: 8px; line-height: 1.4; }
textarea, input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 8px;
}
textarea { height: 110px; font-family: monospace; resize: vertical; }
.form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.form-row input { margin-bottom: 0; }
button {
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: bold;
    width: 100%;
}
.primary-btn { background: #1976d2; color: white; }
.secondary-btn { background: #4caf50; color: white; margin-top: 6px; }
.clear-btn { background: #eee; color: #333; margin-top: 6px; }
.danger-btn { background: #e53935; color: white; margin-top: 8px; font-size: 12px; padding: 6px; }
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 13px;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
}
th { background: #f0f0f0; }
.del-btn {
    background: #e53935;
    color: white;
    padding: 4px 8px;
    font-size: 11px;
    width: auto;
    border-radius: 4px;
}
</style>
</head>
<body>

<div class="container">

    <div class="header-bar">
        <a href="index.html" class="back-btn">← 戻る</a>
        <h1>素材管理</h1>
        <div style="width: 60px;"></div>
    </div>

    <!-- ゲーム内テキスト一括取り込み -->
    <div class="card">
        <h2>📋 ゲーム内テキストから自動読み込み</h2>
        <div class="help-text">
            SOLDOUT2の「作業成果」「レシピ」「棚・倉庫」「注文」「取引ログ」などのテキストをそのまま貼り付けて読み込めます。
        </div>
        <textarea id="logInput" placeholder="ここにゲーム内のログやテキストを貼り付け...
例：
薬草 x10
木材 5個 100G
石ころ 100G x 5"></textarea>
        <button class="primary-btn" onclick="parseGameText()">テキストから抽出して登録</button>
    </div>

    <!-- 手動入力 -->
    <div class="card">
        <h2>✏️ 手動入力</h2>
        <input type="text" id="itemName" placeholder="素材・アイテム名 (例: 薬草)">
        <div class="form-row">
            <input type="number" id="itemCount" placeholder="個数" min="1">
            <input type="number" id="itemPrice" placeholder="単価(G)" min="0">
        </div>
        <button class="secondary-btn" onclick="addManualItem()">リストに追加</button>
    </div>

    <!-- 登録素材一覧 -->
    <div class="card">
        <h2>📦 登録素材一覧</h2>
        <table>
            <thead>
                <tr>
                    <th>素材名</th>
                    <th>個数</th>
                    <th>単価</th>
                    <th>合計</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="materialsTable">
                <tr>
                    <td colspan="5" style="text-align: center; color: #888;">データが登録されていません</td>
                </tr>
            </tbody>
        </table>
        <button class="danger-btn" onclick="clearAllItems()">一覧をすべてクリア</button>
    </div>

</div>

<script>
let items = [];

function parseGameText() {
    const text = document.getElementById("logInput").value;
    if (!text.trim()) {
        alert("テキストを入力してください。");
        return;
    }

    const lines = text.split("\n");
    let addedCount = 0;

    lines.forEach(line => {
        let cleanLine = line.replace(/\[.*?\]/g, '').replace(/[\r\n]/g, '').trim();
        if (!cleanLine) return;

        let name = "";
        let count = 0;
        let price = 0;

        // パターン1: 「アイテム名 100G x 5」や「アイテム名 100G 5個」
        let m1 = cleanLine.match(/^(.+?)\s+(\d+)G\s*(?:x|×|個|\s)\s*(\d+)個?$/i);
        // パターン2: 「アイテム名 x10」や「アイテム名 10個」や「アイテム名×10」
        let m2 = cleanLine.match(/^(.+?)\s*(?:x|×|\s)\s*(\d+)個?$/i);
        // パターン3: 「アイテム名 10個 100G」
        let m3 = cleanLine.match(/^(.+?)\s+(\d+)個?\s+(\d+)G$/i);

        if (m1) {
            name = m1[1].trim();
            price = parseInt(m1[2]);
            count = parseInt(m1[3]);
        } else if (m3) {
            name = m3[1].trim();
            count = parseInt(m3[2]);
            price = parseInt(m3[3]);
        } else if (m2) {
            name = m2[1].trim();
            count = parseInt(m2[2]);
            price = 0;
        }

        if (name && count > 0) {
            // 同名素材があれば個数を合算、なければ新規追加
            let existing = items.find(i => i.name === name && i.price === price);
            if (existing) {
                existing.count += count;
            } else {
                items.push({ name, count, price });
            }
            addedCount++;
        }
    });

    if (addedCount > 0) {
        renderTable();
        document.getElementById("logInput").value = "";
    } else {
        alert("有効な素材情報が見つかりませんでした。");
    }
}

function addManualItem() {
    const name = document.getElementById("itemName").value.trim();
    const count = parseInt(document.getElementById("itemCount").value) || 0;
    const price = parseInt(document.getElementById("itemPrice").value) || 0;

    if (!name || count <= 0) {
        alert("素材名と正しい個数を入力してください。");
        return;
    }

    let existing = items.find(i => i.name === name && i.price === price);
    if (existing) {
        existing.count += count;
    } else {
        items.push({ name, count, price });
    }

    renderTable();
    document.getElementById("itemName").value = "";
    document.getElementById("itemCount").value = "";
    document.getElementById("itemPrice").value = "";
}

function deleteItem(index) {
    items.splice(index, 1);
    renderTable();
}

function clearAllItems() {
    if (items.length === 0) return;
    if (confirm("登録された素材をすべて削除しますか？")) {
        items = [];
        renderTable();
    }
}

function renderTable() {
    const tbody = document.getElementById("materialsTable");
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">データが登録されていません</td></tr>';
        return;
    }

    tbody.innerHTML = items.map((item, index) => `
        <tr>
            <td><strong>${item.name}</strong></td>
            <td>${item.count.toLocaleString()}</td>
            <td>${item.price > 0 ? item.price.toLocaleString() + ' G' : '-'}</td>
            <td>${(item.count * item.price).toLocaleString()} G</td>
            <td><button class="del-btn" onclick="deleteItem(${index})">削除</button></td>
        </tr>
    `).join("");
}
</script>

</body>
</html>
